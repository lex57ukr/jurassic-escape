    const JurassicEscape = () => {
      const canvasRef = useRef(null);
      const [gameState, setGameState] = useState(GAME_CONSTANTS.GAME_STATES.MENU);
      const [score, setScore] = useState(0);
      const [playerHealth, setPlayerHealth] = useState(GAME_CONSTANTS.PLAYER.MAX_HEALTH);
      const [playerAmmo, setPlayerAmmo] = useState(GAME_CONSTANTS.PLAYER.START_AMMO);
      const [playerTranqAmmo, setPlayerTranqAmmo] = useState(GAME_CONSTANTS.WEAPONS.TRANQUILIZER.startAmmo);
      const [currentWeapon, setCurrentWeapon] = useState(GAME_CONSTANTS.WEAPONS.REGULAR);
      const [currentLevel, setCurrentLevel] = useState(1);
      const [speedBoostActive, setSpeedBoostActive] = useState(false);
      const [showPauseMenu, setShowPauseMenu] = useState(false);
      const [canvasSize, setCanvasSize] = useState(GAME_CONSTANTS.VIEWPORTS.medium);
      const [isTouchDevice, setIsTouchDevice] = useState(false);
      const [soundEnabled, setSoundEnabled] = useState(() => {
        const saved = localStorage.getItem('jurassicEscapeSoundEnabled');
        return saved !== null ? JSON.parse(saved) : true;
      });
      const [viewportScale, setViewportScale] = useState(() => {
        const saved = localStorage.getItem('jurassicEscapeViewportScale');
        return saved || 'medium';
      });
      const [volume, setVolume] = useState(() => {
        const saved = localStorage.getItem('jurassicEscapeVolume');
        return saved !== null ? parseFloat(saved) : GAME_CONSTANTS.AUDIO.DEFAULT_VOLUME;
      });
      const [difficulty, setDifficulty] = useState(() => {
        const saved = localStorage.getItem('jurassicEscapeDifficulty');
        return saved || 'normal';
      });
      const [autoAim, setAutoAim] = useState(() => {
        const saved = localStorage.getItem('jurassicEscapeAutoAim');
        if (saved !== null) return JSON.parse(saved);
        // Default to enabled on Easy, disabled otherwise
        const currentDifficulty = localStorage.getItem('jurassicEscapeDifficulty') || 'normal';
        return currentDifficulty === 'easy';
      });
      const [showSettingsMenu, setShowSettingsMenu] = useState(false);

      // Sound system with cloneNode and requestAnimationFrame
      const soundsRef = useRef({});

      const playSound = useCallback((sound) => {
        if (!soundEnabled) return;

        // Extract id from sound object (e.g., SOUNDS.SHOOT has .id property)
        const soundId = sound?.id || sound;
        const soundData = soundsRef.current[soundId];
        if (!soundData) return;

        // Use requestAnimationFrame to defer audio playback off main thread
        requestAnimationFrame(() => {
          // Clone the audio element for simultaneous playback
          const audio = soundData.cloneNode();
          audio.volume = volume;
          audio.play().catch(e => console.log('Audio play failed:', e));

          // Clean up after playing
          audio.addEventListener('ended', () => {
            audio.remove();
          });
        });
      }, [soundEnabled, volume]);

      useEffect(() => {
        // Preload all sounds as base templates using unified SOUNDS constant
        const sounds = {};
        Object.entries(SOUNDS).forEach(([key, config]) => {
          sounds[config.id] = new Audio(config.path);
        });

        // Preload all audio files
        Object.values(sounds).forEach(audio => {
          audio.load();
        });

        soundsRef.current = sounds;

        // Cleanup function to prevent memory leaks
        return () => {
          Object.values(sounds).forEach(audio => {
            audio.pause();
            audio.src = '';
          });
        };
      }, []);

      // Detect touch device and responsive canvas sizing
      useEffect(() => {
        // Detect if touch is supported
        const hasTouchSupport = 'ontouchstart' in window || navigator.maxTouchPoints > 0;
        setIsTouchDevice(hasTouchSupport);

        // Force auto-aim ON for touch devices
        if (hasTouchSupport) {
          setAutoAim(true);
          localStorage.setItem('jurassicEscapeAutoAim', JSON.stringify(true));
        }

        const updateCanvasSize = () => {
          const baseScale = GAME_CONSTANTS.VIEWPORTS[viewportScale];
          // Adjust spacing based on device type
          const verticalSpacing = hasTouchSupport
            ? GAME_CONSTANTS.CANVAS_SIZING.VERTICAL_SPACING_MOBILE
            : GAME_CONSTANTS.CANVAS_SIZING.VERTICAL_SPACING_DESKTOP;
          const maxWidth = Math.min(window.innerWidth - GAME_CONSTANTS.CANVAS_SIZING.WINDOW_PADDING, baseScale.width);
          const maxHeight = Math.min(window.innerHeight - verticalSpacing, baseScale.height);
          const aspectRatio = baseScale.width / baseScale.height;

          let width = maxWidth;
          let height = maxWidth / aspectRatio;

          if (height > maxHeight) {
            height = maxHeight;
            width = maxHeight * aspectRatio;
          }

          setCanvasSize({ width, height });
        };

        updateCanvasSize();
        window.addEventListener('resize', updateCanvasSize);

        return () => window.removeEventListener('resize', updateCanvasSize);
      }, [viewportScale]);

      const gameRef = useRef({
        player: {
          x: GAME_CONSTANTS.PLAYER.START_X,
          y: GAME_CONSTANTS.PLAYER.START_Y,
          health: GAME_CONSTANTS.PLAYER.MAX_HEALTH,
          maxHealth: GAME_CONSTANTS.PLAYER.MAX_HEALTH,
          ammo: GAME_CONSTANTS.PLAYER.START_AMMO,
          tranqAmmo: GAME_CONSTANTS.WEAPONS.TRANQUILIZER.startAmmo,
          currentWeapon: GAME_CONSTANTS.WEAPONS.REGULAR,
          speed: GAME_CONSTANTS.PLAYER.BASE_SPEED,
          baseSpeed: GAME_CONSTANTS.PLAYER.BASE_SPEED,
          radius: GAME_CONSTANTS.PLAYER.RADIUS,
          isJumping: false,
          jumpVelocity: 0,
          jumpHeight: 0,
          invincibilityTimer: 0
        },
        bullets: [],
        spit: [],
        dinosaurs: [],
        territories: [],
        ammoPickups: [],
        tranqDepots: [],
        ammoDepots: [],
        floatingTexts: [],
        powerups: [],
        obstacles: [],
        mouseX: 0,
        mouseY: 0,
        keys: {},
        exit: {
          x: 0,
          y: 0,
          width: GAME_CONSTANTS.MAP.EXIT_WIDTH,
          height: GAME_CONSTANTS.MAP.EXIT_HEIGHT
        },
        cameraX: 0,
        cameraY: 0,
        mapWidth: 0,
        mapHeight: 0,
        speedBoostTimer: 0,
        touch: {
          joystick: { active: false, startX: 0, startY: 0, currentX: 0, currentY: 0 },
          shoot: false,
          jump: false,
          switchWeapon: false
        }
      });

      const initGame = useCallback((level) => {
        const game = gameRef.current;
        const config = LEVEL_CONFIGS[level];

        // Apply difficulty modifiers
        const diffMod = DIFFICULTY_MODIFIERS[difficulty];
        const playerMaxHealth = Math.round(GAME_CONSTANTS.PLAYER.MAX_HEALTH * diffMod.playerHealthMultiplier);
        const playerStartAmmo = Math.round(GAME_CONSTANTS.PLAYER.START_AMMO * diffMod.playerAmmoMultiplier);
        const playerStartTranqAmmo = Math.round(GAME_CONSTANTS.WEAPONS.TRANQUILIZER.startAmmo * diffMod.playerTranqAmmoMultiplier);

        game.player = {
          x: GAME_CONSTANTS.PLAYER.START_X,
          y: GAME_CONSTANTS.PLAYER.START_Y,
          health: playerMaxHealth,
          maxHealth: playerMaxHealth,
          ammo: playerStartAmmo,
          tranqAmmo: playerStartTranqAmmo,
          currentWeapon: GAME_CONSTANTS.WEAPONS.REGULAR,
          speed: GAME_CONSTANTS.PLAYER.BASE_SPEED,
          baseSpeed: GAME_CONSTANTS.PLAYER.BASE_SPEED,
          radius: GAME_CONSTANTS.PLAYER.RADIUS,
          isJumping: false,
          jumpVelocity: 0,
          jumpHeight: 0,
          invincibilityTimer: 0,
          zapTimer: 0
        };
        game.bullets = [];
        game.spit = [];
        game.ammoPickups = [];
        game.tranqDepots = [];
        game.ammoDepots = [];
        game.floatingTexts = [];
        game.powerups = [];
        game.dinosaurs = [];
        game.territories = [];
        game.obstacles = [];
        game.decorations = [];
        game.tarPits = [];
        game.electricFences = [];
        game.keys = {};
        game.speedBoostTimer = 0;

        // Set level-specific map dimensions and exit position
        game.mapWidth = config.mapWidth;
        game.mapHeight = config.mapHeight;
        game.exit = {
          x: config.exitX,
          y: config.exitY,
          width: GAME_CONSTANTS.MAP.EXIT_WIDTH,
          height: GAME_CONSTANTS.MAP.EXIT_HEIGHT
        };

        setPlayerHealth(playerMaxHealth);
        setPlayerAmmo(playerStartAmmo);
        setPlayerTranqAmmo(playerStartTranqAmmo);
        setCurrentWeapon(GAME_CONSTANTS.WEAPONS.REGULAR);
        setSpeedBoostActive(false);

        // Create tar pits first (so obstacles can avoid them)
        for (let i = 0; i < config.tarPits; i++) {
          let tarX, tarY;
          let attempts = 0;
          const maxAttempts = GAME_CONSTANTS.SPAWN.HAZARD_SPAWN_MAX_ATTEMPTS;

          while (attempts < maxAttempts) {
            tarX = GAME_CONSTANTS.SPAWN.POWERUP_SAFE_ZONE_MARGIN + Math.random() * (game.mapWidth - GAME_CONSTANTS.SPAWN.POWERUP_SAFE_ZONE_PADDING);
            tarY = GAME_CONSTANTS.SPAWN.POWERUP_SAFE_ZONE_MARGIN + Math.random() * (game.mapHeight - GAME_CONSTANTS.SPAWN.POWERUP_SAFE_ZONE_PADDING);

            let overlapping = false;

            // Check against other tar pits
            for (const existingTar of game.tarPits) {
              const dist = distance(tarX, tarY, existingTar.x, existingTar.y);
              if (dist < GAME_CONSTANTS.HAZARDS.TAR_PIT.minSpacing) {
                overlapping = true;
                break;
              }
            }

            if (!overlapping) break;
            attempts++;
          }

          game.tarPits.push(createTarPit(tarX, tarY));
        }

        // Create obstacles (blocking: trees and bushes)
        for (let i = 0; i < config.obstacles; i++) {
          game.obstacles.push(createObstacle(game.mapWidth, game.mapHeight, GAME_CONSTANTS.PLAYER.START_X, GAME_CONSTANTS.PLAYER.START_Y, game));
        }

        // Create decorations (walkable: mushroom patches and grass patches)
        const mushroomPatchCount = Math.floor(config.obstacles * GAME_CONSTANTS.SPAWN.MUSHROOM_PATCH_PERCENTAGE);
        const grassPatchCount = Math.floor(config.obstacles * GAME_CONSTANTS.SPAWN.GRASS_PATCH_PERCENTAGE);

        // Spawn mushroom patches
        for (let patchIndex = 0; patchIndex < mushroomPatchCount; patchIndex++) {
          // Pick patch center location
          const patchCenterX = GAME_CONSTANTS.SPAWN.OBSTACLE_MIN_MARGIN + Math.random() * (game.mapWidth - GAME_CONSTANTS.SPAWN.OBSTACLE_PADDING);
          const patchCenterY = GAME_CONSTANTS.SPAWN.OBSTACLE_MIN_MARGIN + Math.random() * (game.mapHeight - GAME_CONSTANTS.SPAWN.OBSTACLE_PADDING);

          // Check clearance from player spawn (visual cleanliness, not collision)
          const distFromPlayer = distance(patchCenterX, patchCenterY, GAME_CONSTANTS.PLAYER.START_X, GAME_CONSTANTS.PLAYER.START_Y);
          if (distFromPlayer < GAME_CONSTANTS.SPAWN.PLAYER_SPAWN_CLEARANCE) {
            continue; // Skip this patch if too close to player
          }

          // Pick a color for this patch (all mushrooms in patch share color)
          const patchColorIndex = Math.floor(Math.random() * GAME_CONSTANTS.OBSTACLES.MUSHROOM.colors.capColors.length);

          // Create and add all mushrooms in patch
          const patch = createMushroomPatch(patchCenterX, patchCenterY, patchColorIndex);
          game.decorations.push(...patch);
        }

        // Spawn grass patches
        for (let patchIndex = 0; patchIndex < grassPatchCount; patchIndex++) {
          // Pick patch center location
          const patchCenterX = GAME_CONSTANTS.SPAWN.OBSTACLE_MIN_MARGIN + Math.random() * (game.mapWidth - GAME_CONSTANTS.SPAWN.OBSTACLE_PADDING);
          const patchCenterY = GAME_CONSTANTS.SPAWN.OBSTACLE_MIN_MARGIN + Math.random() * (game.mapHeight - GAME_CONSTANTS.SPAWN.OBSTACLE_PADDING);

          // Check clearance from player spawn (visual cleanliness, not collision)
          const distFromPlayer = distance(patchCenterX, patchCenterY, GAME_CONSTANTS.PLAYER.START_X, GAME_CONSTANTS.PLAYER.START_Y);
          if (distFromPlayer < GAME_CONSTANTS.SPAWN.PLAYER_SPAWN_CLEARANCE) {
            continue; // Skip this patch if too close to player
          }

          // Create and add all grass patches in cluster
          const cluster = createGrassPatch(patchCenterX, patchCenterY);
          game.decorations.push(...cluster);
        }

        // Sort decorations by z-index for proper rendering order
        sortDecorationsByZIndex(game.decorations);

        // Create dinosaurs
        let dinoIndex = 0;
        config.dinosaurs.forEach(dinoConfig => {
          // Merge config overrides with dinosaur type defaults
          // Config can override speed from LEVEL_CONFIGS (e.g., faster Level 3 raptors)
          const baseSpeed = dinoConfig.speed || dinoConfig.type.speed;
          const count = dinoConfig.count;

          for (let i = 0; i < count; i++) {
            // Calculate initial spawn position
            const initialX = GAME_CONSTANTS.SPAWN.DINOSAUR_GRID_START_X + (dinoIndex % 4) * GAME_CONSTANTS.SPAWN.DINOSAUR_GRID_SPACING_X + Math.random() * GAME_CONSTANTS.SPAWN.DINOSAUR_GRID_RANDOM_OFFSET;
            const initialY = GAME_CONSTANTS.SPAWN.DINOSAUR_GRID_START_Y + Math.floor(dinoIndex / 4) * GAME_CONSTANTS.SPAWN.DINOSAUR_GRID_SPACING_Y + Math.random() * GAME_CONSTANTS.SPAWN.DINOSAUR_GRID_RANDOM_OFFSET;

            // Find collision-free spawn position
            const spawnPos = findValidSpawnPosition(
              initialX,
              initialY,
              dinoConfig.type.baseSize,
              game.obstacles,
              game
            );

            const dino = {
              x: spawnPos.x,
              y: spawnPos.y,
              vx: 0,
              vy: 0,
              health: dinoConfig.type.health,
              maxHealth: dinoConfig.type.health,
              speed: baseSpeed * diffMod.enemySpeedMultiplier, // Apply difficulty
              baseSpeed: baseSpeed * diffMod.enemySpeedMultiplier,
              size: dinoConfig.type.baseSize,
              color: dinoConfig.type.color,
              type: dinoConfig.type,
              points: dinoConfig.type.points,
              aggressive: dinoConfig.type.aggressive,
              territorial: dinoConfig.type.territorial,
              aggroRange: dinoConfig.type.aggressive ? GAME_CONSTANTS.COMBAT.DINOSAUR_AGGRO_RANGE : 0,
              fleeRange: dinoConfig.type.aggressive ? 0 : GAME_CONSTANTS.AI.HERBIVORE_FLEE_RANGE,
              state: GAME_CONSTANTS.AI.STATES.PATROL,
              patrolAngle: Math.random() * Math.PI * 2,
              isSleeping: false,
              sleepTimer: 0,
              tranqHits: 0,
              spitCooldown: 0,
              facingLeft: false, // Track facing direction to prevent rapid flipping
              zapTimer: 0, // Electric shock animation timer
              avoidFences: [] // Array of {fence, timer} objects for learned fence avoidance
            };

            // Create territory for territorial dinosaurs
            if (dinoConfig.type.territorial) {
              // Find a non-overlapping territory position that avoids obstacles
              let territoryX = spawnPos.x;
              let territoryY = spawnPos.y;
              let attempts = 0;
              const maxAttempts = GAME_CONSTANTS.AI.TERRITORY_SPAWN_MAX_ATTEMPTS;
              const minTerritorySpacing = GAME_CONSTANTS.AI.TERRITORY_RADIUS * GAME_CONSTANTS.AI.TERRITORY_SPACING_MULTIPLIER;

              while (attempts < maxAttempts) {
                let overlapping = false;

                // Check against existing territories
                for (const existingTerritory of game.territories) {
                  const dist = distance(territoryX, territoryY, existingTerritory.x, existingTerritory.y);
                  if (dist < minTerritorySpacing) {
                    overlapping = true;
                    break;
                  }
                }

                // Check territory center is not too close to obstacles
                if (!overlapping) {
                  for (const obstacle of game.obstacles) {
                    const dist = distance(territoryX, territoryY, obstacle.x, obstacle.y);
                    if (dist < obstacle.radius + dinoConfig.type.baseSize + GAME_CONSTANTS.AI.TERRITORY_OBSTACLE_CLEARANCE) {
                      overlapping = true;
                      break;
                    }
                  }
                }

                if (!overlapping) {
                  break; // Found a valid position
                }

                // Try a new random position
                territoryX = GAME_CONSTANTS.SPAWN.DINOSAUR_GRID_START_X + Math.random() * (game.mapWidth - GAME_CONSTANTS.SPAWN.DINOSAUR_GRID_START_X * 2);
                territoryY = GAME_CONSTANTS.SPAWN.DINOSAUR_GRID_START_Y + Math.random() * (game.mapHeight - GAME_CONSTANTS.SPAWN.DINOSAUR_GRID_START_Y * 2);
                attempts++;
              }

              const territory = {
                x: territoryX,
                y: territoryY,
                radius: GAME_CONSTANTS.AI.TERRITORY_RADIUS,
                dinoIndex: game.dinosaurs.length // Track which dino owns this territory
              };
              game.territories.push(territory);
              dino.territoryX = territoryX;
              dino.territoryY = territoryY;
              dino.territoryRadius = GAME_CONSTANTS.AI.TERRITORY_RADIUS;
              dino.territoryIndex = game.territories.length - 1; // Link dino to its territory

              // Reposition dino to territory center to ensure it spawns in its zone
              dino.x = territoryX;
              dino.y = territoryY;
            }

            game.dinosaurs.push(dino);
            dinoIndex++;
          }
        });

        // Create exit guards and territory
        if (config.exitGuards && config.exitGuards.length > 0) {
          // Calculate total number of guards
          const totalGuards = config.exitGuards.reduce((sum, guardType) => sum + guardType.count, 0);

          // Create exit territory
          const exitTerritory = createExitTerritory(config.exitX, config.exitY, totalGuards);
          game.territories.push(exitTerritory);
          const exitTerritoryIndex = game.territories.length - 1;

          // Set exit as locked
          game.exitLocked = true;

          // Spawn guards in a circle around exit
          let guardIndex = 0;
          config.exitGuards.forEach(guardType => {
            for (let i = 0; i < guardType.count; i++) {
              // Calculate evenly spaced angle around exit
              const angle = (guardIndex / totalGuards) * 360;
              const guard = createExitGuard(guardType.type, angle, config.exitX, config.exitY, exitTerritoryIndex, difficulty);
              game.dinosaurs.push(guard);
              guardIndex++;
            }
          });
        } else {
          // No guards, exit is unlocked
          game.exitLocked = false;
        }

        // Create powerups
        for (let i = 0; i < config.powerups; i++) {
          game.powerups.push(createPowerup(game.mapWidth, game.mapHeight));
        }

        // Create tranquilizer depots
        const depotCount = GAME_CONSTANTS.SPAWN.TRANQ_DEPOT_COUNT_BASE + level;
        for (let i = 0; i < depotCount; i++) {
          game.tranqDepots.push(createTranqDepot(game.mapWidth, game.mapHeight));
        }

        // Create regular ammo depots (minimal ammo for strongest guard + 1 buffer)
        // Depot 1: Near spawn, visible from start
        game.ammoDepots.push(createAmmoDepot(250, 150, config.ammoPerDepot));

        // Depot 2: Furthest corner from spawn (bottom-right)
        const farCornerX = game.mapWidth - 200;
        const farCornerY = game.mapHeight - 200;
        game.ammoDepots.push(createAmmoDepot(farCornerX, farCornerY, config.ammoPerDepot));

        // Create electric fences
        for (let i = 0; i < config.electricFences; i++) {
          let fenceX, fenceY, fenceRotation;
          let attempts = 0;
          const fenceType = GAME_CONSTANTS.HAZARDS.ELECTRIC_FENCE;
          const maxAttempts = GAME_CONSTANTS.SPAWN.HAZARD_SPAWN_MAX_ATTEMPTS;
          const fenceRadius = fenceType.width / 2;

          while (attempts < maxAttempts) {
            fenceX = GAME_CONSTANTS.SPAWN.POWERUP_SAFE_ZONE_MARGIN + Math.random() * (game.mapWidth - GAME_CONSTANTS.SPAWN.POWERUP_SAFE_ZONE_PADDING);
            fenceY = GAME_CONSTANTS.SPAWN.POWERUP_SAFE_ZONE_MARGIN + Math.random() * (game.mapHeight - GAME_CONSTANTS.SPAWN.POWERUP_SAFE_ZONE_PADDING);
            fenceRotation = Math.random() * Math.PI * 2; // Random rotation

            let valid = true;

            // Check against other fences (minimum spacing)
            for (const existingFence of game.electricFences) {
              const dist = distance(fenceX, fenceY, existingFence.x, existingFence.y);
              if (dist < fenceType.minSpacing) {
                valid = false;
                break;
              }
            }

            // Check against all other entities using centralized collision checker
            if (valid) {
              valid = isValidPosition(fenceX, fenceY, fenceRadius, game, fenceType.obstacleClearance);
            }

            if (valid) break;
            attempts++;
          }

          game.electricFences.push(createElectricFence(fenceX, fenceY, fenceRotation));
        }
      }, [difficulty]);

      useEffect(() => {
        if (gameState !== GAME_CONSTANTS.GAME_STATES.PLAYING) return;

        const canvas = canvasRef.current;
        const ctx = canvas.getContext('2d');
        const game = gameRef.current;

        let animationId;

        // Attach event listeners using memoized handlers
        canvas.addEventListener('mousemove', handleMouseMove);
        canvas.addEventListener('click', handleClick);
        window.addEventListener('keydown', handleKeyDown);
        window.addEventListener('keyup', handleKeyUp);

        const gameLoop = () => {
          // Pause if pause menu or settings menu is showing
          if (showPauseMenu || showSettingsMenu) {
            animationId = requestAnimationFrame(gameLoop);
            return;
          }

          // State accumulator for batch updates (reduce re-renders)
          const stateAccumulator = {};

          // Update player speed modifiers
          updatePlayerSpeed(game, stateAccumulator);

          // Update hazards
          updateHazards(game, difficulty, playSound, stateAccumulator);

          // Update player movement
          updatePlayerMovement(game, canvas, stateAccumulator);

          // Handle touch weapon switching
          if (game.touch.switchWeapon) {
            game.player.currentWeapon = game.player.currentWeapon === GAME_CONSTANTS.WEAPONS.REGULAR ? GAME_CONSTANTS.WEAPONS.TRANQUILIZER : GAME_CONSTANTS.WEAPONS.REGULAR;
            stateAccumulator.currentWeapon = game.player.currentWeapon;
            game.touch.switchWeapon = false;
          }

          // Handle touch shooting
          if (game.touch.shoot) {
            const nearestDino = findNearestDinosaur(game.player.x, game.player.y, game.dinosaurs);
            const targetX = nearestDino ? nearestDino.x : game.player.x + GAME_CONSTANTS.TOUCH.AUTO_AIM_FALLBACK_DISTANCE;
            const targetY = nearestDino ? nearestDino.y : game.player.y;

            // Fire weapon using unified logic
            const fired = fireWeapon(
              game.player.currentWeapon,
              game.player,
              targetX,
              targetY,
              game,
              playSound,
              stateAccumulator, // Use state accumulator for batched updates
              null
            );

            if (fired) {
              game.touch.shoot = false; // Reset touch shoot flag after firing
            }
          }

          // Update collectibles
          updateCollectibles(game, difficulty, playSound, stateAccumulator);

          // Update bullets
          updateBullets(game, playSound, stateAccumulator);

          // Update spit projectiles
          updateSpitProjectiles(game, difficulty, playSound, stateAccumulator);

          // Update dinosaurs (includes AI, movement, collisions)
          updateDinosaurs(game, difficulty, playSound, stateAccumulator);

          // Batch apply all state updates (reduces re-renders)
          applyStateUpdates(stateAccumulator, {
            gameState: setGameState,
            playerHealth: setPlayerHealth,
            playerAmmo: setPlayerAmmo,
            playerTranqAmmo: setPlayerTranqAmmo,
            currentWeapon: setCurrentWeapon,
            speedBoostActive: setSpeedBoostActive,
            score: (val) => setScore(s => s + val),
          });

          // Stop game loop if game over
          if (stateAccumulator.gameState !== undefined && isTerminalState(stateAccumulator.gameState)) {
            return;
          }

          // Check win condition (only if exit is unlocked)
          if (!game.exitLocked) {
            const exitCenterX = game.exit.x + game.exit.width / 2;
            const exitCenterY = game.exit.y + game.exit.height / 2;
            if (distance(game.player.x, game.player.y, exitCenterX, exitCenterY) < game.player.radius + GAME_CONSTANTS.MAP.EXIT_COLLISION_RADIUS) {
              if (currentLevel < GAME_CONSTANTS.MAP.MAX_LEVEL) {
                setGameState(GAME_CONSTANTS.GAME_STATES.LEVEL_COMPLETE);
                playSound(SOUNDS.LEVEL_COMPLETE);
              } else {
                setGameState(GAME_CONSTANTS.GAME_STATES.WON);
                playSound(SOUNDS.VICTORY);
              }
            }
          }

          // Render
          ctx.fillStyle = '#3a5f3a';
          ctx.fillRect(0, 0, canvas.width, canvas.height);

          ctx.fillStyle = '#2d4a2d';
          for (let i = 0; i < GAME_CONSTANTS.RENDER.GRASS_PATCHES; i++) {
            const gx = (i * 73) % game.mapWidth - game.cameraX;
            const gy = (i * 97) % game.mapHeight - game.cameraY;
            ctx.fillRect(gx, gy, GAME_CONSTANTS.RENDER.GRASS_PATCH_SIZE, GAME_CONSTANTS.RENDER.GRASS_PATCH_SIZE);
          }

          // Draw exit
          const exitScreenX = game.exit.x - game.cameraX;
          const exitScreenY = game.exit.y - game.cameraY;
          ctx.fillStyle = game.exitLocked ? GAME_CONSTANTS.EXIT.LOCKED_FILL_COLOR : GAME_CONSTANTS.EXIT.UNLOCKED_FILL_COLOR;
          ctx.fillRect(exitScreenX, exitScreenY, game.exit.width, game.exit.height);
          ctx.strokeStyle = game.exitLocked ? GAME_CONSTANTS.EXIT.LOCKED_STROKE_COLOR : GAME_CONSTANTS.EXIT.UNLOCKED_STROKE_COLOR;
          ctx.lineWidth = GAME_CONSTANTS.EXIT.BORDER_WIDTH;
          ctx.strokeRect(exitScreenX, exitScreenY, game.exit.width, game.exit.height);
          ctx.fillStyle = GAME_CONSTANTS.EXIT.TEXT_COLOR;
          ctx.font = GAME_CONSTANTS.EXIT.TEXT_FONT;
          ctx.textAlign = 'center';
          ctx.fillText('EXIT', exitScreenX + game.exit.width / 2, exitScreenY + game.exit.height / 2 + GAME_CONSTANTS.EXIT.TEXT_OFFSET_Y);

          // Draw lock icon if exit is locked
          if (game.exitLocked) {
            ctx.font = `${GAME_CONSTANTS.EXIT.LOCK_ICON_SIZE}px Arial`;
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillText(
              GAME_CONSTANTS.EXIT.LOCK_ICON,
              exitScreenX + game.exit.width / 2,
              exitScreenY + GAME_CONSTANTS.EXIT.LOCK_ICON_OFFSET_Y
            );
          }

          // Draw tar pits
          game.tarPits.forEach(tarPit => {
            drawTarPit(ctx, tarPit, game.cameraX, game.cameraY);
          });

          // Draw electric fences
          game.electricFences.forEach(fence => {
            drawElectricFence(ctx, fence, game.cameraX, game.cameraY);
          });

          // Draw decorations (walkable: sorted with grass first, mushrooms last)
          game.decorations.forEach(decoration => {
            drawObstacle(ctx, decoration, game.cameraX, game.cameraY);
          });

          // Draw obstacles (blocking: trees and bushes)
          game.obstacles.forEach(obs => {
            drawObstacle(ctx, obs, game.cameraX, game.cameraY);
          });

          // Draw powerups
          game.powerups.forEach(powerup => {
            drawPowerup(ctx, powerup, game.cameraX, game.cameraY);
          });

          // Draw tranquilizer depots
          game.tranqDepots.forEach(depot => {
            drawDepot(ctx, depot, game.cameraX, game.cameraY, GAME_CONSTANTS.DEPOT_STYLES.TRANQ);
          });

          // Draw regular ammo depots
          game.ammoDepots.forEach(depot => {
            drawDepot(ctx, depot, game.cameraX, game.cameraY, GAME_CONSTANTS.DEPOT_STYLES.AMMO);
          });

          // Draw territories (skull markers at center)
          game.territories.forEach(territory => {
            drawTerritory(ctx, territory, game.cameraX, game.cameraY);
          });

          // Draw dinosaurs
          game.dinosaurs.forEach(dino => {
            const screenX = dino.x - game.cameraX;
            const screenY = dino.y - game.cameraY;

            ctx.save();
            ctx.translate(screenX, screenY);

            // Use stored facing direction instead of instant velocity check
            if (dino.facingLeft) {
              ctx.scale(-1, 1);
            }

            switch (dino.type) {
              case GAME_CONSTANTS.DINOSAURS.VELOCIRAPTOR:
                drawVelociraptor(ctx, dino.size / dino.type.baseSize);
                break;
              case GAME_CONSTANTS.DINOSAURS.TYRANNOSAURUS_REX:
                drawTyrannosaurusRex(ctx, dino.size / dino.type.baseSize);
                break;
              case GAME_CONSTANTS.DINOSAURS.STEGOSAURUS:
                drawStegosaurus(ctx, dino.size / dino.type.baseSize);
                break;
              case GAME_CONSTANTS.DINOSAURS.PARASAUROLOPHUS:
                drawParasaurolophus(ctx, dino.size / dino.type.baseSize);
                break;
              case GAME_CONSTANTS.DINOSAURS.TRICERATOPS:
                drawTriceratops(ctx, dino.size / dino.type.baseSize);
                break;
              case GAME_CONSTANTS.DINOSAURS.DILOPHOSAURUS:
                drawDilophosaurus(ctx, dino.size / dino.type.baseSize, dino.aiState);
                break;
            }

            ctx.restore();

            // Health bar
            const barWidth = dino.size * GAME_CONSTANTS.HEALTH_BAR.WIDTH_MULTIPLIER;
            const barHeight = GAME_CONSTANTS.HEALTH_BAR.HEIGHT;
            const barY = screenY - dino.size * GAME_CONSTANTS.HEALTH_BAR.POSITION_MULTIPLIER;
            ctx.fillStyle = GAME_CONSTANTS.HEALTH_BAR.BORDER_COLOR;
            ctx.fillRect(screenX - barWidth / 2 - GAME_CONSTANTS.HEALTH_BAR.BORDER_OFFSET, barY - GAME_CONSTANTS.HEALTH_BAR.BORDER_OFFSET, barWidth + GAME_CONSTANTS.HEALTH_BAR.BORDER_PADDING, barHeight + GAME_CONSTANTS.HEALTH_BAR.BORDER_PADDING);
            ctx.fillStyle = GAME_CONSTANTS.HEALTH_BAR.BACKGROUND_COLOR;
            ctx.fillRect(screenX - barWidth / 2, barY, barWidth, barHeight);
            ctx.fillStyle = GAME_CONSTANTS.HEALTH_BAR.HEALTH_COLOR;
            ctx.fillRect(screenX - barWidth / 2, barY, barWidth * (dino.health / dino.maxHealth), barHeight);

            // Zap effect (electric shock animation)
            drawZapEffect(ctx, screenX, screenY, dino.size, dino.zapTimer);
          });

          // Draw sleeping Z-Z-Z (batched, optimized)
          const sleepingDinos = game.dinosaurs.filter(dino => dino.isSleeping);
          if (sleepingDinos.length > 0) {
            ctx.fillStyle = GAME_CONSTANTS.Z_ANIMATION.FILL_COLOR;
            ctx.textAlign = GAME_CONSTANTS.Z_ANIMATION.TEXT_ALIGN;
            ctx.shadowColor = GAME_CONSTANTS.Z_ANIMATION.SHADOW_COLOR;
            ctx.shadowBlur = GAME_CONSTANTS.Z_ANIMATION.SHADOW_BLUR;

            const buffer = GAME_CONSTANTS.Z_ANIMATION.CULLING_BUFFER;
            const bobOffset = Math.sin(Date.now() / GAME_CONSTANTS.Z_ANIMATION.BOB_SPEED) * GAME_CONSTANTS.Z_ANIMATION.BOB_AMPLITUDE;

            sleepingDinos.forEach(dino => {
              const screenX = dino.x - game.cameraX;
              const screenY = dino.y - game.cameraY;

              // Cull off-screen sleeping dinos
              if (screenX < -buffer || screenX > canvas.width + buffer || screenY < -buffer || screenY > canvas.height + buffer) {
                return;
              }

              // Draw Z's with increasing size (loop through configs)
              GAME_CONSTANTS.Z_ANIMATION.Z_CONFIGS.forEach(zConfig => {
                ctx.font = zConfig.FONT;
                ctx.fillText('Z',
                  screenX + dino.size + zConfig.OFFSET_X,
                  screenY - dino.size + zConfig.OFFSET_Y + bobOffset);
              });
            });

            // Reset state once at end
            ctx.shadowBlur = 0;
          }

          // Draw player
          drawPlayer(ctx, game.player, game.cameraX, game.cameraY, game.mouseX, game.mouseY, game.speedBoostTimer);

          // Draw bullets
          game.bullets.forEach(bullet => {
            ctx.fillStyle = bullet.weaponType.bulletColor;
            ctx.beginPath();
            ctx.arc(bullet.x - game.cameraX, bullet.y - game.cameraY, bullet.radius, 0, Math.PI * 2);
            ctx.fill();
          });

          // Draw spit projectiles
          game.spit.forEach(spit => {
            const spitAttack = GAME_CONSTANTS.DINOSAURS.DILOPHOSAURUS.spitAttack;
            ctx.fillStyle = spitAttack.fillColor;
            ctx.strokeStyle = spitAttack.strokeColor;
            ctx.lineWidth = spitAttack.lineWidth;
            ctx.beginPath();
            ctx.arc(spit.x - game.cameraX, spit.y - game.cameraY, spit.radius, 0, Math.PI * 2);
            ctx.fill();
            ctx.stroke();
          });

          // Draw ammo pickups
          ctx.fillStyle = GAME_CONSTANTS.AMMO_PICKUP.COLOR;
          game.ammoPickups.forEach(pickup => {
            ctx.beginPath();
            ctx.arc(pickup.x - game.cameraX, pickup.y - game.cameraY, pickup.radius, 0, Math.PI * 2);
            ctx.fill();
          });

          // Draw floating texts (optimized)
          if (game.floatingTexts.length > 0) {
            ctx.font = GAME_CONSTANTS.FLOATING_TEXT.FONT;
            ctx.textAlign = 'center';
            ctx.lineWidth = GAME_CONSTANTS.FLOATING_TEXT.LINE_WIDTH;
            ctx.shadowColor = GAME_CONSTANTS.FLOATING_TEXT.SHADOW_COLOR;
            ctx.shadowBlur = GAME_CONSTANTS.FLOATING_TEXT.SHADOW_BLUR;

            const fadeDuration = GAME_CONSTANTS.FLOATING_TEXT.LIFETIME_FRAMES - GAME_CONSTANTS.FLOATING_TEXT.FADE_START_FRAME;
            const buffer = GAME_CONSTANTS.FLOATING_TEXT.CULLING_BUFFER;

            game.floatingTexts.forEach(text => {
              const screenX = text.x - game.cameraX;
              const screenY = text.y - game.cameraY;

              // Cull off-screen texts
              if (screenX < -buffer || screenX > canvas.width + buffer || screenY < -buffer || screenY > canvas.height + buffer) {
                return;
              }

              // Simplified alpha calculation
              const alpha = text.age < GAME_CONSTANTS.FLOATING_TEXT.FADE_START_FRAME
                ? GAME_CONSTANTS.FLOATING_TEXT.ALPHA_OPAQUE
                : GAME_CONSTANTS.FLOATING_TEXT.ALPHA_OPAQUE - (text.age - GAME_CONSTANTS.FLOATING_TEXT.FADE_START_FRAME) / fadeDuration;

              ctx.globalAlpha = alpha;
              ctx.fillStyle = text.color;
              ctx.fillText(text.text, screenX, screenY);
            });

            // Reset state once at end
            ctx.globalAlpha = GAME_CONSTANTS.FLOATING_TEXT.ALPHA_OPAQUE;
            ctx.shadowBlur = 0;
          }

          animationId = requestAnimationFrame(gameLoop);
        };

        gameLoop();

        return () => {
          cancelAnimationFrame(animationId);
          canvas.removeEventListener('mousemove', handleMouseMove);
          canvas.removeEventListener('click', handleClick);
          window.removeEventListener('keydown', handleKeyDown);
          window.removeEventListener('keyup', handleKeyUp);
        };
      }, [gameState, currentLevel, playSound, showPauseMenu, showSettingsMenu, difficulty, handleKeyDown, handleKeyUp, handleMouseMove, handleClick]);

      // ============================================================================
      // EVENT HANDLERS (Memoized for performance)
      // ============================================================================

      // Game Flow Handlers
      const startGame = useCallback(() => {
        setCurrentLevel(1);
        setScore(0);
        initGame(1);
        setGameState(GAME_CONSTANTS.GAME_STATES.PLAYING);
        playSound(SOUNDS.GAME_START);
      }, [initGame, playSound]);

      const nextLevel = useCallback(() => {
        const next = currentLevel + 1;
        setCurrentLevel(next);
        initGame(next);
        setGameState(GAME_CONSTANTS.GAME_STATES.PLAYING);
      }, [currentLevel, initGame]);

      // Ammo setters mapping for fireWeapon function
      const ammoSetters = useMemo(() => ({
        playerAmmo: setPlayerAmmo,
        playerTranqAmmo: setPlayerTranqAmmo
      }), []);

      // Desktop Input Handlers
      const handleKeyDown = useCallback((e) => {
        const game = gameRef.current;
        const key = e.key.toLowerCase();
        game.keys[key] = true;

        // Handle ESC to pause
        if (key === 'escape') {
          setShowPauseMenu(true);
          playSound(SOUNDS.PAUSE);
          return;
        }

        // Handle jump on spacebar press
        if (key === ' ' && !game.player.isJumping) {
          game.player.isJumping = true;
          game.player.jumpVelocity = GAME_CONSTANTS.PLAYER.JUMP_VELOCITY;
          playSound(SOUNDS.JUMP);
        }

        // Handle weapon switching with Q key
        if (key === 'q') {
          game.player.currentWeapon = game.player.currentWeapon === GAME_CONSTANTS.WEAPONS.REGULAR ? GAME_CONSTANTS.WEAPONS.TRANQUILIZER : GAME_CONSTANTS.WEAPONS.REGULAR;
          setCurrentWeapon(game.player.currentWeapon);
        }
      }, [playSound]);

      const handleKeyUp = useCallback((e) => {
        const game = gameRef.current;
        game.keys[e.key.toLowerCase()] = false;
      }, []);

      const handleMouseMove = useCallback((e) => {
        const game = gameRef.current;
        const canvas = canvasRef.current;
        const rect = canvas.getBoundingClientRect();
        game.mouseX = e.clientX - rect.left + game.cameraX;
        game.mouseY = e.clientY - rect.top + game.cameraY;
      }, []);

      const handleClick = useCallback((e) => {
        const game = gameRef.current;
        const canvas = canvasRef.current;
        const rect = canvas.getBoundingClientRect();
        let targetX = e.clientX - rect.left + game.cameraX;
        let targetY = e.clientY - rect.top + game.cameraY;

        // Use auto-aim if enabled
        if (autoAim) {
          const nearestDino = findNearestDinosaur(game.player.x, game.player.y, game.dinosaurs);
          if (nearestDino) {
            targetX = nearestDino.x;
            targetY = nearestDino.y;
          } else {
            // Fallback to click position if no dinosaurs
            targetX = e.clientX - rect.left + game.cameraX;
            targetY = e.clientY - rect.top + game.cameraY;
          }
        }

        // Fire weapon using unified logic
        fireWeapon(
          game.player.currentWeapon,
          game.player,
          targetX,
          targetY,
          game,
          playSound,
          null, // No state accumulator (direct setState)
          ammoSetters
        );
      }, [autoAim, playSound, ammoSetters]);

      // Mobile Touch Handlers
      const handleJoystickStart = useCallback((e) => {
        e.preventDefault();
        const touch = e.touches[0];
        const rect = e.currentTarget.getBoundingClientRect();
        const x = touch.clientX - rect.left;
        const y = touch.clientY - rect.top;
        gameRef.current.touch.joystick = {
          active: true,
          startX: x,
          startY: y,
          currentX: x,
          currentY: y
        };
      }, []);

      const handleJoystickMove = useCallback((e) => {
        e.preventDefault();
        if (!gameRef.current.touch.joystick.active) return;
        const touch = e.touches[0];
        const rect = e.currentTarget.getBoundingClientRect();
        gameRef.current.touch.joystick.currentX = touch.clientX - rect.left;
        gameRef.current.touch.joystick.currentY = touch.clientY - rect.top;
      }, []);

      const handleJoystickEnd = useCallback((e) => {
        e.preventDefault();
        gameRef.current.touch.joystick.active = false;
      }, []);

      const handleWeaponSwitch = useCallback((e) => {
        e.preventDefault();
        gameRef.current.touch.switchWeapon = true;
      }, []);

      const handleJumpStart = useCallback((e) => {
        e.preventDefault();
        if (!gameRef.current.player.isJumping) {
          gameRef.current.player.isJumping = true;
          gameRef.current.player.jumpVelocity = GAME_CONSTANTS.PLAYER.JUMP_VELOCITY;
          playSound(SOUNDS.JUMP);
        }
      }, [playSound]);

      const handleShootStart = useCallback((e) => {
        e.preventDefault();
        gameRef.current.touch.shoot = true;
      }, []);

      const handleShootEnd = useCallback((e) => {
        e.preventDefault();
        gameRef.current.touch.shoot = false;
      }, []);

      // UI Interaction Handlers
      const handlePauseClick = useCallback(() => {
        setShowPauseMenu(true);
        playSound(SOUNDS.PAUSE);
      }, [playSound]);

      const handleSettingsClick = useCallback(() => {
        setShowPauseMenu(true);
        setShowSettingsMenu(true);
      }, []);

      const handleOpenSettings = useCallback(() => {
        setShowSettingsMenu(true);
      }, []);

      const handleCloseSettings = useCallback(() => {
        setShowSettingsMenu(false);
        if (gameState === GAME_CONSTANTS.GAME_STATES.PLAYING) {
          setShowPauseMenu(true);
        }
      }, [gameState]);

      // Pause Menu Handlers
      const handleContinue = useCallback(() => {
        setShowPauseMenu(false);
        playSound(SOUNDS.UNPAUSE);
      }, [playSound]);

      const handleRestartLevel = useCallback(() => {
        setShowPauseMenu(false);
        playSound(SOUNDS.UNPAUSE);
        initGame(currentLevel);
        setGameState(GAME_CONSTANTS.GAME_STATES.PLAYING);
      }, [playSound, initGame, currentLevel]);

      const handleExitToMenu = useCallback(() => {
        setShowPauseMenu(false);
        playSound(SOUNDS.VICTORY);
        setGameState(GAME_CONSTANTS.GAME_STATES.MENU);
      }, [playSound]);

      const handleOpenSettingsFromPause = useCallback(() => {
        setShowPauseMenu(false);
        setShowSettingsMenu(true);
      }, []);

      // Settings Menu Handlers
      const handleSoundToggle = useCallback(() => {
        const newValue = !soundEnabled;
        setSoundEnabled(newValue);
        localStorage.setItem('jurassicEscapeSoundEnabled', JSON.stringify(newValue));
        if (newValue) playSound(SOUNDS.GAME_START);
      }, [soundEnabled, playSound]);

      const handleVolumeChange = useCallback((e) => {
        const newVolume = parseInt(e.target.value) / 100;
        setVolume(newVolume);
        localStorage.setItem('jurassicEscapeVolume', newVolume.toString());
      }, []);

      const handleViewportScaleChange = useCallback((key) => {
        setViewportScale(key);
        localStorage.setItem('jurassicEscapeViewportScale', key);
      }, []);

      const handleDifficultyChange = useCallback((key) => {
        setDifficulty(key);
        localStorage.setItem('jurassicEscapeDifficulty', key);
        // Enable auto-aim on Easy difficulty
        if (key === 'easy') {
          setAutoAim(true);
          localStorage.setItem('jurassicEscapeAutoAim', JSON.stringify(true));
        }
      }, []);

      const handleAutoAimToggle = useCallback(() => {
        if (!isTouchDevice) {
          const newValue = !autoAim;
          setAutoAim(newValue);
          localStorage.setItem('jurassicEscapeAutoAim', JSON.stringify(newValue));
        }
      }, [isTouchDevice, autoAim]);

      return (
        <div className="flex flex-col items-center justify-center min-h-screen bg-gray-900 p-4">
          {gameState === GAME_CONSTANTS.GAME_STATES.MENU && (
            <div className="text-center">
              <h1 className="text-5xl font-bold text-green-400 mb-4">JURASSIC ESCAPE</h1>
              <p className="text-gray-300 mb-2">Navigate through the dangerous park and reach the exit!</p>
              <div className="text-gray-400 mb-2 space-y-1">
                {isTouchDevice ? (
                  <>
                    <p>Use joystick to move • JUMP to clear obstacles</p>
                    <p>Tap weapon button to switch • FIRE to shoot</p>
                  </>
                ) : (
                  <>
                    <p>WASD/Arrows to move • Spacebar to jump • Q to switch weapon</p>
                    <p>Mouse to aim (or enable auto-aim 🎯) • Click to shoot</p>
                  </>
                )}
              </div>
              <div className="text-gray-300 mb-6 space-y-2">
                <p className="flex items-center justify-center gap-2">
                  <span className="inline-block w-4 h-4 bg-red-500 rounded-full"></span>
                  Health Pack - Restores 1 heart
                </p>
                <p className="flex items-center justify-center gap-2">
                  <span className="inline-block w-4 h-4 bg-cyan-400 rounded-full"></span>
                  Speed Boost - Temporary speed increase
                </p>
                <p className="flex items-center justify-center gap-2">
                  <span className="inline-block w-4 h-4 bg-green-600 rounded"></span>
                  Tranquilizer Depot - Refills {GAME_CONSTANTS.WEAPONS.TRANQUILIZER.icon} ammo
                </p>
              </div>
              <div className="flex flex-col gap-3">
                <button
                  onClick={startGame}
                  className="px-8 py-3 bg-green-600 hover:bg-green-700 text-white font-bold rounded-lg text-xl"
                >
                  START GAME
                </button>
                <button
                  onClick={handleOpenSettings}
                  className="px-8 py-3 bg-gray-700 hover:bg-gray-600 text-white font-bold rounded-lg text-lg flex items-center justify-center gap-2"
                >
                  <span>⚙️</span>
                  <span>SETTINGS</span>
                </button>
              </div>
            </div>
          )}

          {gameState === GAME_CONSTANTS.GAME_STATES.PLAYING && (
            <div className="flex flex-col items-center">
              <GameHUD
                health={playerHealth}
                maxHealth={5}
                ammo={playerAmmo}
                tranqAmmo={playerTranqAmmo}
                currentWeapon={currentWeapon}
                score={score}
                currentLevel={currentLevel}
                speedBoostActive={speedBoostActive}
                autoAim={autoAim}
                isTouchDevice={isTouchDevice}
                onPauseClick={handlePauseClick}
                onSettingsClick={handleSettingsClick}
              />
              <div className="relative">
                <canvas
                  ref={canvasRef}
                  width={GAME_CONSTANTS.VIEWPORTS[viewportScale].width}
                  height={GAME_CONSTANTS.VIEWPORTS[viewportScale].height}
                  style={{ width: `${canvasSize.width}px`, height: `${canvasSize.height}px` }}
                  className="border-4 border-green-600 bg-green-900 cursor-crosshair"
                />

                {/* Touch Controls Overlay */}
                {isTouchDevice && (
                  <TouchControls
                    joystickActive={gameRef.current.touch.joystick.active}
                    joystickX={gameRef.current.touch.joystick.currentX}
                    joystickY={gameRef.current.touch.joystick.currentY}
                    currentWeapon={gameRef.current.player.currentWeapon}
                    onJoystickStart={handleJoystickStart}
                    onJoystickMove={handleJoystickMove}
                    onJoystickEnd={handleJoystickEnd}
                    onWeaponSwitch={handleWeaponSwitch}
                    onJumpStart={handleJumpStart}
                    onShootStart={handleShootStart}
                    onShootEnd={handleShootEnd}
                  />
                )}
              </div>
              <p className="text-gray-400 mt-2 text-center">
                {isTouchDevice ? (
                  <span>Joystick to move • Tap {GAME_CONSTANTS.WEAPONS.REGULAR.icon}/{GAME_CONSTANTS.WEAPONS.TRANQUILIZER.icon} to switch weapon • FIRE to auto-aim • JUMP to escape!</span>
                ) : autoAim ? (
                  <span>WASD/Arrows to move • Q to switch weapon • Click to auto-aim 🎯 • Spacebar to jump!</span>
                ) : (
                  <span>WASD/Arrows to move • Q to switch weapon • Mouse to aim • Click to shoot • Spacebar to jump!</span>
                )}
              </p>

              {showPauseMenu && (
                <PauseMenu
                  onContinue={handleContinue}
                  onRestart={handleRestartLevel}
                  onExitToMenu={handleExitToMenu}
                  onOpenSettings={handleOpenSettingsFromPause}
                />
              )}
            </div>
          )}

          {gameState === GAME_CONSTANTS.GAME_STATES.LEVEL_COMPLETE && (
            <div className="text-center">
              <h1 className="text-5xl font-bold text-green-400 mb-4">LEVEL {currentLevel} COMPLETE!</h1>
              <p className="text-2xl text-white mb-4">Score: {score}</p>
              <button
                onClick={nextLevel}
                className="px-8 py-3 bg-green-600 hover:bg-green-700 text-white font-bold rounded-lg text-xl"
              >
                NEXT LEVEL
              </button>
            </div>
          )}

          {gameState === GAME_CONSTANTS.GAME_STATES.WON && (
            <div className="text-center">
              <h1 className="text-5xl font-bold text-green-400 mb-4">YOU ESCAPED!</h1>
              <p className="text-3xl text-yellow-400 mb-2">ALL LEVELS COMPLETE!</p>
              <p className="text-2xl text-white mb-4">Final Score: {score}</p>
              <button
                onClick={startGame}
                className="px-8 py-3 bg-green-600 hover:bg-green-700 text-white font-bold rounded-lg text-xl"
              >
                PLAY AGAIN
              </button>
            </div>
          )}

          {gameState === GAME_CONSTANTS.GAME_STATES.LOST && (
            <div className="text-center">
              <h1 className="text-5xl font-bold text-red-500 mb-4">GAME OVER</h1>
              <p className="text-xl text-white mb-2">Level {currentLevel}</p>
              <p className="text-2xl text-white mb-4">Final Score: {score}</p>
              <button
                onClick={startGame}
                className="px-8 py-3 bg-green-600 hover:bg-green-700 text-white font-bold rounded-lg text-xl"
              >
                TRY AGAIN
              </button>
            </div>
          )}

          {/* Settings Menu Overlay */}
          {showSettingsMenu && (
            <SettingsMenu
              soundEnabled={soundEnabled}
              volume={volume}
              viewportScale={viewportScale}
              difficulty={difficulty}
              autoAim={autoAim}
              isTouchDevice={isTouchDevice}
              onSoundToggle={handleSoundToggle}
              onVolumeChange={handleVolumeChange}
              onViewportScaleChange={handleViewportScaleChange}
              onDifficultyChange={handleDifficultyChange}
              onAutoAimToggle={handleAutoAimToggle}
              onClose={handleCloseSettings}
            />
          )}
        </div>
      );
    };

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<JurassicEscape />);
  </script>
</body>

</html>
