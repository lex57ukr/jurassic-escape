            // Mobile landscape: use wide aspect ratio
            viewportConfig = GAME_CONSTANTS.CONFIG.VIEWPORTS_LANDSCAPE[viewportScale];
          } else {
            // Desktop or mobile portrait: use standard 4:3 aspect ratio
            viewportConfig = GAME_CONSTANTS.CONFIG.VIEWPORTS[viewportScale];
          }

          // Adjust spacing based on device type and orientation
          let verticalSpacing;
          if (!hasTouchSupport) {
            verticalSpacing = GAME_CONSTANTS.CONFIG.CANVAS_SIZING.VERTICAL_SPACING_DESKTOP;
          } else if (isCurrentlyLandscape) {
            verticalSpacing = GAME_CONSTANTS.CONFIG.CANVAS_SIZING.VERTICAL_SPACING_MOBILE_LANDSCAPE;
          } else {
            verticalSpacing = GAME_CONSTANTS.CONFIG.CANVAS_SIZING.VERTICAL_SPACING_MOBILE;
          }

          const maxWidth = Math.min(window.innerWidth - GAME_CONSTANTS.CONFIG.CANVAS_SIZING.WINDOW_PADDING, viewportConfig.width);
          const maxHeight = Math.min(window.innerHeight - verticalSpacing, viewportConfig.height);
          const aspectRatio = viewportConfig.width / viewportConfig.height;

          let width = maxWidth;
          let height = maxWidth / aspectRatio;

          if (height > maxHeight) {
            height = maxHeight;
            width = maxHeight * aspectRatio;
          }

          setCanvasSize({ width, height });
        };

        updateCanvasSize();
        window.addEventListener('resize', updateCanvasSize);
        // Also listen for orientation changes on mobile devices
        window.addEventListener('orientationchange', updateCanvasSize);

        return () => {
          window.removeEventListener('resize', updateCanvasSize);
          window.removeEventListener('orientationchange', updateCanvasSize);
        };
      }, [viewportScale]);

      const gameRef = useRef({
        player: {
          x: GAME_CONSTANTS.CORE.PLAYER.START_X,
          y: GAME_CONSTANTS.CORE.PLAYER.START_Y,
          health: GAME_CONSTANTS.CORE.PLAYER.MAX_HEALTH,
          maxHealth: GAME_CONSTANTS.CORE.PLAYER.MAX_HEALTH,
          ammo: GAME_CONSTANTS.CORE.PLAYER.START_AMMO,
          tranqAmmo: GAME_CONSTANTS.ENTITIES.WEAPONS.TRANQUILIZER.startAmmo,
          currentWeapon: GAME_CONSTANTS.ENTITIES.WEAPONS.REGULAR,
          speed: GAME_CONSTANTS.CORE.PLAYER.BASE_SPEED,
          baseSpeed: GAME_CONSTANTS.CORE.PLAYER.BASE_SPEED,
          radius: GAME_CONSTANTS.CORE.PLAYER.RADIUS,
          isJumping: false,
          jumpVelocity: 0,
          jumpHeight: 0,
          invincibilityTimer: 0
        },
        bullets: [],
        spit: [],
        dinosaurs: [],
        territories: [],
        ammoPickups: [],
        tranqDepots: [],
        ammoDepots: [],
        floatingTexts: [],
        powerups: [],
        obstacles: [],
        staticStructures: [], // Static map objects (exits, gates, signs, etc.)
        exit: null, // Convenience reference to first static structure (set during initGame)
        mouseX: 0,
        mouseY: 0,
        keys: {},
        cameraX: 0,
        cameraY: 0,
        mapWidth: 0,
        mapHeight: 0,
        speedBoostTimer: 0,
        touch: {
          joystick: { active: false, startX: 0, startY: 0, currentX: 0, currentY: 0 },
          shoot: false,
          jump: false,
          switchWeapon: false
        }
      });

      const initGame = useCallback((level) => {
        const game = gameRef.current;
        const config = LEVEL_CONFIGS[level];

        // Apply difficulty modifiers
        const diffMod = DIFFICULTY_MODIFIERS[difficulty];
        const playerMaxHealth = Math.round(GAME_CONSTANTS.CORE.PLAYER.MAX_HEALTH * diffMod.playerHealthMultiplier);
        const playerStartAmmo = Math.round(GAME_CONSTANTS.CORE.PLAYER.START_AMMO * diffMod.playerAmmoMultiplier);
        const playerStartTranqAmmo = Math.round(GAME_CONSTANTS.ENTITIES.WEAPONS.TRANQUILIZER.startAmmo * diffMod.playerTranqAmmoMultiplier);

        game.player = {
          x: GAME_CONSTANTS.CORE.PLAYER.START_X,
          y: GAME_CONSTANTS.CORE.PLAYER.START_Y,
          health: playerMaxHealth,
          maxHealth: playerMaxHealth,
          ammo: playerStartAmmo,
          tranqAmmo: playerStartTranqAmmo,
          currentWeapon: GAME_CONSTANTS.ENTITIES.WEAPONS.REGULAR,
          speed: GAME_CONSTANTS.CORE.PLAYER.BASE_SPEED,
          baseSpeed: GAME_CONSTANTS.CORE.PLAYER.BASE_SPEED,
          radius: GAME_CONSTANTS.CORE.PLAYER.RADIUS,
          isJumping: false,
          jumpVelocity: 0,
          jumpHeight: 0,
          invincibilityTimer: 0,
          zapTimer: 0
        };
        game.bullets = [];
        game.spit = [];
        game.ammoPickups = [];
        game.tranqDepots = [];
        game.ammoDepots = [];
        game.floatingTexts = [];
        game.powerups = [];
        game.dinosaurs = [];
        game.territories = [];
        game.obstacles = [];
        game.decorations = [];
        game.tarPits = [];
        game.ponds = [];
        game.electricFences = [];
        game.staticStructures = [];
        game.duckFamilies = [];
        game.keys = {};
        game.speedBoostTimer = 0;

        // Set level-specific map dimensions
        game.mapWidth = config.mapWidth;
        game.mapHeight = config.mapHeight;

        // Create exit structure
        const exit = createExit(config.exitX, config.exitY);
        game.staticStructures.push(exit);
        game.exit = exit; // Convenience binding for direct access

        setPlayerHealth(playerMaxHealth);
        setPlayerAmmo(playerStartAmmo);
        setPlayerTranqAmmo(playerStartTranqAmmo);
        setCurrentWeapon(GAME_CONSTANTS.ENTITIES.WEAPONS.REGULAR);
        setSpeedBoostActive(false);

        // Create hazards (tar pits and ponds) using consolidated spawning logic
        spawnHazards({
          count: config.tarPits,
          hazardType: GAME_CONSTANTS.ENTITIES.HAZARDS.TAR_PIT,
          createFn: createTarPit,
          targetArray: game.tarPits,
          existingArrays: [game.tarPits],
          game
        });

        spawnHazards({
          count: config.ponds,
          hazardType: GAME_CONSTANTS.ENTITIES.HAZARDS.POND,
          createFn: createPond,
          targetArray: game.ponds,
          existingArrays: [game.tarPits, game.ponds], // Check against both tar pits and other ponds
          game
        });

        // Create obstacles (blocking: trees, bushes, boulders, rock clusters)
        for (let i = 0; i < config.obstacles; i++) {
          game.obstacles.push(createObstacle(game));
        }

        // Create decorations (walkable: mushroom patches and grass patches) using consolidated spawning
        const mushroomPatchCount = Math.floor(config.obstacles * GAME_CONSTANTS.WORLD.SPAWN.OBSTACLES.MUSHROOMS.PATCH_PERCENTAGE);
        const grassPatchCount = Math.floor(config.obstacles * GAME_CONSTANTS.WORLD.SPAWN.OBSTACLES.GRASS.PATCH_PERCENTAGE);

        spawnDecorationPatches({
          count: mushroomPatchCount,
          createFn: createMushroomPatch,
          spread: GAME_CONSTANTS.WORLD.SPAWN.OBSTACLES.MUSHROOMS.PATCH_SPREAD,
          targetArray: game.decorations,
          game,
          getExtraArgs: () => [Math.floor(Math.random() * GAME_CONSTANTS.ENTITIES.OBSTACLES.MUSHROOM.colors.capColors.length)]
        });

        spawnDecorationPatches({
          count: grassPatchCount,
          createFn: createGrassPatch,
          spread: GAME_CONSTANTS.WORLD.SPAWN.OBSTACLES.GRASS.PATCH_SPREAD,
          targetArray: game.decorations,
          game
        });

        // Sort decorations by z-index for proper rendering order (grass first, mushrooms last)
        game.decorations.sort((a, b) => {
          const aIndex = a.obstacleType.zIndex || 0;
          const bIndex = b.obstacleType.zIndex || 0;
          return aIndex - bIndex;
        });

        // Create exit guards and territory FIRST (before regular dinosaurs)
        // This ensures exit territory exists in game.territories array
        // so regular territorial dinosaurs will avoid it during spawn
        if (config.exitGuards && config.exitGuards.length > 0) {
          // Calculate total number of guards
          const totalGuards = config.exitGuards.reduce((sum, guardType) => sum + guardType.count, 0);

          // Create exit territory
          const exitTerritory = createExitTerritory(config.exitX, config.exitY, totalGuards);
          game.territories.push(exitTerritory);
          const exitTerritoryIndex = game.territories.length - 1;

          // Set exit as locked
          if (game.exit) game.exit.locked = true;

          // Spawn guards in a circle around exit
          let guardIndex = 0;
          config.exitGuards.forEach(guardType => {
            for (let i = 0; i < guardType.count; i++) {
              // Calculate evenly spaced angle around exit
              const angle = (guardIndex / totalGuards) * 360;
              const guard = createExitGuard(guardType.type, angle, config.exitX, config.exitY, exitTerritoryIndex, difficulty);
              game.dinosaurs.push(guard);
              guardIndex++;
            }
          });
        } else {
          // No guards, exit is unlocked
          if (game.exit) game.exit.locked = false;
        }

        // Create dinosaurs
        let dinoIndex = 0;
        config.dinosaurs.forEach(dinoConfig => {
          // Merge config overrides with dinosaur type defaults
          // Config can override speed from LEVEL_CONFIGS (e.g., faster Level 3 raptors)
          const baseSpeed = dinoConfig.speed || dinoConfig.type.speed;
          const count = dinoConfig.count;

          for (let i = 0; i < count; i++) {
            // Calculate initial spawn position
            const initialX = GAME_CONSTANTS.WORLD.SPAWN.DINOSAURS.GRID_START_X + (dinoIndex % 4) * GAME_CONSTANTS.WORLD.SPAWN.DINOSAURS.GRID_SPACING_X + Math.random() * GAME_CONSTANTS.WORLD.SPAWN.DINOSAURS.GRID_RANDOM_OFFSET;
            const initialY = GAME_CONSTANTS.WORLD.SPAWN.DINOSAURS.GRID_START_Y + Math.floor(dinoIndex / 4) * GAME_CONSTANTS.WORLD.SPAWN.DINOSAURS.GRID_SPACING_Y + Math.random() * GAME_CONSTANTS.WORLD.SPAWN.DINOSAURS.GRID_RANDOM_OFFSET;

            // Find collision-free spawn position
            const spawnPos = findValidSpawnPosition(
              initialX,
              initialY,
              dinoConfig.type.baseSize,
              game.obstacles,
              game
            );

            // Mix in navigation/avoidance behavior
            const dino = {
              ...createNavigatingEntity(spawnPos.x, spawnPos.y, dinoConfig.type.baseSize, GAME_CONSTANTS.AI.HAZARD_AVOIDANCE),
              health: dinoConfig.type.health,
              maxHealth: dinoConfig.type.health,
              speed: baseSpeed * diffMod.enemySpeedMultiplier, // Apply difficulty
              baseSpeed: baseSpeed * diffMod.enemySpeedMultiplier,
              size: dinoConfig.type.baseSize,
              color: dinoConfig.type.color,
              type: dinoConfig.type,
              points: dinoConfig.type.points,
              aggressive: dinoConfig.type.aggressive,
              territorial: dinoConfig.type.territorial,
              aggroRange: dinoConfig.type.aggressive ? GAME_CONSTANTS.CORE.COMBAT.DINOSAUR_AGGRO_RANGE : 0,
              fleeRange: dinoConfig.type.aggressive ? 0 : GAME_CONSTANTS.AI.STATES.FLEE.range,
              state: GAME_CONSTANTS.AI.STATES.PATROL,
              motionAngle: Math.random() * Math.PI * 2,
              fleeDurationTimer: 0, // Frames remaining before recalculating flee direction
              isSleeping: false,
              sleepTimer: 0,
              tranqHits: 0,
              spitCooldown: 0,
              facingLeft: false, // Track facing direction to prevent rapid flipping
              zapTimer: 0, // Electric shock animation timer
              avoidFences: [], // Array of {fence, timer} objects for learned fence avoidance
              // Animation properties
              animationFrame: 0, // Counter incremented each frame when moving
              legCycle: 0 // Sine wave value for leg positions (-1 to 1)
            };

            // Override to specify what dinosaurs avoid (only tar pits and ponds)
            dino.getHazardsToCheck = function(game) {
              return [...game.tarPits, ...game.ponds];
            };

            dino.draw = function(ctx) {
              const scale = this.size / this.type.baseSize;
              this.type.drawFunction(ctx, scale, this);
            };

            // Create territory for territorial dinosaurs using factory function
            if (dinoConfig.type.territorial) {
              const territory = createTerritoryForDino(dino, spawnPos, game);
              game.territories.push(territory);
              dino.territoryX = territory.x;
              dino.territoryY = territory.y;
              dino.territoryRadius = territory.radius;
              dino.territoryIndex = game.territories.length - 1; // Link dino to its territory

              // Reposition dino to territory center to ensure it spawns in its zone
              dino.x = territory.x;
              dino.y = territory.y;
            }

            game.dinosaurs.push(dino);
            dinoIndex++;
          }
        });

        // Create powerups
        for (let i = 0; i < config.powerups; i++) {
          game.powerups.push(createPowerup(game));
        }

        // Create tranquilizer depots
        const depotCount = GAME_CONSTANTS.WORLD.SPAWN.DEPOTS.TRANQ.COUNT_BASE + level;
        for (let i = 0; i < depotCount; i++) {
          game.tranqDepots.push(createTranqDepot(game));
        }

        // Create regular ammo depots (minimal ammo for strongest guard + 1 buffer)
        // Depot 1: Near spawn, visible from start
        game.ammoDepots.push(createAmmoDepot(250, 150, config.ammoPerDepot));

        // Depot 2: Furthest corner from spawn (bottom-right)
        const farCornerX = game.mapWidth - 200;
        const farCornerY = game.mapHeight - 200;
        game.ammoDepots.push(createAmmoDepot(farCornerX, farCornerY, config.ammoPerDepot));

        // Create electric fences
        for (let i = 0; i < config.electricFences; i++) {
          game.electricFences.push(createElectricFence(game));
        }

        // Create duck families (ambient wildlife)
        for (let i = 0; i < config.duckFamilies; i++) {
          game.duckFamilies.push(createDuckFamily(game));
        }
      }, [difficulty]);

      // ============================================================================
      // EVENT HANDLERS (Defined before game loop that uses them)
      // ============================================================================

      // Game Flow Handlers
      const startGame = useCallback(() => {
        setCurrentLevel(1);
        setScore(0);
        initGame(1);
        transitionToState(GAME_CONSTANTS.CORE.GAME_STATES.PLAYING, playSound, null, setGameState);
      }, [initGame, playSound]);

      const nextLevel = useCallback(() => {
        const next = currentLevel + 1;
        setCurrentLevel(next);

        // Capture current resources before reset
        const game = gameRef.current;
        const previousHealth = game.player.health;
        const previousAmmo = game.player.ammo;
        const previousTranqAmmo = game.player.tranqAmmo;

        // Initialize new level (resets everything)
        initGame(next);

        // Check if we should restore resources based on difficulty
        const diffMod = DIFFICULTY_MODIFIERS[difficulty];
        if (!diffMod.restoreResourcesOnLevelUp) {
          // Preserve resources across levels (Normal/Hard difficulty)
          game.player.health = previousHealth;
          game.player.ammo = previousAmmo;
          game.player.tranqAmmo = previousTranqAmmo;

          // Update React state to match
          setPlayerHealth(previousHealth);
          setPlayerAmmo(previousAmmo);
          setPlayerTranqAmmo(previousTranqAmmo);
        }

        setGameState(GAME_CONSTANTS.CORE.GAME_STATES.PLAYING);
      }, [currentLevel, difficulty, initGame]);

      // Ammo setters mapping for fireWeapon function
      const ammoSetters = useMemo(() => ({
        playerAmmo: setPlayerAmmo,
        playerTranqAmmo: setPlayerTranqAmmo
      }), []);

      // Desktop Input Handlers
      const handleKeyDown = useCallback((e) => {
        const game = gameRef.current;
        const key = e.key.toLowerCase();
        game.keys[key] = true;

        // Prevent browser defaults for game keys
        if (['w', 'a', 's', 'd', 'arrowup', 'arrowdown', 'arrowleft', 'arrowright', ' ', 'q', 'escape'].includes(key)) {
          e.preventDefault();
        }

        // Handle ESC to pause
        if (key === 'escape') {
          setShowPauseMenu(true);
          playSound(SOUNDS.PAUSE);
          return;
        }

        // Handle jump on spacebar press
        if (key === ' ' && !game.player.isJumping) {
          game.player.isJumping = true;
          game.player.jumpVelocity = GAME_CONSTANTS.CORE.PLAYER.JUMP_VELOCITY;
          playSound(SOUNDS.JUMP);
        }

        // Handle weapon switching with Q key
        if (key === 'q') {
          game.player.currentWeapon = game.player.currentWeapon === GAME_CONSTANTS.ENTITIES.WEAPONS.REGULAR ? GAME_CONSTANTS.ENTITIES.WEAPONS.TRANQUILIZER : GAME_CONSTANTS.ENTITIES.WEAPONS.REGULAR;
          setCurrentWeapon(game.player.currentWeapon);
        }
      }, [playSound]);

      const handleKeyUp = useCallback((e) => {
        const game = gameRef.current;
        game.keys[e.key.toLowerCase()] = false;
      }, []);

      const handleMouseMove = useCallback((e) => {
        const game = gameRef.current;
        const canvas = canvasRef.current;
        const rect = canvas.getBoundingClientRect();
        game.mouseX = e.clientX - rect.left + game.cameraX;
        game.mouseY = e.clientY - rect.top + game.cameraY;
      }, []);

      const handleClick = useCallback((e) => {
        const game = gameRef.current;
        const canvas = canvasRef.current;
        const rect = canvas.getBoundingClientRect();
        let targetX = e.clientX - rect.left + game.cameraX;
        let targetY = e.clientY - rect.top + game.cameraY;

        // Use auto-aim if enabled
        if (autoAim) {
          const nearestDino = findNearestDinosaur(game.player.x, game.player.y, game.dinosaurs);
          if (nearestDino) {
            targetX = nearestDino.x;
            targetY = nearestDino.y;
          } else {
            // Fallback to click position if no dinosaurs
            targetX = e.clientX - rect.left + game.cameraX;
            targetY = e.clientY - rect.top + game.cameraY;
          }
        }

        // Fire weapon using unified logic
        fireWeapon(
          game.player.currentWeapon,
          game.player,
          targetX,
          targetY,
          game,
          playSound,
          null, // No state accumulator (direct setState)
          ammoSetters
        );
      }, [autoAim, playSound, ammoSetters]);

      // Mobile Touch Handlers
      const handleJoystickStart = useCallback((e) => {
        e.preventDefault();
        const touch = e.touches[0];
        const rect = e.currentTarget.getBoundingClientRect();
        const x = touch.clientX - rect.left;
        const y = touch.clientY - rect.top;
        gameRef.current.touch.joystick = {
          active: true,
          startX: x,
          startY: y,
          currentX: x,
          currentY: y
        };
      }, []);

      const handleJoystickMove = useCallback((e) => {
        e.preventDefault();
        if (!gameRef.current.touch.joystick.active) return;
        const touch = e.touches[0];
        const rect = e.currentTarget.getBoundingClientRect();
        gameRef.current.touch.joystick.currentX = touch.clientX - rect.left;
        gameRef.current.touch.joystick.currentY = touch.clientY - rect.top;
      }, []);

      const handleJoystickEnd = useCallback((e) => {
        e.preventDefault();
        gameRef.current.touch.joystick.active = false;
      }, []);

      const handleWeaponSwitch = useCallback((e) => {
        e.preventDefault();
        gameRef.current.touch.switchWeapon = true;
      }, []);

      const handleJumpStart = useCallback((e) => {
        e.preventDefault();
        if (!gameRef.current.player.isJumping) {
          gameRef.current.player.isJumping = true;
          gameRef.current.player.jumpVelocity = GAME_CONSTANTS.CORE.PLAYER.JUMP_VELOCITY;
          playSound(SOUNDS.JUMP);
        }
      }, [playSound]);

      const handleShootStart = useCallback((e) => {
        e.preventDefault();
        gameRef.current.touch.shoot = true;
      }, []);

      const handleShootEnd = useCallback((e) => {
        e.preventDefault();
        gameRef.current.touch.shoot = false;
      }, []);

      // UI Interaction Handlers
      const handlePauseClick = useCallback(() => {
        setShowPauseMenu(true);
        playSound(SOUNDS.PAUSE);
      }, [playSound]);

      const handleSettingsClick = useCallback(() => {
        setShowPauseMenu(true);
        setShowSettingsMenu(true);
      }, []);

      const handleOpenSettings = useCallback(() => {
        setShowSettingsMenu(true);
      }, []);

      const handleCloseSettings = useCallback(() => {
        setShowSettingsMenu(false);
        if (gameState.canPause) {
          setShowPauseMenu(true);
        }
      }, [gameState]);

      // Pause Menu Handlers
      const handleContinue = useCallback(() => {
        setShowPauseMenu(false);
        playSound(SOUNDS.UNPAUSE);
        // Refocus canvas to ensure keyboard input works after resuming
        canvasRef.current?.focus();
      }, [playSound]);

      const handleRestartLevel = useCallback(() => {
        setShowPauseMenu(false);
        playSound(SOUNDS.UNPAUSE);
        initGame(currentLevel);
        setGameState(GAME_CONSTANTS.CORE.GAME_STATES.PLAYING);
      }, [playSound, initGame, currentLevel]);

      const handleExitToMenu = useCallback(() => {
        setShowPauseMenu(false);
        playSound(SOUNDS.VICTORY);
        setGameState(GAME_CONSTANTS.CORE.GAME_STATES.MENU);
      }, [playSound]);

      const handleOpenSettingsFromPause = useCallback(() => {
        setShowPauseMenu(false);
        setShowSettingsMenu(true);
      }, []);

      // Settings Menu Handlers
      const handleSoundToggle = useCallback(() => {
        const newValue = !soundEnabled;
        setSoundEnabled(newValue);
        localStorage.setItem(GAME_CONSTANTS.CONFIG.LOCAL_STORAGE_KEYS.SOUND_ENABLED, JSON.stringify(newValue));
        if (newValue) playSound(SOUNDS.GAME_START);
      }, [soundEnabled, playSound]);

      const handleVolumeChange = useCallback((e) => {
        const newVolume = parseInt(e.target.value) / 100;
        setVolume(newVolume);
        localStorage.setItem(GAME_CONSTANTS.CONFIG.LOCAL_STORAGE_KEYS.VOLUME, newVolume.toString());
        playSound(SOUNDS.DING);
      }, [playSound]);

      const handleViewportScaleChange = useCallback((key) => {
        setViewportScale(key);
        localStorage.setItem(GAME_CONSTANTS.CONFIG.LOCAL_STORAGE_KEYS.VIEWPORT_SCALE, key);
      }, []);

      const handleDifficultyChange = useCallback((key) => {
        setDifficulty(key);
        localStorage.setItem(GAME_CONSTANTS.CONFIG.LOCAL_STORAGE_KEYS.DIFFICULTY, key);
        // Enable auto-aim on Easy difficulty
        if (key === 'easy') {
          setAutoAim(true);
          localStorage.setItem(GAME_CONSTANTS.CONFIG.LOCAL_STORAGE_KEYS.AUTO_AIM, JSON.stringify(true));
        }
      }, []);

      const handleAutoAimToggle = useCallback(() => {
        if (!isTouchDevice) {
          const newValue = !autoAim;
          setAutoAim(newValue);
          localStorage.setItem(GAME_CONSTANTS.CONFIG.LOCAL_STORAGE_KEYS.AUTO_AIM, JSON.stringify(newValue));
        }
      }, [isTouchDevice, autoAim]);

      // ============================================================================
      // GAME LOOP (Defined last, depends on all handlers above)
      // ============================================================================

      useEffect(() => {
        if (!gameState.runsGameLoop) return;

        const canvas = canvasRef.current;
        const ctx = canvas.getContext('2d');
        const game = gameRef.current;

        let animationId;

        // Focus canvas to receive keyboard events
        canvas.focus();

        // Attach event listeners using memoized handlers
        canvas.addEventListener('mousemove', handleMouseMove);
        canvas.addEventListener('click', handleClick);
        window.addEventListener('keydown', handleKeyDown);
        window.addEventListener('keyup', handleKeyUp);

        /**
         * Main game loop running at 60 FPS via requestAnimationFrame
         *
         * @remarks
         * Critical React performance pattern: State Accumulator
         *
         * Problem without accumulator:
         * - 60 game updates per second
         * - Each update triggers multiple setState calls
         * - Each setState causes React re-render
         * - Result: 100+ re-renders per second, janky performance
         *
         * Solution with accumulator:
         * - Create stateAccumulator object at start of frame
         * - All update functions write to accumulator instead of setState
         * - Apply all accumulated changes at end of frame (single re-render)
         * - Result: 60 re-renders per second (one per frame), smooth performance
         *
         * Pattern:
         * ```
         * const stateAccumulator = {};
         * updatePlayerSpeed(game, stateAccumulator);       // writes to accumulator
         * updateDinosaurs(game, difficulty, ..., stateAccumulator);
         * applyStateUpdates(stateAccumulator, setters);    // batch apply all changes
         * ```
         *
         * Early returns for game-over:
         * - Update functions return true if game should end
         * - Prevents rendering/logic after player death
         * - State transition to LOST/WON already queued in accumulator
         */
        const gameLoop = () => {
          // Pause loop when menus are open (but keep loop running)
          if (showPauseMenu || showSettingsMenu) {
            animationId = requestAnimationFrame(gameLoop);
            return;
          }

          // State accumulator: batch all React state updates into single re-render
          const stateAccumulator = {};

          // Update player speed modifiers (tar pits, power-ups)
          updatePlayerSpeed(game, stateAccumulator);

          // Update hazards (electric fences collision with player)
          updateHazards(game, difficulty, playSound, stateAccumulator);

          // Update player movement (keyboard, joystick, collision, camera)
          updatePlayerMovement(game, canvas, stateAccumulator);

          // Handle touch weapon switching
          if (game.touch.switchWeapon) {
            game.player.currentWeapon = game.player.currentWeapon === GAME_CONSTANTS.ENTITIES.WEAPONS.REGULAR ? GAME_CONSTANTS.ENTITIES.WEAPONS.TRANQUILIZER : GAME_CONSTANTS.ENTITIES.WEAPONS.REGULAR;
            stateAccumulator.currentWeapon = game.player.currentWeapon;
            game.touch.switchWeapon = false;
          }

          // Handle touch shooting
          if (game.touch.shoot) {
            const nearestDino = findNearestDinosaur(game.player.x, game.player.y, game.dinosaurs);
            const targetX = nearestDino ? nearestDino.x : game.player.x + GAME_CONSTANTS.INPUT.TOUCH.AUTO_AIM_FALLBACK_DISTANCE;
            const targetY = nearestDino ? nearestDino.y : game.player.y;

            // Fire weapon using unified logic
            const fired = fireWeapon(
              game.player.currentWeapon,
              game.player,
              targetX,
              targetY,
              game,
              playSound,
              stateAccumulator, // Use state accumulator for batched updates
              null
            );

            if (fired) {
              game.touch.shoot = false; // Reset touch shoot flag after firing
            }
          }

          // Update collectibles
          updateCollectibles(game, difficulty, playSound, stateAccumulator);

          // Update bullets
          updateBullets(game, playSound, stateAccumulator);

          // Update spit projectiles
          updateSpitProjectiles(game, difficulty, playSound, stateAccumulator);

          // Update dinosaurs (includes AI, movement, collisions)
          updateDinosaurs(game, difficulty, playSound, stateAccumulator);

          // Update duck families (ambient wildlife)
          updateDuckFamilies(game);

          // Batch apply all state updates (reduces re-renders)
          const setters = {
            gameState: setGameState,
            playerHealth: setPlayerHealth,
            playerAmmo: setPlayerAmmo,
            playerTranqAmmo: setPlayerTranqAmmo,
            currentWeapon: setCurrentWeapon,
            speedBoostActive: setSpeedBoostActive,
            score: (val) => setScore(s => s + val),
          };
          Object.entries(setters).forEach(([key, setter]) => {
            if (stateAccumulator[key] !== undefined) {
              setter(stateAccumulator[key]);
            }
          });

          // Stop game loop if game over
          if (stateAccumulator.gameState !== undefined && stateAccumulator.gameState.isTerminal) {
            return;
          }

          // Check win condition (only if exit is unlocked)
          if (game.exit && !game.exit.locked) {
            const exitCenterX = game.exit.x + game.exit.structureType.width / 2;
            const exitCenterY = game.exit.y + game.exit.structureType.height / 2;
            if (distance(game.player.x, game.player.y, exitCenterX, exitCenterY) < game.player.radius + game.exit.structureType.collisionRadius) {
              // Check if there's another level after this one
              if (LEVEL_CONFIGS[currentLevel + 1]) {
                transitionToState(GAME_CONSTANTS.CORE.GAME_STATES.LEVEL_COMPLETE, playSound, null, setGameState);
              } else {
                transitionToState(GAME_CONSTANTS.CORE.GAME_STATES.WON, playSound, null, setGameState);
              }
            }
          }

          // Render
          ctx.fillStyle = '#3a5f3a';
          ctx.fillRect(0, 0, canvas.width, canvas.height);

          ctx.fillStyle = '#2d4a2d';
          for (let i = 0; i < GAME_CONSTANTS.VISUALS.RENDER.GRASS_PATCHES; i++) {
            const gx = (i * 73) % game.mapWidth - game.cameraX;
            const gy = (i * 97) % game.mapHeight - game.cameraY;
            ctx.fillRect(gx, gy, GAME_CONSTANTS.VISUALS.RENDER.GRASS_PATCH_SIZE, GAME_CONSTANTS.VISUALS.RENDER.GRASS_PATCH_SIZE);
          }

          // Draw entities using batch utility (maintains z-index layering via argument order)
          drawEntities(ctx, game.cameraX, game.cameraY,
            game.staticStructures, // Layer 1: Static structures (exits, gates, signs)
            game.tarPits,          // Layer 2: Tar pits (ground hazards)
            game.ponds,            // Layer 3: Ponds (water hazards)
            game.electricFences,   // Layer 4: Electric fences
            game.decorations,      // Layer 5: Walkable decorations (grass, mushrooms)
            game.obstacles,        // Layer 6: Blocking obstacles (trees, bushes)
            game.powerups,         // Layer 7: Collectible powerups
            game.tranqDepots,      // Layer 8: Tranquilizer depots
            game.ammoDepots,       // Layer 9: Regular ammo depots
            game.territories       // Layer 10: Territory markers
          );

          // Draw duck families (ambient wildlife)
          game.duckFamilies.forEach(family => {
            const aiConfig = GAME_CONSTANTS.AI.AMBIENT_DUCKS;
            const isSwimming = family.state === aiConfig.STATES.SWIMMING;

            // Draw ducklings first (behind mama)
            family.ducklings.forEach(duckling => {
              const screenX = duckling.x - game.cameraX;
              const screenY = duckling.y - game.cameraY;

              ctx.save();
              ctx.translate(screenX, screenY);

              // Ducklings always face mama
              const dxToMama = family.mama.x - duckling.x;
              if (Math.abs(dxToMama) > 1) {
                if (dxToMama < 0) ctx.scale(-1, 1);
              }

              GAME_CONSTANTS.ENTITIES.AMBIENT_WILDLIFE.DUCKLING.drawFunction(
                ctx,
                duckling.size,
                isSwimming,
                duckling.animationFrame
              );

              ctx.restore();
            });

            // Draw mama duck (on top of ducklings)
            const mamaScreenX = family.mama.x - game.cameraX;
            const mamaScreenY = family.mama.y - game.cameraY;

            ctx.save();
            ctx.translate(mamaScreenX, mamaScreenY);

            // Mama faces direction of movement
            if (family.mama.facingLeft) {
              ctx.scale(-1, 1);
            }

            GAME_CONSTANTS.ENTITIES.AMBIENT_WILDLIFE.MAMA_DUCK.drawFunction(
              ctx,
              family.mama.size,
              isSwimming,
              family.mama.animationFrame
            );

            ctx.restore();
          });

          // Draw dinosaurs
          game.dinosaurs.forEach(dino => {
            const screenX = dino.x - game.cameraX;
            const screenY = dino.y - game.cameraY;

            ctx.save();
            ctx.translate(screenX, screenY);

            // Use stored facing direction instead of instant velocity check
            if (dino.facingLeft) {
              ctx.scale(-1, 1);
            }

            // Use instance method pattern - dinosaur draws itself
            dino.draw(ctx);

            ctx.restore();

            // Health bar
            const barWidth = dino.size * GAME_CONSTANTS.VISUALS.HEALTH_BAR.WIDTH_MULTIPLIER;
            const barHeight = GAME_CONSTANTS.VISUALS.HEALTH_BAR.HEIGHT;
            const barY = screenY - dino.size * GAME_CONSTANTS.VISUALS.HEALTH_BAR.POSITION_MULTIPLIER;
            ctx.fillStyle = GAME_CONSTANTS.VISUALS.HEALTH_BAR.BORDER_COLOR;
            ctx.fillRect(screenX - barWidth / 2 - GAME_CONSTANTS.VISUALS.HEALTH_BAR.BORDER_OFFSET, barY - GAME_CONSTANTS.VISUALS.HEALTH_BAR.BORDER_OFFSET, barWidth + GAME_CONSTANTS.VISUALS.HEALTH_BAR.BORDER_PADDING, barHeight + GAME_CONSTANTS.VISUALS.HEALTH_BAR.BORDER_PADDING);
            ctx.fillStyle = GAME_CONSTANTS.VISUALS.HEALTH_BAR.BACKGROUND_COLOR;
            ctx.fillRect(screenX - barWidth / 2, barY, barWidth, barHeight);
            ctx.fillStyle = GAME_CONSTANTS.VISUALS.HEALTH_BAR.HEALTH_COLOR;
            ctx.fillRect(screenX - barWidth / 2, barY, barWidth * (dino.health / dino.maxHealth), barHeight);

            // Zap effect (electric shock animation)
            drawZapEffect(ctx, screenX, screenY, dino.size, dino.zapTimer);
          });

          // Draw sleeping Z-Z-Z (batched, optimized)
          const sleepingDinos = game.dinosaurs.filter(dino => dino.isSleeping);
          if (sleepingDinos.length > 0) {
            // Batch canvas styles for Z animation
            applyCanvasStyles(ctx, {
              fillStyle: GAME_CONSTANTS.VISUALS.Z_ANIMATION.FILL_COLOR,
              textAlign: GAME_CONSTANTS.VISUALS.Z_ANIMATION.TEXT_ALIGN,
              shadowColor: GAME_CONSTANTS.VISUALS.Z_ANIMATION.SHADOW_COLOR,
              shadowBlur: GAME_CONSTANTS.VISUALS.Z_ANIMATION.SHADOW_BLUR
            });

            const buffer = GAME_CONSTANTS.VISUALS.Z_ANIMATION.CULLING_BUFFER;
            const bobOffset = Math.sin(Date.now() / GAME_CONSTANTS.VISUALS.Z_ANIMATION.BOB_SPEED) * GAME_CONSTANTS.VISUALS.Z_ANIMATION.BOB_AMPLITUDE;

            sleepingDinos.forEach(dino => {
              const screenX = dino.x - game.cameraX;
              const screenY = dino.y - game.cameraY;

              // Cull off-screen sleeping dinos
              if (screenX < -buffer || screenX > canvas.width + buffer || screenY < -buffer || screenY > canvas.height + buffer) {
                return;
              }

              // Draw Z's with increasing size (loop through configs)
              GAME_CONSTANTS.VISUALS.Z_ANIMATION.Z_CONFIGS.forEach(zConfig => {
                ctx.font = zConfig.FONT;
                ctx.fillText('Z',
                  screenX + dino.size + zConfig.OFFSET_X,
                  screenY - dino.size + zConfig.OFFSET_Y + bobOffset);
              });
            });

            // Reset state once at end
            ctx.shadowBlur = 0;
          }

          // Draw player
          drawPlayer(ctx, game.player, game.cameraX, game.cameraY, game.mouseX, game.mouseY, game.speedBoostTimer);

          // Draw projectiles (bullets and spit) using batch rendering
          drawEntities(ctx, game.cameraX, game.cameraY,
            game.bullets,  // Layer 1: Bullets
            game.spit      // Layer 2: Spit projectiles
          );

          // Draw ammo pickups (using instance methods)
          game.ammoPickups.forEach(pickup => pickup.draw(ctx, game.cameraX, game.cameraY));

          // Draw floating texts (using instance methods with batch canvas styles)
          if (game.floatingTexts.length > 0) {
            applyCanvasStyles(ctx, {
              font: GAME_CONSTANTS.VISUALS.FLOATING_TEXT.FONT,
              textAlign: 'center',
              lineWidth: GAME_CONSTANTS.VISUALS.FLOATING_TEXT.LINE_WIDTH,
              shadowColor: GAME_CONSTANTS.VISUALS.FLOATING_TEXT.SHADOW_COLOR,
              shadowBlur: GAME_CONSTANTS.VISUALS.FLOATING_TEXT.SHADOW_BLUR
            });

            game.floatingTexts.forEach(text => text.draw(ctx, game.cameraX, game.cameraY));

            // Reset canvas state
            ctx.globalAlpha = GAME_CONSTANTS.VISUALS.FLOATING_TEXT.ALPHA_OPAQUE;
            ctx.shadowBlur = 0;
          }

          animationId = requestAnimationFrame(gameLoop);
        };

        gameLoop();

        return () => {
          cancelAnimationFrame(animationId);
          canvas.removeEventListener('mousemove', handleMouseMove);
          canvas.removeEventListener('click', handleClick);
          window.removeEventListener('keydown', handleKeyDown);
          window.removeEventListener('keyup', handleKeyUp);
        };
      }, [gameState, currentLevel, playSound, showPauseMenu, showSettingsMenu, difficulty, handleKeyDown, handleKeyUp, handleMouseMove, handleClick]);

      // ============================================================================
      // REACT COMPONENT RENDER
      // ============================================================================

      return (
        <div className="flex flex-col items-center justify-center min-h-screen bg-gray-900 p-4">
          {gameState === GAME_CONSTANTS.CORE.GAME_STATES.MENU && (
            <div className="text-center">
              <h1 className="text-5xl font-bold text-green-400 mb-4">JURASSIC ESCAPE</h1>
              <p className="text-gray-300 mb-2">Navigate through the dangerous park and reach the exit!</p>
              <div className="text-gray-400 mb-2 space-y-1">
                {isTouchDevice ? (
                  <>
                    <p>Use joystick to move • JUMP to clear obstacles</p>
                    <p>Tap weapon button to switch • FIRE to shoot</p>
                  </>
                ) : (
                  <>
                    <p>WASD/Arrows to move • Spacebar to jump • Q to switch weapon</p>
                    <p>Mouse to aim (or enable auto-aim 🎯) • Click to shoot</p>
                  </>
                )}
              </div>
              <div className="text-gray-300 mb-6 space-y-2">
                <p className="flex items-center justify-center gap-2">
                  <span className="inline-block w-4 h-4 bg-red-500 rounded-full"></span>
                  Health Pack - Restores 1 heart
                </p>
                <p className="flex items-center justify-center gap-2">
                  <span className="inline-block w-4 h-4 bg-cyan-400 rounded-full"></span>
                  Speed Boost - Temporary speed increase
                </p>
                <p className="flex items-center justify-center gap-2">
                  <span className="inline-block w-4 h-4 bg-green-600 rounded"></span>
                  Tranquilizer Depot - Refills {GAME_CONSTANTS.ENTITIES.WEAPONS.TRANQUILIZER.icon} ammo
                </p>
              </div>
              <div className="flex flex-col gap-3">
                <button
                  onClick={startGame}
                  className="px-8 py-3 bg-green-600 hover:bg-green-700 text-white font-bold rounded-lg text-xl"
                >
                  START GAME
                </button>
                <button
                  onClick={handleOpenSettings}
                  className="px-8 py-3 bg-gray-700 hover:bg-gray-600 text-white font-bold rounded-lg text-lg flex items-center justify-center gap-2"
                >
                  <span>⚙️</span>
                  <span>SETTINGS</span>
                </button>
              </div>
            </div>
          )}

          {gameState === GAME_CONSTANTS.CORE.GAME_STATES.PLAYING && (
            <div className="flex flex-col items-center">
              <GameHUD
                health={playerHealth}
                maxHealth={5}
                ammo={playerAmmo}
                tranqAmmo={playerTranqAmmo}
                currentWeapon={currentWeapon}
                score={score}
                currentLevel={currentLevel}
                speedBoostActive={speedBoostActive}
                autoAim={autoAim}
                isTouchDevice={isTouchDevice}
                debugMode={debugMode}
                onPauseClick={handlePauseClick}
                onSettingsClick={handleSettingsClick}
              />
              <div className="relative">
                <canvas
                  ref={canvasRef}
                  width={currentViewport.width}
                  height={currentViewport.height}
                  style={{ width: `${canvasSize.width}px`, height: `${canvasSize.height}px` }}
                  className="border-4 border-green-600 bg-green-900 cursor-crosshair"
                  tabIndex={0}
                />

                {/* Touch Controls Overlay */}
                {isTouchDevice && (
                  <TouchControls
                    joystickActive={gameRef.current.touch.joystick.active}
                    joystickX={gameRef.current.touch.joystick.currentX}
                    joystickY={gameRef.current.touch.joystick.currentY}
                    currentWeapon={gameRef.current.player.currentWeapon}
                    onJoystickStart={handleJoystickStart}
                    onJoystickMove={handleJoystickMove}
                    onJoystickEnd={handleJoystickEnd}
                    onWeaponSwitch={handleWeaponSwitch}
                    onJumpStart={handleJumpStart}
                    onShootStart={handleShootStart}
                    onShootEnd={handleShootEnd}
                  />
                )}
              </div>
              <p className="text-gray-400 mt-2 text-center">
                {isTouchDevice ? (
                  <span>Joystick to move • Tap {GAME_CONSTANTS.ENTITIES.WEAPONS.REGULAR.icon}/{GAME_CONSTANTS.ENTITIES.WEAPONS.TRANQUILIZER.icon} to switch weapon • FIRE to auto-aim • JUMP to escape!</span>
                ) : autoAim ? (
                  <span>WASD/Arrows to move • Q to switch weapon • Click to auto-aim 🎯 • Spacebar to jump!</span>
                ) : (
                  <span>WASD/Arrows to move • Q to switch weapon • Mouse to aim • Click to shoot • Spacebar to jump!</span>
                )}
              </p>

              {showPauseMenu && (
                <PauseMenu
                  onContinue={handleContinue}
                  onRestart={handleRestartLevel}
                  onExitToMenu={handleExitToMenu}
                  onOpenSettings={handleOpenSettingsFromPause}
                />
              )}
            </div>
          )}

          {gameState === GAME_CONSTANTS.CORE.GAME_STATES.LEVEL_COMPLETE && (
            <div className="text-center">
              <h1 className="text-5xl font-bold text-green-400 mb-4">LEVEL {currentLevel} COMPLETE!</h1>
              <p className="text-2xl text-white mb-4">Score: {score}</p>
              <button
                onClick={nextLevel}
                className="px-8 py-3 bg-green-600 hover:bg-green-700 text-white font-bold rounded-lg text-xl"
              >
                NEXT LEVEL
              </button>
            </div>
          )}

          {gameState === GAME_CONSTANTS.CORE.GAME_STATES.WON && (
            <div className="text-center">
              <h1 className="text-5xl font-bold text-green-400 mb-4">YOU ESCAPED!</h1>
              <p className="text-3xl text-yellow-400 mb-2">ALL LEVELS COMPLETE!</p>
              <p className="text-2xl text-white mb-4">Final Score: {score}</p>
              <button
                onClick={startGame}
                className="px-8 py-3 bg-green-600 hover:bg-green-700 text-white font-bold rounded-lg text-xl"
              >
                PLAY AGAIN
              </button>
            </div>
          )}

          {gameState === GAME_CONSTANTS.CORE.GAME_STATES.LOST && (
            <div className="text-center">
              <h1 className="text-5xl font-bold text-red-500 mb-4">GAME OVER</h1>
              <p className="text-xl text-white mb-2">Level {currentLevel}</p>
              <p className="text-2xl text-white mb-4">Final Score: {score}</p>
              <button
                onClick={startGame}
                className="px-8 py-3 bg-green-600 hover:bg-green-700 text-white font-bold rounded-lg text-xl"
              >
                TRY AGAIN
              </button>
            </div>
          )}

          {/* Settings Menu Overlay */}
          {showSettingsMenu && (
            <SettingsMenu
              soundEnabled={soundEnabled}
              volume={volume}
              viewportScale={viewportScale}
              difficulty={difficulty}
              autoAim={autoAim}
              isTouchDevice={isTouchDevice}
              onSoundToggle={handleSoundToggle}
              onVolumeChange={handleVolumeChange}
              onViewportScaleChange={handleViewportScaleChange}
              onDifficultyChange={handleDifficultyChange}
              onAutoAimToggle={handleAutoAimToggle}
              onClose={handleCloseSettings}
            />
          )}
        </div>
      );
    };

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<JurassicEscape />);
  </script>
</body>

</html>
