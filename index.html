    /**
     * Create an ammo pickup with bouncing physics
     *
     * @param {number} x - Spawn X position
     * @param {number} y - Spawn Y position (in air)
     * @param {number} startY - Ground level Y position
     * @param {number} ammoAmount - Amount of ammo to grant when collected
     * @returns {Object} AmmoPickup object with update() and draw() instance methods
     *
     * @remarks
     * Implements satisfying bounce physics with progressive damping.
     *
     * Why collection requires first bounce:
     * - Prevents instant pickup when spawned (spawns at dinosaur death location)
     * - Creates visual feedback - player sees ammo drop and bounce
     * - Gives player time to react and position for collection
     * - Makes pickup feel more "physical" and rewarding
     *
     * Progressive damping algorithm:
     * - Each bounce reduces velocity by damping factor
     * - Damping increases with bounce count (bounces get progressively weaker)
     * - Formula: damping * (1 - bounceProgress * progressiveFactor)
     * - This creates natural-looking bounce decay (not linear)
     * - Pickup expires after MAX_BOUNCES instead of becoming static
     *
     * Collection radius bonus:
     * - Slightly larger than visual radius for forgiving pickup
     * - Improves player experience especially on mobile
     */
    const createAmmoPickup = (x, y, startY, ammoAmount) => {
      const pickup = {
        x,
        y,
        startY,
        radius: GAME_CONSTANTS.WORLD.AMMO_PICKUP.RADIUS,
        vx: 0, // No horizontal velocity for vertical-only bounce
        vy: GAME_CONSTANTS.WORLD.AMMO_PICKUP.INITIAL_UPWARD_VELOCITY,
        ammoAmount,
        hasBounced: false,
        bounceCount: 0
      };

      // Instance method: physics update, bounce logic, and collection detection
      pickup.update = function(player, difficulty, playSound, stateAccumulator, createFloatingText) {
        this.y += this.vy;
        this.vy += GAME_CONSTANTS.CORE.PHYSICS.AMMO_GRAVITY;

        // Ground collision with bounce
        if (this.y >= this.startY && this.vy > 0) {
          this.y = this.startY; // Snap to ground
          this.bounceCount++;

          // Progressive damping: bounces get weaker over time
          // Later bounces have stronger damping for natural decay
          const diffMod = DIFFICULTY_MODIFIERS[difficulty];
          const adjustedDamping = GAME_CONSTANTS.CORE.PHYSICS.AMMO_BOUNCE_DAMPING * diffMod.ammoDampingMultiplier;
          const maxBounces = GAME_CONSTANTS.WORLD.AMMO_PICKUP.MAX_BOUNCES;
          const bounceProgress = this.bounceCount / maxBounces;
          const progressiveDamping = adjustedDamping * (1 - bounceProgress * GAME_CONSTANTS.WORLD.AMMO_PICKUP.PROGRESSIVE_DAMPING_FACTOR);

          this.vy *= progressiveDamping;
          this.hasBounced = true;
        }

        // Collection check (only after first bounce to prevent instant pickup)
        if (this.hasBounced) {
          if (circleCollision(this.x, this.y, this.radius + GAME_CONSTANTS.WORLD.AMMO_PICKUP.COLLECTION_BONUS_RADIUS, player.x, player.y, player.radius)) {
            player.ammo += this.ammoAmount;
            stateAccumulator.playerAmmo = player.ammo;
            playSound(SOUNDS.PICKUP_AMMO);
            stateAccumulator.floatingTexts = stateAccumulator.floatingTexts || [];
            stateAccumulator.floatingTexts.push(createFloatingText(this.x, this.y, `+${this.ammoAmount}`, '#FFD700'));
            return false; // Signal removal
          }
        }

        // Keep pickup alive until max bounces reached
        return this.bounceCount < GAME_CONSTANTS.WORLD.AMMO_PICKUP.MAX_BOUNCES;
      };

      pickup.draw = function(ctx, cameraX, cameraY) {
        const screenPos = toScreenCoords(this.x, this.y, cameraX, cameraY);

        ctx.fillStyle = GAME_CONSTANTS.WORLD.AMMO_PICKUP.COLOR;
        ctx.beginPath();
        ctx.arc(screenPos.x, screenPos.y, this.radius, 0, Math.PI * 2);
        ctx.fill();

        ctx.fillStyle = '#000';
        ctx.font = 'bold 10px Arial';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText(`×${this.ammoAmount}`, screenPos.x, screenPos.y);
      };

      return pickup;
    };

    /**
     * Create a spit projectile object
     * @param {number} fromX - Starting X position
     * @param {number} fromY - Starting Y position
     * @param {number} toX - Target X position
     * @param {number} toY - Target Y position
     * @param {Object} dinoType - Dinosaur config object with spitAttack properties
     */
    const createSpitProjectile = (fromX, fromY, toX, toY, dinoType) => {
      const angle = Math.atan2(toY - fromY, toX - fromX);
      const spit = {
        x: fromX,
        y: fromY,
        vx: Math.cos(angle) * dinoType.spitAttack.projectileSpeed,
        vy: Math.sin(angle) * dinoType.spitAttack.projectileSpeed,
        radius: dinoType.spitAttack.projectileRadius,
        damage: dinoType.spitAttack.damage
      };

      spit.update = function(mapWidth, mapHeight) {
        this.x += this.vx;
        this.y += this.vy;
        return isInBounds(this.x, this.y, mapWidth, mapHeight);
      };

      spit.draw = function(ctx, cameraX, cameraY) {
        const screenPos = toScreenCoords(this.x, this.y, cameraX, cameraY);
        const spitAttack = GAME_CONSTANTS.ENTITIES.DINOSAURS.DILOPHOSAURUS.spitAttack;
        applyCanvasStyles(ctx, {
          fillStyle: spitAttack.fillColor,
          strokeStyle: spitAttack.strokeColor,
          lineWidth: spitAttack.lineWidth
        });
        ctx.beginPath();
        ctx.arc(screenPos.x, screenPos.y, this.radius, 0, Math.PI * 2);
        ctx.fill();
        ctx.stroke();
      };

      return spit;
    };

    /**
     * Create a tar pit object with bubbles
     */
    const createTarPit = (x, y) => {
      const type = GAME_CONSTANTS.ENTITIES.HAZARDS.TAR_PIT;
      // Generate random size: variance from 50% to 200% of base radius
      const sizeMultiplier = 0.5 + (Math.random() * type.sizeVariance);
      const radius = type.baseRadius * sizeMultiplier;

      const tarPit = {
        x,
        y,
        radius,
        hazardType: type,
        bubbles: Array.from({ length: type.bubble.count }, () => ({
          timer: Math.random() * type.bubble.frequency,
          ...randomizeBubbleOffset()
        }))
      };

      tarPit.draw = function(ctx, cameraX, cameraY) {
        this.hazardType.drawFunction(ctx, cameraX, cameraY, this);
      };

      return tarPit;
    };

    /**
     * Create a pond object with ripples and vegetation
     * @param {number} x - Pond center X position
     * @param {number} y - Pond center Y position
     * @returns {Object} Pond object with draw instance method
     */
    const createPond = (x, y) => {
      const type = GAME_CONSTANTS.ENTITIES.HAZARDS.POND;
      // Generate random size: variance from 50% to 170% of base radius
      const sizeMultiplier = 0.5 + (Math.random() * type.sizeVariance);
      const radius = type.baseRadius * sizeMultiplier;

      // Generate random vegetation positions (lily pads scattered in water)
      const lilyPads = Array.from({ length: type.vegetation.lilyPadCount }, () => {
        const angle = Math.random() * Math.PI * 2;
        const distance = Math.random() * (radius * 0.7); // Keep within 70% of pond radius
        return {
          offsetX: Math.cos(angle) * distance,
          offsetY: Math.sin(angle) * distance,
        };
      });

      // Generate random reed positions (around edges)
      const reeds = Array.from({ length: type.vegetation.reedCount }, () => {
        const angle = Math.random() * Math.PI * 2;
        const distance = radius * (0.75 + Math.random() * 0.20); // 75-95% of radius (near edges)
        return {
          offsetX: Math.cos(angle) * distance,
          offsetY: Math.sin(angle) * distance,
        };
      });

      const pond = {
        x,
        y,
        radius,
        hazardType: type,
        lilyPads,
        reeds,
        ripples: Array.from({ length: type.ripple.count }, () => ({
          timer: Math.random() * type.ripple.frequency,
          offsetX: randomCentered(type.ripple.spread),
          offsetY: randomCentered(type.ripple.spread),
        }))
      };

      pond.draw = function(ctx, cameraX, cameraY) {
        this.hazardType.drawFunction(ctx, cameraX, cameraY, this);
      };

      return pond;
    };

    /**
     * Create an electric fence object with guaranteed valid position
     * @param {Object} game - Game state object (for collision checking)
     * @returns {Object} Electric fence object (always succeeds)
     */
    const createElectricFence = (game) => {
      const type = GAME_CONSTANTS.ENTITIES.HAZARDS.ELECTRIC_FENCE;
      const fenceRadius = type.width / 2;

      // Position generator: random position within safe zone
      const generatePosition = () => ({
        x: GAME_CONSTANTS.WORLD.SPAWN.POWERUPS.SAFE_ZONE_MARGIN + Math.random() * (game.mapWidth - GAME_CONSTANTS.WORLD.SPAWN.POWERUPS.SAFE_ZONE_PADDING),
        y: GAME_CONSTANTS.WORLD.SPAWN.POWERUPS.SAFE_ZONE_MARGIN + Math.random() * (game.mapHeight - GAME_CONSTANTS.WORLD.SPAWN.POWERUPS.SAFE_ZONE_PADDING)
      });

      // Validator: fence-to-fence spacing + general collision
      const isValid = (x, y) => {
        return checkMinimumSpacing(x, y, game.electricFences, type.minSpacing) &&
               isValidPosition(x, y, fenceRadius, game, type.obstacleClearance);
      };

      // Retry until valid position found (infinite attempts, no fallback)
      const pos = retryUntilValid(generatePosition, isValid);

      const fence = {
        x: pos.x,
        y: pos.y,
        rotation: Math.random() * Math.PI * 2, // Random rotation
        hazardType: type,
        sparkTimer: Math.random() * type.spark.frequency,
        playerDamageCooldown: 0
      };

      fence.draw = function(ctx, cameraX, cameraY) {
        this.hazardType.drawFunction(ctx, cameraX, cameraY, this);
      };

      return fence;
    };

    /**
     * Create an exit (static structure)
     * @param {number} x - Exit X position
     * @param {number} y - Exit Y position
     * @returns {Object} Exit object with draw() instance method
     */
    const createExit = (x, y) => {
      const type = GAME_CONSTANTS.ENTITIES.STATIC_STRUCTURES.EXIT;
      const exit = {
        x,
        y,
        structureType: type,
        locked: true, // Exit starts locked (unlocks when conditions met)
      };

      exit.draw = function(ctx, cameraX, cameraY) {
        const screenX = this.x - cameraX;
        const screenY = this.y - cameraY;

        ctx.fillStyle = this.locked ? this.structureType.lockedFillColor : this.structureType.unlockedFillColor;
        ctx.fillRect(screenX, screenY, this.structureType.width, this.structureType.height);

        ctx.strokeStyle = this.locked ? this.structureType.lockedStrokeColor : this.structureType.unlockedStrokeColor;
        ctx.lineWidth = this.structureType.borderWidth;
        ctx.strokeRect(screenX, screenY, this.structureType.width, this.structureType.height);

        ctx.fillStyle = this.structureType.textColor;
        ctx.font = this.structureType.textFont;
        ctx.textAlign = 'center';
        ctx.fillText('EXIT', screenX + this.structureType.width / 2, screenY + this.structureType.height / 2 + this.structureType.textOffsetY);

        if (this.locked) {
          ctx.font = `${this.structureType.lockIconSize}px Arial`;
          ctx.textAlign = 'center';
          ctx.textBaseline = 'middle';
          ctx.fillText(
            this.structureType.lockIcon,
            screenX + this.structureType.width / 2,
            screenY + this.structureType.lockIconOffsetY
          );
        }
      };

      return exit;
    };

    /**
     * Create a duck family with mama duck and 2-5 ducklings
     *
     * @param {Object} game - Game state object (for collision checking and ponds)
     * @returns {Object} Duck family object with mama, ducklings, and update() instance method
     *
     * @remarks
     * Duck families follow a state machine:
     * - WANDER: Random movement until pond detected
     * - SEEK_POND: Navigate toward target pond (avoids obstacles)
     * - SWIMMING: Circular swim patterns for 30-60 seconds
     * - EXIT_POND: Swim to edge and waddle away
     * - After exiting: 50% return to same pond, 50% seek new pond
     *
     * Collision avoidance:
     * - Ducks steer around obstacles and electric fences
     * - Use simple raycast ahead detection + steering angle
     * - Cannot pass through blocking obstacles or boundaries
     */
    const createDuckFamily = (game) => {
      const mamaType = GAME_CONSTANTS.ENTITIES.AMBIENT_WILDLIFE.MAMA_DUCK;
      const ducklingType = GAME_CONSTANTS.ENTITIES.AMBIENT_WILDLIFE.DUCKLING;
      const spawnConfig = GAME_CONSTANTS.WORLD.SPAWN.AMBIENT_WILDLIFE.DUCK_FAMILIES;
      const aiConfig = GAME_CONSTANTS.AI.AMBIENT_DUCKS;

      // Find valid spawn position for mama (near pond if possible)
      let mamaX, mamaY;
      const maxAttempts = 50;
      for (let attempt = 0; attempt < maxAttempts; attempt++) {
        mamaX = 100 + Math.random() * (game.mapWidth - 200);
        mamaY = 100 + Math.random() * (game.mapHeight - 200);

        if (isValidPosition(mamaX, mamaY, mamaType.collisionRadius, game, spawnConfig.SPAWN_CLEARANCE)) {
          break;
        }
      }

      // Random brood size (2-5 ducklings)
      const broodSize = spawnConfig.MIN_BROOD_SIZE +
                       Math.floor(Math.random() * (spawnConfig.MAX_BROOD_SIZE - spawnConfig.MIN_BROOD_SIZE + 1));

      // Create mama duck using navigation mixin for obstacle avoidance
      const mama = {
        ...createNavigatingEntity(mamaX, mamaY, mamaType.collisionRadius, aiConfig.AVOIDANCE),
        // Duck-specific properties
        angle: Math.random() * Math.PI * 2,
        motionAngle: Math.random() * Math.PI * 2, // Alias for navigation mixin (synced with angle)
        speed: mamaType.waddleSpeed,
        size: mamaType.size,
        animationFrame: 0,
        facingLeft: false,
      };

      // Create ducklings in single-file line behind mama
      const ducklings = [];
      for (let i = 0; i < broodSize; i++) {
        const offsetAngle = mama.angle + Math.PI; // Straight behind mama
        const offsetDistance = aiConfig.DUCKLING.followDistance * (i + 1);

        ducklings.push({
          x: mama.x + Math.cos(offsetAngle) * offsetDistance,
          y: mama.y + Math.sin(offsetAngle) * offsetDistance,
          size: ducklingType.size,
          animationFrame: Math.random() * 100, // Random phase for variety
          targetOffsetIndex: i, // For path following
        });
      }

      // Override navigation mixin: specify what mama duck should avoid
      // Ducks avoid obstacles, fences, tar pits, dinosaurs, and player - but NOT ponds (they swim in ponds!)
      mama.getHazardsToCheck = function(game) {
        return [...game.obstacles, ...game.electricFences, ...game.tarPits, ...game.dinosaurs, game.player];
      };

      // Set initial state on mama (she's the leader!)
      mama.state = aiConfig.STATES.WANDER;

      // Duck family object - mama.state is the source of truth
      const family = {
        mama,
        ducklings,
        targetPond: null,
        lastPond: null,
        visitedPonds: [], // Track which ponds have been visited
        swimTimer: 0,
        wanderTimer: Math.floor(Math.random() * aiConfig.STATES.WANDER.directionChangeFrequency),
        swimAngle: 0, // For circular swimming angle
        swimRadiusPhase: 0, // For variable radius oscillation
        swimCenterX: 0, // Center of swimming area
        swimCenterY: 0,
        rippleTimer: 0,
      };

      // Convenience getter: family.state reads from mama (she's in charge!)
      Object.defineProperty(family, 'state', {
        get() { return this.mama.state; },
        set(newState) { this.mama.state = newState; }
      });

      // Update instance method - AI state machine
      family.update = function(game) {
        this.mama.animationFrame++;

        // Update state machine
        if (this.state === aiConfig.STATES.WANDER) {
          // Wander behavior: random direction changes
          this.wanderTimer--;
          if (this.wanderTimer <= 0) {
            this.mama.angle += randomCentered(aiConfig.STATES.WANDER.angleVariance);
            this.wanderTimer = aiConfig.STATES.WANDER.directionChangeFrequency;
          }

          // Check for nearby unoccupied ponds
          for (const pond of game.ponds) {
            const dist = distance(this.mama.x, this.mama.y, pond.x, pond.y);
            if (dist < aiConfig.STATES.SEEK_POND.detectionRange) {
              // Check if pond is occupied by another family
              const isPondOccupied = game.duckFamilies.some(otherFamily =>
                otherFamily !== this &&
                otherFamily.targetPond === pond &&
                (otherFamily.state === aiConfig.STATES.SWIMMING || otherFamily.state === aiConfig.STATES.SEEK_POND)
              );

              if (!isPondOccupied) {
                this.targetPond = pond;
                this.state = aiConfig.STATES.SEEK_POND; // Sets mama.state via getter
                break;
              }
            }
          }

          // Move mama in wander direction
          // Sync angle properties for mixin compatibility
          this.mama.motionAngle = this.mama.angle;

          // Apply obstacle avoidance (mixin automatically checks state.avoidsHazards)
          this.mama.applyAvoidance(game);

          // Sync back to angle (mixin updates motionAngle)
          this.mama.angle = this.mama.motionAngle;

          this.mama.vx = Math.cos(this.mama.angle) * mamaType.waddleSpeed;
          this.mama.vy = Math.sin(this.mama.angle) * mamaType.waddleSpeed;

        } else if (this.state === aiConfig.STATES.SEEK_POND) {
          // Seek pond behavior: move toward target pond
          if (!this.targetPond) {
            this.state = aiConfig.STATES.WANDER; // Sets mama.state via getter
            return;
          }

          const dx = this.targetPond.x - this.mama.x;
          const dy = this.targetPond.y - this.mama.y;
          const targetAngle = Math.atan2(dy, dx);

          // Smooth steering toward target
          let angleDiff = targetAngle - this.mama.angle;
          while (angleDiff > Math.PI) angleDiff -= Math.PI * 2;
          while (angleDiff < -Math.PI) angleDiff += Math.PI * 2;
          this.mama.angle += angleDiff * aiConfig.STATES.SEEK_POND.steeringForce;

          // Sync angle properties for mixin compatibility
          this.mama.motionAngle = this.mama.angle;

          // Apply obstacle avoidance (mixin automatically checks state.avoidsHazards)
          this.mama.applyAvoidance(game);

          // Sync back to angle (mixin updates motionAngle)
          this.mama.angle = this.mama.motionAngle;

          this.mama.vx = Math.cos(this.mama.angle) * mamaType.waddleSpeed;
          this.mama.vy = Math.sin(this.mama.angle) * mamaType.waddleSpeed;

          // Check if reached pond
          const dist = distance(this.mama.x, this.mama.y, this.targetPond.x, this.targetPond.y);
          if (dist < this.targetPond.radius * 0.8) {
            this.state = aiConfig.STATES.SWIMMING; // Sets mama.state via getter
            this.swimTimer = aiConfig.STATES.SWIMMING.minDuration +
                           Math.random() * (aiConfig.STATES.SWIMMING.maxDuration - aiConfig.STATES.SWIMMING.minDuration);

            // Initialize swim angle based on current position (prevents teleporting)
            this.swimCenterX = this.targetPond.x;
            this.swimCenterY = this.targetPond.y;
            this.swimAngle = Math.atan2(this.mama.y - this.swimCenterY, this.mama.x - this.swimCenterX);
            this.swimRadiusPhase = 0;

            this.lastPond = this.targetPond;

            // Mark pond as visited
            if (!this.visitedPonds.includes(this.targetPond)) {
              this.visitedPonds.push(this.targetPond);
            }
          }

        } else if (this.state === aiConfig.STATES.SWIMMING) {
          // Swimming behavior: slow circular pattern with variable radius
          this.swimTimer--;

          // Calculate variable swim radius (oscillates between baseRadius ± variation)
          const baseRadius = this.targetPond.radius * aiConfig.STATES.SWIMMING.baseSwimRadius;
          const radiusVariation = this.targetPond.radius * aiConfig.STATES.SWIMMING.radiusVariation;
          const swimRadius = baseRadius + Math.sin(this.swimRadiusPhase) * radiusVariation;

          // Calculate angular velocity from desired linear speed (v = r * ω, so ω = v / r)
          // This keeps swimming speed constant regardless of pond size
          const angularVelocity = aiConfig.STATES.SWIMMING.swimSpeed / swimRadius;

          // Increment angle for circular swimming (slower in large ponds, faster in small ponds)
          this.swimAngle += angularVelocity;

          // Oscillate radius phase for variable distance from center
          this.swimRadiusPhase += aiConfig.STATES.SWIMMING.radiusChangeRate;

          // Calculate position on variable-radius circle
          this.mama.x = this.swimCenterX + Math.cos(this.swimAngle) * swimRadius;
          this.mama.y = this.swimCenterY + Math.sin(this.swimAngle) * swimRadius;

          // Calculate velocity for path following (needed for ducklings to follow smoothly)
          const nextRadiusPhase = this.swimRadiusPhase + aiConfig.STATES.SWIMMING.radiusChangeRate;
          const nextRadius = baseRadius + Math.sin(nextRadiusPhase) * radiusVariation;
          const nextAngularVelocity = aiConfig.STATES.SWIMMING.swimSpeed / nextRadius;
          const nextAngle = this.swimAngle + nextAngularVelocity;
          const nextX = this.swimCenterX + Math.cos(nextAngle) * nextRadius;
          const nextY = this.swimCenterY + Math.sin(nextAngle) * nextRadius;
          this.mama.vx = nextX - this.mama.x;
          this.mama.vy = nextY - this.mama.y;

          // Update ripples
          this.rippleTimer++;

          if (this.swimTimer <= 0) {
            // Exit pond after timer expires
            this.state = aiConfig.STATES.EXIT_POND; // Sets mama.state via getter

            // Always find a different pond to visit next (don't return to same pond immediately)
            this.targetPond = this.findNearestPond(game, this.lastPond);

            // Angle toward pond edge (outward from center)
            this.mama.angle = Math.atan2(this.mama.y - this.swimCenterY, this.mama.x - this.swimCenterX);
          }

        } else if (this.state === aiConfig.STATES.EXIT_POND) {
          // Exit pond behavior: waddle away from water
          this.mama.vx = Math.cos(this.mama.angle) * mamaType.waddleSpeed;
          this.mama.vy = Math.sin(this.mama.angle) * mamaType.waddleSpeed;

          // Check if exited pond
          if (this.lastPond) {
            const dist = distance(this.mama.x, this.mama.y, this.lastPond.x, this.lastPond.y);
            if (dist > this.lastPond.radius + 30) {
              // Fully exited, head to next pond (or wander if no other pond available)
              if (this.targetPond && this.targetPond !== this.lastPond) {
                this.state = aiConfig.STATES.SEEK_POND; // Sets mama.state via getter
              } else {
                // No other pond available, wander instead
                this.state = aiConfig.STATES.WANDER; // Sets mama.state via getter
                this.wanderTimer = aiConfig.STATES.WANDER.directionChangeFrequency * 3;
              }
            }
          }
        }

        // Apply movement to mama (wall bouncing)
        this.mama.x += this.mama.vx;
        this.mama.y += this.mama.vy;

        // Boundary checking with margin
        const margin = aiConfig.AVOIDANCE.wallMargin;
        if (this.mama.x < margin) {
          this.mama.x = margin;
          this.mama.angle = Math.PI - this.mama.angle;
        }
        if (this.mama.x > game.mapWidth - margin) {
          this.mama.x = game.mapWidth - margin;
          this.mama.angle = Math.PI - this.mama.angle;
        }
        if (this.mama.y < margin) {
          this.mama.y = margin;
          this.mama.angle = -this.mama.angle;
        }
        if (this.mama.y > game.mapHeight - margin) {
          this.mama.y = game.mapHeight - margin;
          this.mama.angle = -this.mama.angle;
        }

        // Update facing direction
        if (Math.abs(this.mama.vx) > 0.1) {
          this.mama.facingLeft = this.mama.vx < 0;
        }

        // Update ducklings (each follows the one in front in a chain)
        this.updateDucklings();
      };

      // Helper: Find nearest unoccupied pond (excluding specific pond)
      family.findNearestPond = function(game, excludePond) {
        // Check if all ponds have been visited
        if (this.visitedPonds.length >= game.ponds.length && game.ponds.length > 0) {
          // Reset visited list - start exploring again!
          this.visitedPonds = [];
        }

        let nearestPond = null;
        let minDist = Infinity;

        // Helper to check if pond is occupied
        const isPondOccupied = (pond) => {
          return game.duckFamilies.some(otherFamily =>
            otherFamily !== this &&
            otherFamily.targetPond === pond &&
            (otherFamily.state === aiConfig.STATES.SWIMMING || otherFamily.state === aiConfig.STATES.SEEK_POND)
          );
        };

        // First pass: try to find nearest unvisited, unoccupied pond
        for (const pond of game.ponds) {
          if (pond === excludePond) continue;
          if (this.visitedPonds.includes(pond)) continue; // Skip visited ponds
          if (isPondOccupied(pond)) continue; // Skip occupied ponds

          const dist = distance(this.mama.x, this.mama.y, pond.x, pond.y);
          if (dist < minDist && dist > aiConfig.POND_CHOICE.minimumPondDistance) {
            minDist = dist;
            nearestPond = pond;
          }
        }

        // Second pass: if no unvisited ponds found, find any unoccupied pond
        if (!nearestPond) {
          minDist = Infinity;
          for (const pond of game.ponds) {
            if (pond === excludePond) continue;
            if (isPondOccupied(pond)) continue; // Skip occupied ponds

            const dist = distance(this.mama.x, this.mama.y, pond.x, pond.y);
            if (dist < minDist && dist > aiConfig.POND_CHOICE.minimumPondDistance) {
              minDist = dist;
              nearestPond = pond;
            }
          }
        }

        return nearestPond || excludePond; // Fall back to same pond if no others found
      };

      // Helper: Update duckling positions - each follows its predecessor in a chain
      family.updateDucklings = function() {
        const followDistance = aiConfig.DUCKLING.followDistance;

        for (let i = 0; i < this.ducklings.length; i++) {
          const duckling = this.ducklings[i];

          // Determine who this duckling should follow
          let leader;
          if (i === 0) {
            // First duckling follows mama
            leader = this.mama;
          } else {
            // Other ducklings follow the duckling in front of them
            leader = this.ducklings[i - 1];
          }

          // Calculate direction from duckling to leader
          const dx = leader.x - duckling.x;
          const dy = leader.y - duckling.y;
          const distToLeader = Math.sqrt(dx * dx + dy * dy);

          // Target position: followDistance behind the leader
          let targetX, targetY;

          if (distToLeader > 0.1) {
            // Position at followDistance behind leader (in direction of leader)
            const dirX = dx / distToLeader;
            const dirY = dy / distToLeader;

            // If too far, move closer; if too close, maintain distance
            const desiredDist = followDistance;
            targetX = leader.x - dirX * desiredDist;
            targetY = leader.y - dirY * desiredDist;
          } else {
            // Leader is at same position, stay put
            targetX = duckling.x;
            targetY = duckling.y;
          }

          // Add subtle bobbing for cute effect
          const bobX = Math.sin(duckling.animationFrame * aiConfig.DUCKLING.bobFrequency) * 2;
          const bobY = Math.cos(duckling.animationFrame * aiConfig.DUCKLING.bobFrequency + i) * 2;

          // Smooth follow (linear interpolation toward target)
          duckling.x += (targetX + bobX - duckling.x) * 0.15;
          duckling.y += (targetY + bobY - duckling.y) * 0.15;

          duckling.animationFrame++;
        }
      };

      return family;
    };

    /**
     * Create a territory for a regular territorial dinosaur
     *
     * @param {Object} dino - Dinosaur object being assigned the territory
     * @param {Object} spawnPos - Position {x, y} where dinosaur spawned
     * @param {Object} game - Game state object
     * @returns {Object} Territory object with draw() instance method
     *
     * @remarks
     * Territory placement uses collision avoidance to prevent clustering:
     *
     * Spacing requirements:
     * - TERRITORY_SPACING_MULTIPLIER (2x radius) prevents overlap
     * - TERRITORY_OBSTACLE_CLEARANCE prevents territories inside obstacles
     * - Dinosaur can still patrol and defend overlapping areas
     *
     * Why fallback position is acceptable:
     * - After max attempts, returns position even if overlapping
     * - Multiple territories can share space (not game-breaking)
     * - Dinosaurs navigate around obstacles naturally in AI
     * - Prevents infinite loops during dense map generation
     * - Territory visualization may overlap but AI behavior still works
     *
     * Territory ownership tracking:
     * - dinoIndex stores position in game.dinosaurs array
     * - Used to remove territory when dinosaur dies
     * - Must be updated when dinosaurs are removed (see updateBullets)
     */
    const createTerritoryForDino = (dino, spawnPos, game) => {
      const dinoType = dino.type;
      const newTerritoryRadius = GAME_CONSTANTS.AI.TERRITORY.RADIUS;

      let isFirstAttempt = true;

      // Position generator: first attempt uses spawn position, then random positions
      const generatePosition = () => {
        if (isFirstAttempt) {
          isFirstAttempt = false;
          return { x: spawnPos.x, y: spawnPos.y };
        }
        return {
          x: GAME_CONSTANTS.WORLD.SPAWN.DINOSAURS.GRID_START_X + Math.random() * (game.mapWidth - GAME_CONSTANTS.WORLD.SPAWN.DINOSAURS.GRID_START_X * 2),
          y: GAME_CONSTANTS.WORLD.SPAWN.DINOSAURS.GRID_START_Y + Math.random() * (game.mapHeight - GAME_CONSTANTS.WORLD.SPAWN.DINOSAURS.GRID_START_Y * 2)
        };
      };

      // Validator: territory-to-territory spacing + obstacle clearance
      const isValid = (x, y) => {
        // Check against existing territories (prevent clustering)
        // Uses radius-based spacing to handle variable territory sizes (regular vs exit)
        if (!checkRadiusBasedSpacing(x, y, newTerritoryRadius, game.territories, GAME_CONSTANTS.AI.TERRITORY.SPACING_MULTIPLIER)) {
          return false;
        }

        // Check obstacle clearance
        for (const obstacle of game.obstacles) {
          const dist = distance(x, y, obstacle.x, obstacle.y);
          if (dist < obstacle.radius + dinoType.baseSize + GAME_CONSTANTS.AI.TERRITORY.OBSTACLE_CLEARANCE) {
            return false;
          }
        }

        return true;
      };

      // Retry with max attempts, use fallback (accepts last position if all attempts fail)
      const pos = retryUntilValid(
        generatePosition,
        isValid,
        GAME_CONSTANTS.AI.TERRITORY.SPAWN_MAX_ATTEMPTS,
        true
      );

      // Create territory (even if overlapping after max attempts)
      const territory = {
        x: pos.x,
        y: pos.y,
        radius: GAME_CONSTANTS.AI.TERRITORY.RADIUS,
        dinoIndex: game.dinosaurs.length // Track owning dinosaur by array index
      };

      territory.draw = function(ctx, cameraX, cameraY) {
        drawTerritory(ctx, this, cameraX, cameraY);
      };

      return territory;
    };

    const createExitTerritory = (exitX, exitY, totalGuards) => {
      const territory = {
        x: exitX,
        y: exitY,
        radius: GAME_CONSTANTS.AI.EXIT.TERRITORY_RADIUS,
        isExitTerritory: true,
        guardCount: totalGuards
      };

      territory.draw = function(ctx, cameraX, cameraY) {
        drawTerritory(ctx, this, cameraX, cameraY);
      };

      return territory;
    };

    /**
     * Create an exit guard dinosaur
     * @param {Object} dinoType - Dinosaur config object from GAME_CONSTANTS.ENTITIES.DINOSAURS (e.g., DINOSAURS.VELOCIRAPTOR)
     * @param {number} angle - Angle in degrees for positioning around exit
     * @param {number} exitX - Exit X position
     * @param {number} exitY - Exit Y position
     * @param {number} territoryIndex - Index of exit territory in territories array
     * @param {string} difficulty - Current difficulty setting
     */
    const createExitGuard = (dinoType, angle, exitX, exitY, territoryIndex, difficulty) => {
      // Convert angle to radians
      const angleRad = (angle * Math.PI) / 180;

      // Position guard in circle around exit
      const spawnRadius = GAME_CONSTANTS.AI.EXIT.TERRITORY_RADIUS * GAME_CONSTANTS.AI.EXIT.GUARD_SPAWN_RADIUS_MULTIPLIER;
      const x = exitX + Math.cos(angleRad) * spawnRadius;
      const y = exitY + Math.sin(angleRad) * spawnRadius;

      // Apply difficulty modifiers
      const diffMod = DIFFICULTY_MODIFIERS[difficulty];
      const adjustedSpeed = dinoType.speed * diffMod.enemySpeedMultiplier;

      // Mix in navigation/avoidance behavior
      const guard = {
        ...createNavigatingEntity(x, y, dinoType.baseSize, GAME_CONSTANTS.AI.HAZARD_AVOIDANCE),
        type: dinoType,
        health: dinoType.health,
        maxHealth: dinoType.health,
        speed: adjustedSpeed,
        baseSpeed: adjustedSpeed, // Store base speed for AI calculations
        size: dinoType.baseSize,
        color: dinoType.color,
        points: dinoType.points,
        aggressive: true, // Exit guards are always aggressive
        territorial: true, // Exit guards are always territorial
        territoryX: exitX,
        territoryY: exitY,
        territoryRadius: GAME_CONSTANTS.AI.EXIT.TERRITORY_RADIUS, // Territory radius for AI
        territoryIndex,
        aggroRange: GAME_CONSTANTS.AI.EXIT.GUARD_AGGRO_RANGE, // Aggro range for territorial behavior
        state: GAME_CONSTANTS.AI.STATES.PATROL,
        motionAngle: Math.random() * Math.PI * 2,
        fleeDurationTimer: 0, // Frames remaining before recalculating flee direction
        isSleeping: false,
        sleepTimer: 0,
        tranqHits: 0,
        spitCooldown: 0, // Cooldown for spit attacks
        facingLeft: false,
        zapTimer: 0,
        avoidFences: [],
        // Animation properties
        animationFrame: 0, // Counter incremented each frame when moving
        legCycle: 0 // Sine wave value for leg positions (-1 to 1)
      };

      // Override to specify what dinosaurs avoid (only tar pits and ponds)
      guard.getHazardsToCheck = function(game) {
        return [...game.tarPits, ...game.ponds];
      };

      guard.draw = function(ctx) {
        const scale = this.size / this.type.baseSize;
        this.type.drawFunction(ctx, scale, this);
      };

      return guard;
    };

    /**
     * Find nearest dinosaur to a position
     */
    const findNearestDinosaur = (x, y, dinosaurs) => {
      let nearest = null;
      let nearestDist = Infinity;

      dinosaurs.forEach(dino => {
        const dist = distance(x, y, dino.x, dino.y);
        if (dist < nearestDist) {
          nearestDist = dist;
          nearest = dino;
        }
      });

      return nearest;
    };

    /**
     * Draw Tyrannosaurus Rex - massive head, tiny arms, powerful build
     * @param {CanvasRenderingContext2D} ctx - Canvas context
     * @param {number} scale - Scale factor for drawing
     * @param {Object} dino - Dinosaur object
     */
    const drawTyrannosaurusRex = (ctx, scale, dino) => {
      // Animation: leg swing for massive bipedal predator
      const legSwing = 3 * dino.legCycle; // ±3 pixels (subtle but powerful)
      const armSwing = 0.5 * dino.legCycle; // Tiny arms barely move

      // Tail (thick and powerful)
      ctx.fillStyle = '#2E7D32';
      ctx.beginPath();
      ctx.moveTo(-20 * scale, 0);
      ctx.quadraticCurveTo(-40 * scale, 5 * scale, -50 * scale, 0);
      ctx.lineTo(-48 * scale, 3 * scale);
      ctx.quadraticCurveTo(-38 * scale, 8 * scale, -20 * scale, 5 * scale);
      ctx.fill();

      // Massive leg - animated
      ctx.fillStyle = '#1B5E20';
      ctx.beginPath();
      ctx.ellipse(-10 * scale, (12 + legSwing) * scale, 10 * scale, 15 * scale, 0, 0, Math.PI * 2);
      ctx.fill();

      // Lower leg - animated
      ctx.fillStyle = '#2E7D32';
      ctx.fillRect(-13 * scale, (22 + legSwing) * scale, 6 * scale, 12 * scale);

      // Large foot - animated
      ctx.fillStyle = '#1B5E20';
      ctx.beginPath();
      ctx.ellipse(-10 * scale, (34 + legSwing) * scale, 8 * scale, 4 * scale, 0, 0, Math.PI * 2);
      ctx.fill();

      // Three-toed claws - animated
      ctx.fillStyle = '#000';
      for (let i = -1; i <= 1; i++) {
        ctx.beginPath();
        ctx.moveTo(-10 * scale + i * 4 * scale, (34 + legSwing) * scale);
        ctx.lineTo(-10 * scale + i * 5 * scale, (38 + legSwing) * scale);
        ctx.lineTo(-10 * scale + i * 3 * scale, (36 + legSwing) * scale);
        ctx.fill();
      }

      // Body (massive and robust)
      ctx.fillStyle = '#388E3C';
      ctx.beginPath();
      ctx.ellipse(0, 0, 25 * scale, 18 * scale, -Math.PI * 0.15, 0, Math.PI * 2);
      ctx.fill();

      // Chest (lighter belly)
      ctx.fillStyle = '#81C784';
      ctx.beginPath();
      ctx.ellipse(5 * scale, 5 * scale, 15 * scale, 12 * scale, -Math.PI * 0.15, 0, Math.PI * 2);
      ctx.fill();

      // Neck (thick)
      ctx.fillStyle = '#388E3C';
      ctx.beginPath();
      ctx.ellipse(18 * scale, -8 * scale, 10 * scale, 8 * scale, Math.PI * 0.4, 0, Math.PI * 2);
      ctx.fill();

      // MASSIVE head
      ctx.fillStyle = '#2E7D32';
      ctx.beginPath();
      ctx.ellipse(32 * scale, -12 * scale, 18 * scale, 12 * scale, 0, 0, Math.PI * 2);
      ctx.fill();

      // Lower jaw
      ctx.fillStyle = '#1B5E20';
      ctx.beginPath();
      ctx.ellipse(35 * scale, -5 * scale, 15 * scale, 6 * scale, 0, 0, Math.PI * 2);
      ctx.fill();

      // Eye (small and menacing)
      ctx.fillStyle = '#FFF';
      ctx.beginPath();
      ctx.arc(28 * scale, -16 * scale, 4 * scale, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = '#8B0000';
      ctx.beginPath();
      ctx.arc(29 * scale, -16 * scale, 2 * scale, 0, Math.PI * 2);
      ctx.fill();

      // Nostril
      ctx.fillStyle = '#000';
      ctx.beginPath();
      ctx.ellipse(42 * scale, -10 * scale, 2 * scale, 1.5 * scale, 0, 0, Math.PI * 2);
      ctx.fill();

      // Large teeth
      ctx.fillStyle = '#FFF';
      for (let i = 0; i < 8; i++) {
        ctx.beginPath();
        ctx.moveTo(25 * scale + i * 3.5 * scale, -8 * scale);
        ctx.lineTo(26 * scale + i * 3.5 * scale, -15 * scale);
        ctx.lineTo(27 * scale + i * 3.5 * scale, -8 * scale);
        ctx.fill();

        // Bottom teeth
        ctx.beginPath();
        ctx.moveTo(25 * scale + i * 3.5 * scale, -2 * scale);
        ctx.lineTo(26 * scale + i * 3.5 * scale, 2 * scale);
        ctx.lineTo(27 * scale + i * 3.5 * scale, -2 * scale);
        ctx.fill();
      }

      // Comically tiny arms - animated (barely noticeable)
      ctx.fillStyle = '#388E3C';
      ctx.beginPath();
      ctx.ellipse(12 * scale, (6 + armSwing) * scale, 3 * scale, 6 * scale, Math.PI * 0.3, 0, Math.PI * 2);
      ctx.fill();

      // Tiny claws
      ctx.strokeStyle = '#1B5E20';
      ctx.lineWidth = 1 * scale;
      ctx.beginPath();
      ctx.moveTo(13 * scale, 11 * scale);
      ctx.lineTo(14 * scale, 13 * scale);
      ctx.stroke();
    };

    /**
     * Draw Velociraptor - lean, aggressive predator stance
     * @param {CanvasRenderingContext2D} ctx - Canvas context
     * @param {number} scale - Scale factor for drawing
     * @param {Object} dino - Dinosaur object
     */
    const drawVelociraptor = (ctx, scale, dino) => {
      // Animation: leg swing for bipedal raptor
      const legSwing = 3 * dino.legCycle; // ±3 pixels (subtle)
      const armSwing = 1 * dino.legCycle; // Very subtle arm movement

      // Tail (long and curved upward)
      ctx.fillStyle = '#CD7F32';
      ctx.beginPath();
      ctx.moveTo(-15 * scale, 2 * scale);
      ctx.quadraticCurveTo(-30 * scale, -5 * scale, -40 * scale, -10 * scale);
      ctx.lineTo(-38 * scale, -7 * scale);
      ctx.quadraticCurveTo(-28 * scale, -3 * scale, -15 * scale, 4 * scale);
      ctx.fill();

      // Back leg (powerful haunches) - animated
      ctx.fillStyle = '#B8860B';
      ctx.beginPath();
      ctx.ellipse(-8 * scale, (8 + legSwing) * scale, 6 * scale, 10 * scale, Math.PI * 0.2, 0, Math.PI * 2);
      ctx.fill();

      // Lower leg - animated
      ctx.fillStyle = '#CD7F32';
      ctx.fillRect(-10 * scale, (15 + legSwing) * scale, 3 * scale, 8 * scale);

      // Clawed foot - animated
      ctx.fillStyle = '#8B4513';
      ctx.beginPath();
      ctx.moveTo(-12 * scale, (23 + legSwing) * scale);
      ctx.lineTo(-10 * scale, (20 + legSwing) * scale);
      ctx.lineTo(-8 * scale, (23 + legSwing) * scale);
      ctx.lineTo(-10 * scale, (24 + legSwing) * scale);
      ctx.fill();

      // Body (lean and muscular)
      ctx.fillStyle = '#DAA520';
      ctx.beginPath();
      ctx.ellipse(0, 0, 18 * scale, 10 * scale, -Math.PI * 0.1, 0, Math.PI * 2);
      ctx.fill();

      // Neck
      ctx.fillStyle = '#DAA520';
      ctx.beginPath();
      ctx.ellipse(12 * scale, -5 * scale, 6 * scale, 5 * scale, Math.PI * 0.3, 0, Math.PI * 2);
      ctx.fill();

      // Head (elongated snout)
      ctx.fillStyle = '#CD7F32';
      ctx.beginPath();
      ctx.ellipse(20 * scale, -8 * scale, 10 * scale, 6 * scale, 0, 0, Math.PI * 2);

      // Snout detail
      ctx.fillStyle = '#8B4513';
      ctx.beginPath();
      ctx.ellipse(26 * scale, -8 * scale, 4 * scale, 3 * scale, 0, 0, Math.PI * 2);
      ctx.fill();

      // Eye (predatory)
      ctx.fillStyle = '#FFD700';
      ctx.beginPath();
      ctx.ellipse(18 * scale, -10 * scale, 3 * scale, 4 * scale, 0, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = '#000';
      ctx.beginPath();
      ctx.ellipse(19 * scale, -10 * scale, 1.5 * scale, 2 * scale, 0, 0, Math.PI * 2);
      ctx.fill();

      // Teeth
      ctx.strokeStyle = '#FFF';
      ctx.lineWidth = 1.5 * scale;
      for (let i = 0; i < 5; i++) {
        ctx.beginPath();
        ctx.moveTo(20 * scale + i * 2 * scale, -6 * scale);
        ctx.lineTo(20 * scale + i * 2 * scale, -4 * scale);
        ctx.stroke();
      }

      // Small arms - animated (subtle movement)
      ctx.fillStyle = '#CD7F32';
      ctx.beginPath();
      ctx.ellipse(8 * scale, (4 + armSwing) * scale, 3 * scale, 5 * scale, Math.PI * 0.5, 0, Math.PI * 2);
      ctx.fill();

      // Stripes on back
      ctx.strokeStyle = '#8B4513';
      ctx.lineWidth = 2 * scale;
      for (let i = 0; i < 4; i++) {

      }
    };

    /**
     * Draw Stegosaurus - distinctive plates and spiked tail
     * @param {CanvasRenderingContext2D} ctx - Canvas context
     * @param {number} scale - Scale factor for drawing
     * @param {Object} dino - Dinosaur object
     */
    const drawStegosaurus = (ctx, scale, dino) => {
      // Animation: alternating leg pairs for quadrupedal walk (very subtle to avoid detachment)
      const backLegSwing = 1.5 * dino.legCycle; // ±1.5 pixels for back legs
      const frontLegSwing = 1.5 * -dino.legCycle; // ±1.5 pixels for front legs (opposite phase)

      // Tail with spikes
      ctx.fillStyle = '#7B1FA2';
      ctx.beginPath();
      ctx.moveTo(-18 * scale, 2 * scale);
      ctx.quadraticCurveTo(-35 * scale, -2 * scale, -45 * scale, -5 * scale);
      ctx.lineTo(-43 * scale, -2 * scale);
      ctx.quadraticCurveTo(-33 * scale, 1 * scale, -18 * scale, 5 * scale);
      ctx.fill();

      // Tail spikes (thagomizer)
      ctx.fillStyle = '#F06292';
      for (let i = 0; i < 4; i++) {
        ctx.beginPath();
        ctx.moveTo(-35 * scale - i * 5 * scale, -3 * scale);
        ctx.lineTo(-38 * scale - i * 5 * scale, -12 * scale);
        ctx.lineTo(-32 * scale - i * 5 * scale, -5 * scale);
        ctx.closePath();
        ctx.fill();
        ctx.strokeStyle = '#C2185B';
        ctx.lineWidth = 1;
        ctx.stroke();
      }

      // Body (large and rounded) - background
      ctx.fillStyle = '#9C27B0';
      ctx.beginPath();
      ctx.ellipse(0, 0, 28 * scale, 14 * scale, 0, 0, Math.PI * 2);
      ctx.fill();

      // Back legs (sturdy) - animated by stretching/compressing height
      ctx.fillStyle = '#6A1B9A';
      ctx.fillRect(-12 * scale, 10 * scale, 8 * scale, (12 + backLegSwing) * scale);
      ctx.fillRect(-2 * scale, 10 * scale, 8 * scale, (12 - backLegSwing) * scale);

      // Feet - positioned at leg bottoms
      ctx.fillStyle = '#4A148C';
      ctx.fillRect(-13 * scale, (22 + backLegSwing) * scale, 10 * scale, 3 * scale);
      ctx.fillRect(-3 * scale, (22 - backLegSwing) * scale, 10 * scale, 3 * scale);

      // Front legs (shorter) - animated by stretching/compressing height
      ctx.fillStyle = '#6A1B9A';
      ctx.fillRect(8 * scale, 12 * scale, 6 * scale, (10 + frontLegSwing) * scale);
      ctx.fillRect(15 * scale, 12 * scale, 6 * scale, (10 - frontLegSwing) * scale);

      // Front feet - positioned at leg bottoms
      ctx.fillStyle = '#4A148C';
      ctx.fillRect(7 * scale, (22 + frontLegSwing) * scale, 8 * scale, 3 * scale);
      ctx.fillRect(14 * scale, (22 - frontLegSwing) * scale, 8 * scale, 3 * scale);

      // Belly (lighter) - drawn on top to hide leg tops better
      ctx.fillStyle = '#BA68C8';
      ctx.beginPath();
      ctx.ellipse(0, 6 * scale, 22 * scale, 10 * scale, 0, 0, Math.PI * 2);
      ctx.fill();

      // Distinctive back plates (alternating heights)
      for (let i = 0; i < 7; i++) {
        const isHigh = i % 2 === 0;
        const height = isHigh ? 22 : 16;
        const xPos = -15 * scale + i * 6 * scale;

        ctx.fillStyle = '#E91E63';
        ctx.beginPath();
        ctx.moveTo(xPos - 3 * scale, -8 * scale);
        ctx.lineTo(xPos, -height * scale);
        ctx.lineTo(xPos + 3 * scale, -8 * scale);
        ctx.closePath();
        ctx.fill();

        // Plate outline and details
        ctx.strokeStyle = '#C2185B';
        ctx.lineWidth = 1.5;
        ctx.stroke();

        // Inner detail
        ctx.strokeStyle = '#F48FB1';
        ctx.lineWidth = 0.8;
        ctx.beginPath();
        ctx.moveTo(xPos - 1.5 * scale, -8 * scale);
        ctx.lineTo(xPos, -(height - 2) * scale);
        ctx.lineTo(xPos + 1.5 * scale, -8 * scale);
        ctx.stroke();
      }

      // Neck
      ctx.fillStyle = '#9C27B0';
      ctx.beginPath();
      ctx.ellipse(20 * scale, -2 * scale, 8 * scale, 6 * scale, -Math.PI * 0.3, 0, Math.PI * 2);
      ctx.fill();

      // Head (small and low)
      ctx.fillStyle = '#7B1FA2';
      ctx.beginPath();
      ctx.ellipse(30 * scale, 0, 8 * scale, 6 * scale, 0, 0, Math.PI * 2);
      ctx.fill();

      // Eye (gentle herbivore)
      ctx.fillStyle = '#FFF';
      ctx.beginPath();
      ctx.arc(32 * scale, -2 * scale, 3 * scale, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = '#000';
      ctx.beginPath();
      ctx.arc(33 * scale, -2 * scale, 1.5 * scale, 0, Math.PI * 2);
      ctx.fill();

      // Nostril
      ctx.fillStyle = '#4A148C';
      ctx.beginPath();
      ctx.arc(36 * scale, 1 * scale, 1.5 * scale, 0, Math.PI * 2);
      ctx.fill();

      // Beak-like mouth
      ctx.strokeStyle = '#4A148C';
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.arc(34 * scale, 3 * scale, 3 * scale, 0, Math.PI);
      ctx.stroke();
    };

    /**

    /**

      // Frill (distinctive bony collar)

    /**
     * Draw Dilophosaurus - spitting territorial predator with expandable neck frill
     * @param {CanvasRenderingContext2D} ctx - Canvas context
     * @param {number} scale - Scale factor for drawing
     * @param {Object} dino - Dinosaur object (aiState accessed from dino.state)
     */
    const drawDilophosaurus = (ctx, scale, dino) => {
      const aiState = dino.state;

      // Animation: bipedal walk with alternating legs
      const legSwing = 3 * dino.legCycle; // ±3 pixels for legs (subtle)
      const armSwing = 1 * dino.legCycle; // Very subtle arm movement

      // Tail
      ctx.fillStyle = '#7FFF00';
      ctx.beginPath();
      ctx.moveTo(-10 * scale, 0);
      ctx.quadraticCurveTo(-22 * scale, -2 * scale, -30 * scale, -5 * scale);
      ctx.lineTo(-28 * scale, -3 * scale);
      ctx.quadraticCurveTo(-20 * scale, 0, -10 * scale, 2 * scale);
      ctx.fill();

      // Hind legs - animated by stretching/compressing height
      ctx.fillStyle = '#9ACD32';
      ctx.fillRect(-8 * scale, 6 * scale, 4 * scale, (10 + legSwing) * scale);
      ctx.fillRect(-2 * scale, 6 * scale, 4 * scale, (10 - legSwing) * scale);

      // Front legs (shorter) - animated by stretching/compressing height
      ctx.fillRect(6 * scale, 8 * scale, 3 * scale, (8 + armSwing) * scale);
      ctx.fillRect(11 * scale, 8 * scale, 3 * scale, (8 - armSwing) * scale);

      // Body (lean predator) - drawn on top to hide leg tops
      ctx.fillStyle = '#ADFF2F';
      ctx.beginPath();
      ctx.ellipse(0, 0, 18 * scale, 10 * scale, 0, 0, Math.PI * 2);
      ctx.fill();

      // Black spots/stripes
      ctx.fillStyle = '#000';
      ctx.beginPath();
      ctx.arc(-5 * scale, -3 * scale, 2 * scale, 0, Math.PI * 2);
      ctx.arc(2 * scale, -4 * scale, 2 * scale, 0, Math.PI * 2);
      ctx.arc(-8 * scale, 2 * scale, 2 * scale, 0, Math.PI * 2);
      ctx.fill();

      // Neck
      ctx.fillStyle = '#ADFF2F';
      ctx.beginPath();
      ctx.ellipse(12 * scale, -6 * scale, 6 * scale, 5 * scale, -Math.PI * 0.3, 0, Math.PI * 2);
      ctx.fill();

      // Head
      ctx.fillStyle = '#9ACD32';
      ctx.beginPath();
      ctx.ellipse(20 * scale, -10 * scale, 7 * scale, 5 * scale, 0, 0, Math.PI * 2);
      ctx.fill();

      // Distinctive neck frill (colorful, expanded when aggressive)
      const frillExpanded = aiState === GAME_CONSTANTS.AI.STATES.CHASE;
      const frillSize = frillExpanded ? 10 : 7;
      ctx.fillStyle = frillExpanded ? '#FF6347' : '#FFA07A';
      ctx.beginPath();
      ctx.arc(14 * scale, -8 * scale, frillSize * scale, Math.PI * 0.7, Math.PI * 1.3);
      ctx.fill();

      // Frill outline
      ctx.strokeStyle = '#FF4500';
      ctx.lineWidth = 1;
      ctx.beginPath();
      ctx.arc(14 * scale, -8 * scale, frillSize * scale, Math.PI * 0.7, Math.PI * 1.3);

      ctx.fillStyle = '#7FFF00';
      ctx.beginPath();
      ctx.ellipse(26 * scale, -10 * scale, 4 * scale, 3 * scale, 0, 0, Math.PI * 2);

      ctx.fillStyle = '#FFF';
      ctx.beginPath();
      ctx.arc(21 * scale, -11 * scale, 2 * scale, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = '#FF0000';
      ctx.beginPath();
      ctx.arc(21.5 * scale, -11 * scale, 1 * scale, 0, Math.PI * 2);
      ctx.fill();

      // Teeth
      ctx.fillStyle = '#FFF';
      for (let i = 0; i < 4; i++) {
        ctx.fillRect((24 + i * 1.5) * scale, -9 * scale, 0.8 * scale, 2 * scale);
      }

    /**
     * Draw electric zap effect on an entity
     * @param {CanvasRenderingContext2D} ctx - Canvas context
     * @param {number} screenX - Screen X position
     * @param {number} screenY - Screen Y position
     * @param {number} size - Entity size/radius
     * @param {number} zapTimer - Current zap timer value
     */
    const drawZapEffect = (ctx, screenX, screenY, size, zapTimer) => {
      if (zapTimer <= 0) return;

      const zap = GAME_CONSTANTS.ENTITIES.HAZARDS.ELECTRIC_FENCE.zap;
      const zapAlpha = zapTimer / zap.duration;

      // Electric aura
      ctx.fillStyle = `rgba(255, 255, 0, ${zapAlpha * zap.auraAlpha})`;
      ctx.beginPath();
      ctx.arc(screenX, screenY, size + zap.auraRadius, 0, Math.PI * 2);
      ctx.fill();

      // Lightning bolts around the entity
      ctx.strokeStyle = `rgba(255, 255, 100, ${zapAlpha})`;
      ctx.lineWidth = zap.boltWidth;
      for (let i = 0; i < zap.boltCount; i++) {
        const angle = (Date.now() / zap.boltRotationSpeed + i * Math.PI / 2) % (Math.PI * 2);
        const startX = screenX + Math.cos(angle) * size;
        const startY = screenY + Math.sin(angle) * size;
        const endX = screenX + Math.cos(angle) * (size + zap.boltLength);
        const endY = screenY + Math.sin(angle) * (size + zap.boltLength);

        ctx.beginPath();
        ctx.moveTo(startX, startY);
        ctx.lineTo(endX, endY);
        ctx.stroke();
      }
    };

    /**
     * Draw tar pit with bubble animation
     * @param {CanvasRenderingContext2D} ctx - Canvas context
     * @param {number} cameraX - Camera X offset
     * @param {number} cameraY - Camera Y offset
     * @param {Object} tarPit - Tar pit object
     */
    const drawTarPit = (ctx, cameraX, cameraY, tarPit) => {
      const screenX = tarPit.x - cameraX;
      const screenY = tarPit.y - cameraY;
      const type = tarPit.hazardType;

      // Dark tar pit
      ctx.fillStyle = type.colors.base;
      ctx.beginPath();
      ctx.arc(screenX, screenY, tarPit.radius, 0, Math.PI * 2);
      ctx.fill();

      // Lighter brown rim
      ctx.strokeStyle = type.colors.rim;
      ctx.lineWidth = type.rimWidth;
      ctx.stroke();

      // Update and draw multiple bubbles
      tarPit.bubbles.forEach(bubble => {
        bubble.timer++;
        if (bubble.timer >= type.bubble.frequency) {
          bubble.timer = 0;
          // Randomize position for next cycle
          Object.assign(bubble, randomizeBubbleOffset());
        }

        // Draw bubble during active phase
        if (bubble.timer < type.bubble.duration) {
          const bubbleProgress = bubble.timer / type.bubble.duration;
          const bubbleRadius = type.bubble.baseRadius + bubbleProgress * type.bubble.growth;
          const bubbleAlpha = 1 - bubbleProgress;

          // Draw main bubble body
          ctx.fillStyle = `rgba(61, 40, 23, ${bubbleAlpha})`;
          ctx.beginPath();
          ctx.arc(screenX + bubble.offsetX, screenY + bubble.offsetY, bubbleRadius, 0, Math.PI * 2);
          ctx.fill();

          // Draw highlight for 3D effect (shine on top-left)
          const highlightAlpha = bubbleAlpha * 0.5; // Softer highlight
          ctx.fillStyle = `rgba(100, 70, 50, ${highlightAlpha})`;
          ctx.beginPath();
          ctx.arc(
            screenX + bubble.offsetX - bubbleRadius * 0.3,
            screenY + bubble.offsetY - bubbleRadius * 0.3,
            bubbleRadius * 0.4,
            0,
            Math.PI * 2
          );
          ctx.fill();
        }
      });
    };

    /**
     * Draw pond with ripples and vegetation
     * @param {CanvasRenderingContext2D} ctx - Canvas context
     * @param {number} cameraX - Camera X offset
     * @param {number} cameraY - Camera Y offset
     * @param {Object} pond - Pond object
     */
    const drawPond = (ctx, cameraX, cameraY, pond) => {
      const screenX = pond.x - cameraX;
      const screenY = pond.y - cameraY;
      const type = pond.hazardType;

      // Draw water body with gradient
      const gradient = ctx.createRadialGradient(screenX, screenY, 0, screenX, screenY, pond.radius);
      gradient.addColorStop(0, type.colors.surface);
      gradient.addColorStop(0.7, type.colors.base);
      gradient.addColorStop(1, type.colors.base);
      ctx.fillStyle = gradient;
      ctx.beginPath();
      ctx.arc(screenX, screenY, pond.radius, 0, Math.PI * 2);
      ctx.fill();

      // Update and draw ripples
      pond.ripples.forEach(ripple => {
        ripple.timer++;
        if (ripple.timer >= type.ripple.frequency) {
          ripple.timer = 0;
          // Randomize origin for next ripple
          ripple.offsetX = randomCentered(type.ripple.spread);
          ripple.offsetY = randomCentered(type.ripple.spread);
        }

        // Draw ripple during active phase
        if (ripple.timer < type.ripple.duration) {
          const rippleProgress = ripple.timer / type.ripple.duration;
          const rippleRadius = rippleProgress * type.ripple.maxRadius;
          const rippleAlpha = (1 - rippleProgress) * 0.4;

          ctx.strokeStyle = `rgba(74, 159, 181, ${rippleAlpha})`; // Highlight color
          ctx.lineWidth = 2;
          ctx.beginPath();
          ctx.arc(screenX + ripple.offsetX, screenY + ripple.offsetY, rippleRadius, 0, Math.PI * 2);
          ctx.stroke();
        }
      });

      // Draw reeds around edges (cattails)
      pond.reeds.forEach(reed => {
        const reedX = screenX + reed.offsetX;
        const reedY = screenY + reed.offsetY;

        // Reed stem
        ctx.strokeStyle = type.vegetation.reedColor;
        ctx.lineWidth = type.vegetation.reedWidth;
        ctx.beginPath();
        ctx.moveTo(reedX, reedY);
        ctx.lineTo(reedX, reedY - type.vegetation.reedHeight);
        ctx.stroke();

        // Cattail top
        ctx.fillStyle = type.vegetation.reedTopColor;
        ctx.beginPath();
        ctx.ellipse(reedX, reedY - type.vegetation.reedHeight, 2, 3, 0, 0, Math.PI * 2);
        ctx.fill();
      });

      // Draw lily pads
      pond.lilyPads.forEach(lily => {
        const lilyX = screenX + lily.offsetX;
        const lilyY = screenY + lily.offsetY;

        // Lily pad body
        ctx.fillStyle = type.vegetation.lilyPadColor;
        ctx.beginPath();
        ctx.arc(lilyX, lilyY, type.vegetation.lilyPadRadius, 0, Math.PI * 2);
        ctx.fill();

        // Lily pad highlight (small crescent for 3D effect)
        ctx.fillStyle = type.vegetation.lilyPadHighlight;
        ctx.beginPath();
        ctx.arc(
          lilyX - type.vegetation.lilyPadRadius * 0.3,
          lilyY - type.vegetation.lilyPadRadius * 0.3,
          type.vegetation.lilyPadRadius * 0.5,
          0,
          Math.PI * 2
        );
        ctx.fill();
      });
    };

    /**
     * Draw electric fence with spark animation
     * @param {CanvasRenderingContext2D} ctx - Canvas context
     * @param {number} cameraX - Camera X offset
     * @param {number} cameraY - Camera Y offset
     * @param {Object} fence - Electric fence object
     */
    const drawElectricFence = (ctx, cameraX, cameraY, fence) => {
      const screenX = fence.x - cameraX;
      const screenY = fence.y - cameraY;
      const type = fence.hazardType;

      ctx.save();
      ctx.translate(screenX, screenY);
      ctx.rotate(fence.rotation);

      // Fence base (dark gray/black)
      ctx.fillStyle = type.colors.base;
      ctx.fillRect(-type.width / 2, -type.height / 2, type.width, type.height);

      // Electric wires (yellow)
      ctx.strokeStyle = type.colors.wire;
      ctx.lineWidth = type.wireWidth;
      ctx.beginPath();
      ctx.moveTo(-type.width / 2, -type.height / 4);
      ctx.lineTo(type.width / 2, -type.height / 4);
      ctx.moveTo(-type.width / 2, type.height / 4);
      ctx.lineTo(type.width / 2, type.height / 4);
      ctx.stroke();

      // Update spark animation
      fence.sparkTimer++;
      if (fence.sparkTimer >= type.spark.frequency) {
        fence.sparkTimer = 0;
      }

      // Draw sparks at intervals
      if (fence.sparkTimer < type.spark.duration) {
        const sparkProgress = fence.sparkTimer / type.spark.duration;
        const sparkAlpha = 1 - sparkProgress;

        ctx.fillStyle = `rgba(255, 255, 100, ${sparkAlpha})`;
        ctx.beginPath();
        ctx.arc(Math.random() * type.width - type.width / 2, 0, type.spark.radius, 0, Math.PI * 2);
        ctx.fill();
      }

      ctx.restore();
    };

    /**
     * Draw mama duck with detailed features
     * @param {CanvasRenderingContext2D} ctx - Canvas context
     * @param {number} size - Duck size
     * @param {boolean} isSwimming - Whether duck is currently swimming
     * @param {number} animationFrame - Animation frame counter for bobbing/waddle
     */
    const drawMamaDuck = (ctx, size, isSwimming, animationFrame) => {
      const colors = GAME_CONSTANTS.ENTITIES.AMBIENT_WILDLIFE.MAMA_DUCK.colors;

      // Subtle animation
      const bobOffset = isSwimming ? Math.sin(animationFrame * 0.1) * 1.5 : 0;

      // Body (oval, brown)
      ctx.fillStyle = colors.body;
      ctx.beginPath();
      ctx.ellipse(0, bobOffset, size * 0.8, size * 0.6, 0, 0, Math.PI * 2);
      ctx.fill();

      // Body highlight (lighter brown on top)
      ctx.fillStyle = colors.bodyHighlight;
      ctx.beginPath();
      ctx.ellipse(0, bobOffset - size * 0.15, size * 0.6, size * 0.4, 0, 0, Math.PI * 2);
      ctx.fill();

      // Wing accent (darker brown)
      ctx.fillStyle = colors.wing;
      ctx.beginPath();
      ctx.ellipse(size * 0.3, bobOffset, size * 0.3, size * 0.4, Math.PI * 0.3, 0, Math.PI * 2);
      ctx.fill();

      // Head (circle, darker brown)
      ctx.fillStyle = colors.head;
      ctx.beginPath();
      ctx.arc(size * 0.7, bobOffset - size * 0.3, size * 0.4, 0, Math.PI * 2);
      ctx.fill();

      // Bill (orange triangle)
      ctx.fillStyle = colors.bill;
      ctx.beginPath();
      ctx.moveTo(size * 0.9, bobOffset - size * 0.3);
      ctx.lineTo(size * 1.3, bobOffset - size * 0.35);
      ctx.lineTo(size * 1.3, bobOffset - size * 0.25);
      ctx.closePath();
      ctx.fill();

      // Bill tip (golden)
      ctx.fillStyle = colors.billTip;
      ctx.beginPath();
      ctx.arc(size * 1.3, bobOffset - size * 0.3, size * 0.08, 0, Math.PI * 2);
      ctx.fill();

      // Eye (black dot)
      ctx.fillStyle = colors.eye;
      ctx.beginPath();
      ctx.arc(size * 0.85, bobOffset - size * 0.35, size * 0.1, 0, Math.PI * 2);
      ctx.fill();

      // Water ripples if swimming
      if (isSwimming) {
        ctx.strokeStyle = 'rgba(42, 122, 143, 0.3)';
        ctx.lineWidth = 1;
        ctx.beginPath();
        ctx.ellipse(0, bobOffset + size * 0.5, size * 1.2, size * 0.4, 0, 0, Math.PI * 2);
        ctx.stroke();
      }
    };

    /**
     * Draw duckling with fluffy yellow appearance
     * @param {CanvasRenderingContext2D} ctx - Canvas context
     * @param {number} size - Duckling size
     * @param {boolean} isSwimming - Whether duckling is currently swimming
     * @param {number} animationFrame - Animation frame counter for bobbing
     */
    const drawDuckling = (ctx, size, isSwimming, animationFrame) => {
      const colors = GAME_CONSTANTS.ENTITIES.AMBIENT_WILDLIFE.DUCKLING.colors;

      // Subtle animation (offset slightly from mama for variety)
      const bobOffset = isSwimming ? Math.sin((animationFrame + 10) * 0.12) * 1 : 0;

      // Body (fluffy yellow circle)
      ctx.fillStyle = colors.body;
      ctx.beginPath();
      ctx.arc(0, bobOffset, size * 0.9, 0, Math.PI * 2);
      ctx.fill();

      // Body highlight (lighter yellow)
      ctx.fillStyle = colors.bodyHighlight;
      ctx.beginPath();
      ctx.arc(-size * 0.1, bobOffset - size * 0.2, size * 0.5, 0, Math.PI * 2);
      ctx.fill();

      // Head (smaller circle merged with body)
      ctx.fillStyle = colors.body;
      ctx.beginPath();
      ctx.arc(size * 0.4, bobOffset - size * 0.4, size * 0.5, 0, Math.PI * 2);
      ctx.fill();

      // Small bill (orange)
      ctx.fillStyle = colors.bill;
      ctx.beginPath();
      ctx.moveTo(size * 0.7, bobOffset - size * 0.4);

      // Eye (tiny black dot)

      // Water ripples if swimming (smaller than mama)
      if (isSwimming) {
        ctx.strokeStyle = 'rgba(42, 122, 143, 0.25)';

        ctx.ellipse(0, bobOffset + size * 0.7, size * 0.8, size * 0.3, 0, 0, Math.PI * 2);

    /**
     * Draw tree with textured trunk and layered foliage
     * @param {CanvasRenderingContext2D} ctx - Canvas context
     * @param {number} screenX - Screen X position
     * @param {number} screenY - Screen Y position
     * @param {number} radius - Tree foliage radius
     * @param {Object} obstacle - Obstacle object (unused for tree, but required for consistent interface)
     */
    const drawTree = (ctx, screenX, screenY, radius, obstacle) => {
      const colors = GAME_CONSTANTS.ENTITIES.OBSTACLES.TREE.colors;

      // Draw ground shadow (ellipse under tree)
      ctx.fillStyle = colors.groundShadow;
      ctx.beginPath();
      ctx.ellipse(screenX, screenY + radius * 0.3, radius * 0.6, radius * 0.25, 0, 0, Math.PI * 2);
      ctx.fill();

      // Draw tree trunk with texture
      const trunkWidth = 12;
      const trunkHeight = radius * 0.8;

      // Trunk shadow (left side)
      ctx.fillStyle = colors.trunkShadow;
      ctx.fillRect(screenX - trunkWidth / 2, screenY - trunkHeight / 2, trunkWidth / 3, trunkHeight);

      // Trunk base color
      ctx.fillStyle = colors.trunkBase;
      ctx.fillRect(screenX - trunkWidth / 2, screenY - trunkHeight / 2, trunkWidth, trunkHeight);

      // Trunk highlight (right side)
      ctx.fillStyle = colors.trunkHighlight;
      ctx.fillRect(screenX + trunkWidth / 6, screenY - trunkHeight / 2, trunkWidth / 4, trunkHeight);

      // Draw layered foliage crown
      const foliageY = screenY - trunkHeight;

      // Back layer (darkest)
      ctx.fillStyle = colors.foliageDark;
      ctx.beginPath();
      ctx.arc(screenX - radius * 0.3, foliageY - radius * 0.2, radius * 0.85, 0, Math.PI * 2);
      ctx.fill();

      // Middle layer (base green)
      ctx.fillStyle = colors.foliageBase;
      ctx.beginPath();
      ctx.arc(screenX, foliageY, radius, 0, Math.PI * 2);
      ctx.fill();

      // Front layer (lighter green)
      ctx.fillStyle = colors.foliageLight;
      ctx.beginPath();
      ctx.arc(screenX + radius * 0.3, foliageY + radius * 0.1, radius * 0.8, 0, Math.PI * 2);
      ctx.fill();

      // Highlights (brightest spots)
      ctx.fillStyle = colors.foliageHighlight;
      ctx.beginPath();
      ctx.arc(screenX + radius * 0.4, foliageY - radius * 0.3, radius * 0.35, 0, Math.PI * 2);
      ctx.fill();
    };

    /**
     * Draw tall tree (cannot be jumped over)
     * Taller trunk and fuller foliage than regular trees
     * @param {CanvasRenderingContext2D} ctx - Canvas context

    const drawTallTree = (ctx, screenX, screenY, radius, obstacle) => {

      ctx.fillStyle = colors.groundShadow;

      // Draw taller, thicker trunk
      const trunkWidth = 18; // Thicker trunk

      ctx.fillRect(screenX - trunkWidth / 2, screenY - trunkHeight / 2, trunkWidth / 3, trunkHeight);

      ctx.fillStyle = colors.trunkBase;
      ctx.fillRect(screenX - trunkWidth / 2, screenY - trunkHeight / 2, trunkWidth, trunkHeight);

      // Trunk highlight (right side)
      ctx.fillStyle = colors.trunkHighlight;
      ctx.fillRect(screenX + trunkWidth / 6, screenY - trunkHeight / 2, trunkWidth / 4, trunkHeight);

      const foliageY = screenY - trunkHeight;

      // Secondary back layer
      ctx.fillStyle = colors.foliageDark;
      ctx.beginPath();
      ctx.arc(screenX + radius * 0.3, foliageY - radius * 0.4, radius * 0.75, 0, Math.PI * 2);

      // Middle layer (larger and fuller)
      ctx.fillStyle = colors.foliageBase;

      ctx.fillStyle = colors.foliageLight;

      ctx.arc(screenX + radius * 0.35, foliageY + radius * 0.15, radius * 0.9, 0, Math.PI * 2);

      // Additional front layer (left side)
      ctx.fillStyle = colors.foliageLight;
      ctx.beginPath();
      ctx.arc(screenX - radius * 0.35, foliageY + radius * 0.1, radius * 0.85, 0, Math.PI * 2);
      ctx.fill();

      // Highlights (brightest spots - multiple for fuller look)
      ctx.fillStyle = colors.foliageHighlight;
      ctx.beginPath();
      ctx.arc(screenX + radius * 0.45, foliageY - radius * 0.25, radius * 0.4, 0, Math.PI * 2);

      ctx.beginPath();
      ctx.arc(screenX - radius * 0.3, foliageY - radius * 0.15, radius * 0.35, 0, Math.PI * 2);
