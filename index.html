  <link rel="apple-touch-icon" href="apple-touch-icon.png" />
  <link rel="manifest" href="manifest.json" />

  <!-- Dynamic React loading: production by default, debug mode via Settings only -->
  <script>
    // Load appropriate React build based on debug mode setting
    (function() {
      // Check localStorage for debug mode (defaults to false/production)
      // NOTE: Must use literal 'react-debug-mode' here - runs before GAME_CONSTANTS is defined
      const isDev = localStorage.getItem('react-debug-mode') === 'true';

      const reactMode = isDev ? 'development' : 'production';
      const minSuffix = isDev ? '' : '.min'; // Dev builds are not minified

      // Log mode for debugging
      console.log('[Jurassic Escape] React mode:', reactMode);

      // Load React and ReactDOM dynamically (avoids document.write warnings)
      function loadScript(src, onLoad) {
        const script = document.createElement('script');
        script.src = src;
        script.crossOrigin = 'anonymous';
        if (onLoad) script.onload = onLoad;
        document.head.appendChild(script);
      }

      // Load scripts in sequence: React → ReactDOM → Babel
      loadScript(
        `https://unpkg.com/react@18/umd/react.${reactMode}${minSuffix}.js`,
        function() {
          loadScript(
            `https://unpkg.com/react-dom@18/umd/react-dom.${reactMode}${minSuffix}.js`,
            function() {
              loadScript('https://unpkg.com/@babel/standalone/babel.min.js', function() {
                // Transform all <script type="text/babel"> tags now that Babel is ready
                Babel.transformScriptTags();
              });
            }
          );
        }
      );
    })();
  </script>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    /* Mobile-specific touch behavior fixes */
    html, body {
      overscroll-behavior: none; /* Prevent pull-to-refresh and bounce */
      touch-action: pan-x pan-y; /* Allow scrolling but prevent other gestures */
      -webkit-user-select: none; /* Prevent text selection on iOS */
      user-select: none; /* Prevent text selection */
      -webkit-tap-highlight-color: transparent; /* Remove tap highlight */
    }

    /* Prevent text selection on game elements */
    #root {
      -webkit-user-select: none;
      user-select: none;
    }
  </style>

    /**
     * Calculate distance between two points
     */
    const distance = (x1, y1, x2, y2) => {
      const dx = x2 - x1;
      const dy = y2 - y1;
      return Math.sqrt(dx * dx + dy * dy);
    };

    /**
     * Generate a random value centered around zero
     * @param {number} range - The total range (result will be ±range/2)
     * @returns {number} Random value between -range/2 and +range/2
     */
    const randomCentered = (range) => {
      return (Math.random() - 0.5) * range;
    };

    /**
     * Randomize bubble offset position within spread area
     * @returns {Object} Object with offsetX and offsetY properties
     */

      offsetX: randomCentered(GAME_CONSTANTS.ENTITIES.HAZARDS.TAR_PIT.bubble.spread),
      offsetY: randomCentered(GAME_CONSTANTS.ENTITIES.HAZARDS.TAR_PIT.bubble.spread)
    });

    /**
     * Check if a position is valid (no collisions with existing entities)
     * @param {number} x - X position to check
     * @param {number} y - Y position to check
     * @param {number} radius - Radius of entity to place
     * @param {Object} game - Game state object with entity arrays
     * @param {number} clearance - Extra clearance distance (default: DEFAULT_ENTITY_CLEARANCE)
     * @returns {boolean} True if position is valid (no overlaps)
     */
    const isValidPosition = (x, y, radius, game, clearance = GAME_CONSTANTS.WORLD.SPAWN.DEFAULT_ENTITY_CLEARANCE) => {
      for (const tarPit of game.tarPits) {
        const dist = distance(x, y, tarPit.x, tarPit.y);
        if (dist < radius + tarPit.radius + clearance) {
          return false;
        }
      }

      for (const pond of game.ponds) {
        const dist = distance(x, y, pond.x, pond.y);
        if (dist < radius + pond.radius + clearance) {
          return false;
        }
      }

      for (const obstacle of game.obstacles) {
        const dist = distance(x, y, obstacle.x, obstacle.y);
        if (dist < radius + obstacle.radius + clearance) {
          return false;
        }
      }

      // Check against electric fences (approximate as circle with width/2 radius)
      for (const fence of game.electricFences) {
        const dist = distance(x, y, fence.x, fence.y);
        const fenceRadius = fence.width / 2;
        if (dist < radius + fenceRadius + clearance) {
          return false;
        }
      }

      return true;
    };

    /**
     * Generic retry mechanism for spawning entities with validation
     *
     * @param {Function} positionGenerator - Function that returns {x, y} position
     * @param {Function} validator - Function (x, y) => boolean (true = valid position)
     * @param {number} maxAttempts - Maximum spawn attempts (Infinity = retry until success)
     * @param {boolean} allowFallback - If true, returns last position when max attempts reached
     * @returns {Object|null} {x, y} position object, or null if failed and no fallback
     *
     * @remarks
     * Consolidates repetitive spawn retry patterns found in multiple factories:
     * - `spawnWithCollisionCheck`: infinite retries, no fallback
     * - `createElectricFence`: infinite retries, no fallback
     * - `createObstacle`: max attempts, no fallback (returns null)
     * - `createTerritoryForDino`: max attempts, with fallback (returns last attempt)
     *
     * Design decision - validator pattern:
     * - Validator receives (x, y) and returns boolean
     * - Enables composable validation (combine multiple validators with &&)
     * - Keeps position generation separate from validation logic
     * - Allows custom position generation strategies (random, grid, radial, etc.)
     */
    const retryUntilValid = (positionGenerator, validator, maxAttempts = Infinity, allowFallback = false) => {
      let lastX, lastY;
      let attempts = 0;

      while (attempts < maxAttempts) {
        const pos = positionGenerator();
        lastX = pos.x;
        lastY = pos.y;

        if (validator(pos.x, pos.y)) {
          return { x: pos.x, y: pos.y };
        }

        attempts++;
      }

      // Max attempts reached - return fallback or null
      return allowFallback ? { x: lastX, y: lastY } : null;
    };

    /**
     * Check if position maintains minimum spacing from entities in array
     *
     * @param {number} x - X position to check
     * @param {number} y - Y position to check
     * @param {Array} entityArray - Array of entities with x/y properties
     * @param {number} minDistance - Minimum required distance
     * @returns {boolean} True if spacing is valid (all entities are far enough)
     *
     * @remarks
     * Reusable spacing validator for:
     * - Electric fences: fence-to-fence minSpacing
     * - Territories: territory-to-territory spacing (prevents clustering)
     * - Any entity type requiring minimum spacing from same-type entities
     */
    const checkMinimumSpacing = (x, y, entityArray, minDistance) => {
      for (const entity of entityArray) {
        const dist = distance(x, y, entity.x, entity.y);
        if (dist < minDistance) {
          return false;
        }
      }
      return true;
    };

    /**
     * Check if position maintains radius-based spacing from existing entities
     *
     * @param {number} x - X position to check
     * @param {number} y - Y position to check
     * @param {number} newRadius - Radius of entity being spawned
     * @param {Array} entityArray - Array of existing entities with radius property
     * @param {number} spacingMultiplier - Multiplier applied to combined radii (e.g., 2.2)
     * @returns {boolean} True if spacing is valid (all entities are far enough)
     *
     * @remarks
     * Used when entities have variable radii (e.g., territories with different sizes).
     * Spacing is calculated as: (newRadius + existingRadius) * spacingMultiplier
     *
     * Example: Regular territory (200) vs Exit territory (300)
     * - Combined radius: 200 + 300 = 500
     * - Required spacing: 500 * 2.2 = 1100 pixels
     *
     * This ensures proper clearance regardless of entity size, unlike
     * checkMinimumSpacing which uses fixed distance for uniform entities.
     */
    const checkRadiusBasedSpacing = (x, y, newRadius, entityArray, spacingMultiplier) => {
      for (const entity of entityArray) {
        const dist = distance(x, y, entity.x, entity.y);
        const combinedRadius = newRadius + entity.radius;
        const requiredSpacing = combinedRadius * spacingMultiplier;
        if (dist < requiredSpacing) {
          return false;
        }
      }
      return true;
    };

    /**
     * Check if position maintains clearance from player spawn and static structures
     *
     * @param {number} x - X position to check
     * @param {number} y - Y position to check
     * @param {number} radius - Entity radius
     * @param {Object} game - Game state with player and staticStructures
     * @returns {boolean} True if clearance is valid
     *
     * @remarks
     * Used by obstacle spawning to ensure player has clear starting area.
     * Prevents obstacles from blocking player spawn or static structures (exits, etc.).
     *
     * Why this is separate from isValidPosition:
     * - Player clearance is spawn-time only (not runtime collision)
     * - Only needed for obstacles, not for all entity types
     * - Different clearance radius (SPAWN_CLEARANCE vs DEFAULT_ENTITY_CLEARANCE)
     */
    const checkPlayerClearance = (x, y, radius, game) => {
      // Check player clearance
      if (game.player) {
        const distFromPlayer = distance(x, y, game.player.x, game.player.y);
        const requiredClearance = GAME_CONSTANTS.WORLD.SPAWN.PLAYER.SPAWN_CLEARANCE + radius;
        if (distFromPlayer < requiredClearance) {
          return false;
        }
      }

      // Check static structure clearance
      if (game.staticStructures && game.staticStructures.length > 0) {
        for (const structure of game.staticStructures) {
          const distFromStructure = distance(x, y, structure.x, structure.y);
          const requiredClearance = GAME_CONSTANTS.WORLD.SPAWN.PLAYER.SPAWN_CLEARANCE + radius;
          if (distFromStructure < requiredClearance) {
            return false;
          }
        }
      }

      return true;
    };

    /**
     * Normalize a vector (dx, dy) and return unit vector with magnitude
     */
    const normalize = (dx, dy) => {
      const mag = Math.sqrt(dx * dx + dy * dy);
      return mag > 0 ? { dx: dx / mag, dy: dy / mag, magnitude: mag } : { dx: 0, dy: 0, magnitude: 0 };
    };

    /**
     * Clamp a value between min and max
     */
    const clamp = (value, min, max) => Math.max(min, Math.min(max, value));

    /**
     * Convert world coordinates to screen coordinates
     */
    const toScreenCoords = (worldX, worldY, cameraX, cameraY) => ({
      x: worldX - cameraX,
      y: worldY - cameraY
    });

    /**
     * Check if two circles collide
     */
    const circleCollision = (x1, y1, r1, x2, y2, r2) => {
      return distance(x1, y1, x2, y2) < r1 + r2;
    };

    /**

     * @param {number} params.count - Number of hazards to spawn
     * @param {Object} params.hazardType - Hazard type configuration (e.g., TAR_PIT, POND)
     * @param {Function} params.createFn - Factory function (e.g., createTarPit, createPond)
     * @param {Array} params.targetArray - Array to push created hazards to
     * @param {Array[]} params.existingArrays - Arrays of existing hazards to check spacing against
     * @param {Object} params.game - Game state object
     *
     * @remarks
     * Consolidates repetitive hazard spawning logic:
     * - Random position generation within safe zones
     * - Collision checking against existing hazards of same/different types
     * - Retry logic with max attempts
     * - Follows DRY principle by extracting common pattern
     */
    const spawnHazards = ({ count, hazardType, createFn, targetArray, existingArrays, game }) => {
      const maxAttempts = GAME_CONSTANTS.WORLD.SPAWN.HAZARDS.SPAWN_MAX_ATTEMPTS;
      // Calculate maximum possible radius for this hazard type (baseRadius * max variance)
      const maxNewRadius = hazardType.baseRadius * (0.5 + hazardType.sizeVariance);
      // Spacing multiplier derived from minSpacing / (2 * baseRadius) for backwards compatibility
      const spacingMultiplier = hazardType.minSpacing / (2 * hazardType.baseRadius);

      for (let i = 0; i < count; i++) {
        let x, y;
        let attempts = 0;

        while (attempts < maxAttempts) {
          x = GAME_CONSTANTS.WORLD.SPAWN.POWERUPS.SAFE_ZONE_MARGIN +
              Math.random() * (game.mapWidth - GAME_CONSTANTS.WORLD.SPAWN.POWERUPS.SAFE_ZONE_PADDING);
          y = GAME_CONSTANTS.WORLD.SPAWN.POWERUPS.SAFE_ZONE_MARGIN +
              Math.random() * (game.mapHeight - GAME_CONSTANTS.WORLD.SPAWN.POWERUPS.SAFE_ZONE_PADDING);

          let overlapping = false;

          // Check player and static structure clearance (prevents spawning over exit, etc.)
          if (!checkPlayerClearance(x, y, maxNewRadius, game)) {
            overlapping = true;
          }

          // Check radius-based spacing against all existing hazard arrays
          // Uses worst-case (max) radius for new hazard to guarantee no overlap
          if (!overlapping) {
            for (const existingArray of existingArrays) {
              if (!checkRadiusBasedSpacing(x, y, maxNewRadius, existingArray, spacingMultiplier)) {
                overlapping = true;
                break;
              }
            }
          }

          if (!overlapping) break;
          attempts++;
        }

        targetArray.push(createFn(x, y));
      }
    };

    /**
     * Spawn decoration patches (mushrooms or grass) with collision avoidance
     * @param {Object} params - Spawn parameters
     * @param {number} params.count - Number of patches to spawn
     * @param {Function} params.createFn - Factory function (e.g., createMushroomPatch, createGrassPatch)
     * @param {number} params.spread - Spread radius for collision checking
     * @param {Array} params.targetArray - Array to push created decorations to
     * @param {Object} params.game - Game state object
     * @param {Function} [params.getExtraArgs] - Optional function to generate extra args per patch
     *
     * @remarks
     * Consolidates repetitive decoration spawning logic:
     * - Random position generation within obstacle margins
     * - Player spawn clearance checking
     * - Collision validation via isValidPosition
     * - Supports extra arguments (e.g., color index for mushrooms)
     */
    const spawnDecorationPatches = ({ count, createFn, spread, targetArray, game, getExtraArgs }) => {
      for (let i = 0; i < count; i++) {
        const x = GAME_CONSTANTS.WORLD.SPAWN.OBSTACLES.BLOCKING.MIN_MARGIN +
                  Math.random() * (game.mapWidth - GAME_CONSTANTS.WORLD.SPAWN.OBSTACLES.BLOCKING.PADDING);
        const y = GAME_CONSTANTS.WORLD.SPAWN.OBSTACLES.BLOCKING.MIN_MARGIN +
                  Math.random() * (game.mapHeight - GAME_CONSTANTS.WORLD.SPAWN.OBSTACLES.BLOCKING.PADDING);

        // Check clearance from player spawn
        const distFromPlayer = distance(x, y, GAME_CONSTANTS.CORE.PLAYER.START_X, GAME_CONSTANTS.CORE.PLAYER.START_Y);
        if (distFromPlayer < GAME_CONSTANTS.WORLD.SPAWN.PLAYER.SPAWN_CLEARANCE) {
          continue;
        }

        // Use unified collision validator
        if (!isValidPosition(x, y, spread, game, 0)) {
          continue;
        }

        // Create patch with optional extra arguments
        const extraArgs = getExtraArgs ? getExtraArgs() : [];
        const patch = createFn(x, y, ...extraArgs);
        targetArray.push(...patch);
      }
    };

    /**
     * Apply canvas rendering styles in batch
     *
     * @param {CanvasRenderingContext2D} ctx - Canvas context
     * @param {Object} styles - Style object with optional properties:
     *   fillStyle, strokeStyle, lineWidth, font, textAlign, textBaseline,
     *   shadowColor, shadowBlur, globalAlpha
     *
     * @remarks
     * Performance optimization for canvas rendering.
     *
     * Why batch style application:
     * - Canvas context state changes are expensive operations
     * - Batching reduces number of style set operations
     * - Single function call vs multiple ctx.property assignments
     * - Enables style reuse via config objects in GAME_CONSTANTS
     *
     * Usage pattern:
     * - Store common style sets in constants
     * - Pass to applyCanvasStyles before drawing
     * - Example: applyCanvasStyles(ctx, GAME_CONSTANTS.VISUALS.TEXT_STYLE)
     */
    const applyCanvasStyles = (ctx, styles) => {
      if (styles.fillStyle !== undefined) ctx.fillStyle = styles.fillStyle;
      if (styles.strokeStyle !== undefined) ctx.strokeStyle = styles.strokeStyle;
      if (styles.lineWidth !== undefined) ctx.lineWidth = styles.lineWidth;
      if (styles.font !== undefined) ctx.font = styles.font;
      if (styles.textAlign !== undefined) ctx.textAlign = styles.textAlign;
      if (styles.textBaseline !== undefined) ctx.textBaseline = styles.textBaseline;
      if (styles.shadowColor !== undefined) ctx.shadowColor = styles.shadowColor;
      if (styles.shadowBlur !== undefined) ctx.shadowBlur = styles.shadowBlur;
      if (styles.globalAlpha !== undefined) ctx.globalAlpha = styles.globalAlpha;
    };

    /**
     * Batch render entity arrays using instance method pattern
     *
     * @param {CanvasRenderingContext2D} ctx - Canvas context
     * @param {number} cameraX - Camera X offset
     * @param {number} cameraY - Camera Y offset
     * @param {...Array} entityArrays - Variable number of entity arrays to render in order
     *
     * @remarks
     * Polymorphic batch rendering utility for instance method pattern.
     *
     * Why this pattern:
     * - All entities have .draw(ctx, cameraX, cameraY) instance method
     * - No type checking or switch statements needed at render time
     * - Single unified rendering pipeline for all entity types
     * - Argument order determines z-index layering
     *
     * Z-index layering via argument order:
     * - Earlier arguments render first (bottom layers)
     * - Later arguments render last (top layers)
     * - Example: drawEntities(ctx, cameraX, cameraY, background, obstacles, player)
     *   renders background → obstacles → player (player on top)
     *
     * Performance:
     * - Eliminates per-entity type checking overhead
     * - Enables compiler optimizations (monomorphic call site)
     * - Clean separation of concerns (entities own their rendering)
     */
    const drawEntities = (ctx, cameraX, cameraY, ...entityArrays) => {
      entityArrays.forEach(arr => {
        arr.forEach(entity => entity.draw(ctx, cameraX, cameraY));
      });
    };

    /**
     * Check if position is within map bounds
     * @param {number} x - X position
     * @param {number} y - Y position
     * @param {number} mapWidth - Map width
     * @param {number} mapHeight - Map height
     * @returns {boolean} True if position is within bounds
     */
    const isInBounds = (x, y, mapWidth, mapHeight) => {
      return !(x < 0 || x > mapWidth || y < 0 || y > mapHeight);
    };

    /**
     * Check if circle collides with rotated rectangle (for electric fences)
     *
     * @param {number} circleX - Circle center X in world space
     * @param {number} circleY - Circle center Y in world space
     * @param {number} radius - Circle radius
     * @param {number} rectX - Rectangle center X in world space
     * @param {number} rectY - Rectangle center Y in world space
     * @param {number} rectWidth - Rectangle width
     * @param {number} rectHeight - Rectangle height
     * @param {number} rotation - Rectangle rotation in radians
     * @returns {boolean} True if circle and rectangle overlap
     *
     * @remarks
     * Uses inverse rotation transform to simplify collision detection:
     * - Instead of rotating the rectangle to check collision (complex),
     *   we rotate the circle backward by -rotation (simpler)
     * - This transforms the problem into axis-aligned rect vs circle collision
     * - We then clamp the circle position to the rect bounds to find the closest point
     * - Finally check if that closest point is within the circle's radius
     *
     * Why this approach:
     * - Avoids complex rotated rectangle corner calculations
     * - Single matrix transformation handles all rotation cases
     * - Works for any rotation angle without special cases
     */
    const circleRectCollision = (circleX, circleY, radius, rectX, rectY, rectWidth, rectHeight, rotation) => {
      // Translate circle to rect's local space (origin at rect center)
      const dx = circleX - rectX;
      const dy = circleY - rectY;

      // Apply inverse rotation transform to circle position
      // This "unrotates" the circle relative to the rectangle,
      // converting rotated rect problem → axis-aligned rect problem
      const cos = Math.cos(-rotation);
      const sin = Math.sin(-rotation);
      const localX = dx * cos - dy * sin;
      const localY = dx * sin + dy * cos;

      // Find closest point on axis-aligned rect to circle center
      // Clamping to rect bounds gives us the nearest point on/in rectangle
      const halfWidth = rectWidth / 2;
      const halfHeight = rectHeight / 2;
      const closestX = Math.max(-halfWidth, Math.min(halfWidth, localX));
      const closestY = Math.max(-halfHeight, Math.min(halfHeight, localY));

      // Check distance from circle center to closest point on rectangle
      // If distance < radius, they overlap
      const distX = localX - closestX;
      const distY = localY - closestY;
      const distSquared = distX * distX + distY * distY;

      return distSquared < radius * radius;
    };

    /**
     * Check if entity collides with any obstacle
     */
    const checkObstacleCollision = (x, y, radius, obstacles, jumpHeight = 0) => {
      const canJumpOverObstacles = jumpHeight >= GAME_CONSTANTS.CORE.PLAYER.JUMP_CLEAR_HEIGHT;

      for (const obs of obstacles) {
        // Skip jumpable obstacles when jumping high enough
        if (canJumpOverObstacles && obs.obstacleType.canJumpOver) {
          continue;
        }

        if (circleCollision(x, y, radius, obs.x, obs.y, obs.radius)) {
          return true;
        }
      }
      return false;
    };

    /**
     * Create a bullet object with physics and rendering
     *
     * @param {number} fromX - Starting X position
     * @param {number} fromY - Starting Y position
     * @param {number} toX - Target X position (for direction calculation)
     * @param {number} toY - Target Y position (for direction calculation)
     * @returns {Object} Bullet object with update() and draw() instance methods
     *
     * @remarks
     * Factory pattern used to ensure all bullets have consistent instance methods.
     *
     * Why instance methods:
     * - Enables polymorphic batch rendering via `drawEntities(ctx, cameraX, cameraY, bullets)`
     * - Each bullet encapsulates its own update and draw logic (OOP pattern)
     * - Eliminates need for switch statements or type checking at render time
     * - All entities (bullets, obstacles, dinosaurs) follow same pattern
     *
     * Update method returns boolean to enable filter-based cleanup:
     * `bullets = bullets.filter(b => b.update(mapWidth, mapHeight))`
     */
    const createBullet = (fromX, fromY, toX, toY) => {
      const weapon = GAME_CONSTANTS.ENTITIES.WEAPONS.REGULAR;
      const { dx, dy } = normalize(toX - fromX, toY - fromY);
      const bullet = {
        x: fromX,
        y: fromY,
        vx: dx * weapon.speed,
        vy: dy * weapon.speed,
        radius: weapon.radius,
        weaponType: weapon
      };

      // Returns false when bullet goes out of bounds (signals removal)
      bullet.update = function(mapWidth, mapHeight) {
        this.x += this.vx;
        this.y += this.vy;
        return isInBounds(this.x, this.y, mapWidth, mapHeight);
      };

      bullet.draw = function(ctx, cameraX, cameraY) {
        const screenPos = toScreenCoords(this.x, this.y, cameraX, cameraY);
        ctx.fillStyle = this.weaponType.bulletColor;
        ctx.beginPath();
        ctx.arc(screenPos.x, screenPos.y, this.radius, 0, Math.PI * 2);
        ctx.fill();
      };

      return bullet;
    };

    /**
     * Create a tranquilizer dart object
     */
    const createTranquilizer = (fromX, fromY, toX, toY) => {
      const { dx, dy } = normalize(toX - fromX, toY - fromY);
      const tranq = {
        x: fromX,
        y: fromY,
        vx: dx * GAME_CONSTANTS.ENTITIES.WEAPONS.TRANQUILIZER.speed,
        vy: dy * GAME_CONSTANTS.ENTITIES.WEAPONS.TRANQUILIZER.speed,
        radius: GAME_CONSTANTS.ENTITIES.WEAPONS.TRANQUILIZER.radius,
        weaponType: GAME_CONSTANTS.ENTITIES.WEAPONS.TRANQUILIZER
      };

      tranq.update = function(mapWidth, mapHeight) {
        this.x += this.vx;
        this.y += this.vy;
        return isInBounds(this.x, this.y, mapWidth, mapHeight);
      };

      tranq.draw = function(ctx, cameraX, cameraY) {
        const screenPos = toScreenCoords(this.x, this.y, cameraX, cameraY);
        ctx.fillStyle = this.weaponType.bulletColor;
        ctx.beginPath();
        ctx.arc(screenPos.x, screenPos.y, this.radius, 0, Math.PI * 2);
        ctx.fill();
      };

      return tranq;
    };

    /**
     * Transition to a new game state with automatic sound effect handling
     *
     * @param {Object} newState - State object from GAME_CONSTANTS.CORE.GAME_STATES
     * @param {Function} playSound - Sound playing function
     * @param {Object|null} stateAccumulator - State accumulator for batched updates (game loop), or null
     * @param {Function|null} setGameState - Direct setState function (when not using accumulator)
     *
     * @remarks
     * Dual-mode operation handles two different React state update contexts:
     *
     * Mode 1: State Accumulator (game loop)
     * - Used in 60 FPS game loop where multiple updates happen per frame
     * - Accumulates all state changes into single object
     * - Applied once at end of frame to prevent multiple re-renders
     * - Example: `transitionToState(LOST, playSound, stateAccumulator, null)`
     *
     * Mode 2: Direct setState (event handlers)
     * - Used in event handlers (keyboard, mouse, touch)
     * - Immediately calls React setState function
     * - No batching needed since events are discrete
     * - Example: `transitionToState(PLAYING, playSound, null, setGameState)`
     *
     * Why this design:
     * - Single unified API for state transitions across codebase
     * - Automatic sound effect playback for all transitions
     * - Performance: prevents 60+ re-renders per second in game loop
     * - Simplicity: callers don't need to remember to play sounds
     */
    const transitionToState = (newState, playSound, stateAccumulator = null, setGameState = null) => {
      // Set the new state (batched or direct depending on context)
      if (stateAccumulator) {
        stateAccumulator.gameState = newState;
      } else if (setGameState) {
        setGameState(newState);
      }

      // Always play associated sound effect immediately (not batched)
      if (newState.soundEffect) {
        playSound(newState.soundEffect);
      }
    };

    /**
     * Unified weapon firing logic with generic ammo management
     *
     * @param {Object} weapon - Weapon type from GAME_CONSTANTS.ENTITIES.WEAPONS
     * @param {Object} player - Player object
     * @param {number} targetX - Target X coordinate
     * @param {number} targetY - Target Y coordinate
     * @param {Object} game - Game state object
     * @param {Function} playSound - Sound playing function
     * @param {Object|null} stateAccumulator - State accumulator for batched updates (game loop), or null for direct setState
     * @param {Object|null} setters - Object mapping ammo keys to setter functions { playerAmmo: setPlayerAmmo, playerTranqAmmo: setPlayerTranqAmmo }
     * @returns {boolean} True if weapon was fired, false if no ammo
     *
     * @remarks
     * Generic weapon system uses `weapon.ammoConfig` for type-agnostic ammo management:
     *
     * Weapon configuration paths:
     * - playerKey: "ammo" or "tranqAmmo" (player object property)
     * - stateKey: "playerAmmo" or "playerTranqAmmo" (React state key)
     * - bulletFactory: createBullet or createTranquilizer (factory function)
     *
     * Why this design:
     * - Adding new weapons doesn't require code changes here
     * - All weapon logic configured in GAME_CONSTANTS.ENTITIES.WEAPONS
     * - Same function handles regular bullets, tranquilizers, future weapons
     * - Ammo state management abstracted via config paths
     *
     * Dual-mode state updates (same pattern as transitionToState):
     * - stateAccumulator: batched updates for game loop (60 FPS)
     * - setters: direct setState for event handlers (discrete events)
     */
    const fireWeapon = (weapon, player, targetX, targetY, game, playSound, stateAccumulator = null, setters = null) => {
      // Check ammo using weapon's configured player property path
      const ammoCount = player[weapon.ammoConfig.playerKey];

      if (ammoCount <= 0) {
        return false; // No ammo available
      }

      // Create bullet using weapon's configured factory function
      const bullet = weapon.bulletFactory(player.x, player.y, targetX, targetY);

      game.bullets.push(bullet);
      player[weapon.ammoConfig.playerKey]--;

      // Update React state using weapon's configured state key
      if (stateAccumulator) {
        // Batched update for game loop
        stateAccumulator[weapon.ammoConfig.stateKey] = player[weapon.ammoConfig.playerKey];
      } else if (setters) {
        // Direct setState for event handlers
        const setter = setters[weapon.ammoConfig.stateKey];
        if (setter) {
          setter(player[weapon.ammoConfig.playerKey]);
        }
      }

      playSound(weapon.soundEffect);
      return true;
    };

    /**
     * Create a floating text object
     */
    const createFloatingText = (x, y, text, color = '#FFD700') => {
      const floatingText = {
        x,
        y,
        startY: y,
        text,
        color,
        lifetime: GAME_CONSTANTS.VISUALS.FLOATING_TEXT.LIFETIME_FRAMES,
        age: 0
      };

      floatingText.update = function() {
        this.age++;
        this.y -= GAME_CONSTANTS.VISUALS.FLOATING_TEXT.RISE_SPEED;
        return this.age < this.lifetime;
      };

      floatingText.draw = function(ctx, cameraX, cameraY) {
        const screenX = this.x - cameraX;
        const screenY = this.y - cameraY;

        // Culling
        const buffer = GAME_CONSTANTS.VISUALS.FLOATING_TEXT.CULLING_BUFFER;
        const canvas = ctx.canvas;
        if (screenX < -buffer || screenX > canvas.width + buffer || screenY < -buffer || screenY > canvas.height + buffer) {
          return;
        }

        // Calculate alpha (fade out in final frames)
        const fadeDuration = GAME_CONSTANTS.VISUALS.FLOATING_TEXT.LIFETIME_FRAMES - GAME_CONSTANTS.VISUALS.FLOATING_TEXT.FADE_START_FRAME;
        const alpha = this.age < GAME_CONSTANTS.VISUALS.FLOATING_TEXT.FADE_START_FRAME
          ? GAME_CONSTANTS.VISUALS.FLOATING_TEXT.ALPHA_OPAQUE
          : GAME_CONSTANTS.VISUALS.FLOATING_TEXT.ALPHA_OPAQUE - (this.age - GAME_CONSTANTS.VISUALS.FLOATING_TEXT.FADE_START_FRAME) / fadeDuration;

        ctx.globalAlpha = alpha;
        ctx.fillStyle = this.color;
        ctx.fillText(this.text, screenX, screenY);
      };

      return floatingText;
    };

    /**
     * Create an obstacle object
     * @param {Object} game - Game state object with all necessary properties
     * @returns {Object} Obstacle object with draw() instance method
     */
    const createObstacle = (game) => {
      let obstacleRadius;

      // Position generator: random position with random radius
      const generatePosition = () => {
        obstacleRadius = GAME_CONSTANTS.WORLD.SPAWN.OBSTACLES.BLOCKING.MIN_RADIUS + Math.random() * (GAME_CONSTANTS.WORLD.SPAWN.OBSTACLES.BLOCKING.MAX_RADIUS - GAME_CONSTANTS.WORLD.SPAWN.OBSTACLES.BLOCKING.MIN_RADIUS);
        return {
          x: Math.random() * (game.mapWidth - GAME_CONSTANTS.WORLD.SPAWN.OBSTACLES.BLOCKING.PADDING) + GAME_CONSTANTS.WORLD.SPAWN.OBSTACLES.BLOCKING.MIN_MARGIN,
          y: Math.random() * (game.mapHeight - GAME_CONSTANTS.WORLD.SPAWN.OBSTACLES.BLOCKING.PADDING) + GAME_CONSTANTS.WORLD.SPAWN.OBSTACLES.BLOCKING.MIN_MARGIN
        };
      };

      // Validator: player clearance + static structure clearance + general collision
      const isValid = (x, y) => {
        return checkPlayerClearance(x, y, obstacleRadius, game) &&
               isValidPosition(x, y, obstacleRadius, game);
      };

      // Retry with max attempts, no fallback (can return null if all attempts fail)
      const pos = retryUntilValid(
        generatePosition,
        isValid,
        GAME_CONSTANTS.WORLD.SPAWN.OBSTACLES.BLOCKING.SPAWN_MAX_ATTEMPTS,
        false
      );

      // Select obstacle type: 25% trees, 25% bushes, 15% tall trees, 20% boulders, 15% rock clusters
      const rand = Math.random();
      let obstacleType;
      if (rand < 0.25) {
        obstacleType = GAME_CONSTANTS.ENTITIES.OBSTACLES.TREE;
      } else if (rand < 0.5) {
        obstacleType = GAME_CONSTANTS.ENTITIES.OBSTACLES.BUSH;
      } else if (rand < 0.65) {
        obstacleType = GAME_CONSTANTS.ENTITIES.OBSTACLES.TALL_TREE;
      } else if (rand < 0.85) {
        obstacleType = GAME_CONSTANTS.ENTITIES.OBSTACLES.BOULDER;
      } else {
        obstacleType = GAME_CONSTANTS.ENTITIES.OBSTACLES.ROCK_CLUSTER;
      }

      const obstacle = {
        x: pos.x,
        y: pos.y,
        radius: obstacleRadius,
        obstacleType
      };

      // For rock clusters, generate individual rock positions
      if (obstacleType === GAME_CONSTANTS.ENTITIES.OBSTACLES.ROCK_CLUSTER) {
        obstacle.rocks = generateRockClusterRocks(obstacleType);
      }

      obstacle.draw = function(ctx, cameraX, cameraY) {
        const screenX = this.x - cameraX;
        const screenY = this.y - cameraY;
        this.obstacleType.drawFunction(ctx, screenX, screenY, this.radius, this);
      };

      return obstacle;
    };

    /**
     * Generate rock positions for a rock cluster with collision avoidance
     *
     * @param {Object} obstacleType - The ROCK_CLUSTER obstacle type object
     * @returns {Array} Array of rock objects with offsetX, offsetY, radius properties
     *
     * @remarks
     * Ensures rocks within a cluster don't overlap by checking each new rock
     * against previously placed rocks. Uses retry mechanism to find valid positions.
     * Skips rocks that can't find valid positions after max attempts to guarantee
     * no overlaps (resulting in 3-8 rocks per cluster).
     */
    const generateRockClusterRocks = (obstacleType) => {
      const rockCount = Math.floor(
        Math.random() * (obstacleType.rocksPerCluster.max - obstacleType.rocksPerCluster.min + 1)
      ) + obstacleType.rocksPerCluster.min;

      const rocks = [];
      const maxAttempts = 100; // Increased attempts for better success rate

      for (let i = 0; i < rockCount; i++) {
        let validPosition = false;
        let attempts = 0;
        let offsetX, offsetY, rockRadius;

        while (!validPosition && attempts < maxAttempts) {
          const angle = Math.random() * Math.PI * 2;
          const minSpread = GAME_CONSTANTS.WORLD.SPAWN.OBSTACLES.ROCK_CLUSTERS.MIN_SPREAD;
          const maxSpread = GAME_CONSTANTS.WORLD.SPAWN.OBSTACLES.ROCK_CLUSTERS.MAX_SPREAD;
          const dist = minSpread + Math.random() * (maxSpread - minSpread);
          rockRadius = GAME_CONSTANTS.WORLD.SPAWN.OBSTACLES.ROCK_CLUSTERS.INDIVIDUAL_RADIUS_MIN +
                       Math.random() * (GAME_CONSTANTS.WORLD.SPAWN.OBSTACLES.ROCK_CLUSTERS.INDIVIDUAL_RADIUS_MAX -
                       GAME_CONSTANTS.WORLD.SPAWN.OBSTACLES.ROCK_CLUSTERS.INDIVIDUAL_RADIUS_MIN);

          offsetX = Math.cos(angle) * dist;
          offsetY = Math.sin(angle) * dist;

          // Check collision with previously placed rocks
          validPosition = true;
          for (const existingRock of rocks) {
            if (circleCollision(
              offsetX, offsetY, rockRadius,
              existingRock.offsetX, existingRock.offsetY, existingRock.radius
            )) {
              validPosition = false;
              break;
            }
          }

          attempts++;
        }

        // Only add rock if valid position was found
        if (validPosition) {
          rocks.push({
            offsetX,
            offsetY,
            radius: rockRadius
          });
        }
      }

      return rocks;
    };

    /**
     * Create a mushroom patch (cluster of mushrooms with same color)
     * @param {number} centerX - Patch center X position
     * @param {number} centerY - Patch center Y position
     * @param {number} colorIndex - Cap color index for all mushrooms in patch
     * @returns {Array} Array of mushroom objects
     */
    const createMushroomPatch = (centerX, centerY, colorIndex) => {
      const mushrooms = [];
      const patchSize = GAME_CONSTANTS.WORLD.SPAWN.OBSTACLES.MUSHROOMS.PATCH_SIZE;
      const spread = GAME_CONSTANTS.WORLD.SPAWN.OBSTACLES.MUSHROOMS.PATCH_SPREAD;

      for (let i = 0; i < patchSize; i++) {
        const angle = Math.random() * Math.PI * 2;
        const dist = Math.random() * spread;
        const x = centerX + Math.cos(angle) * dist;
        const y = centerY + Math.sin(angle) * dist;
        const radius = GAME_CONSTANTS.WORLD.SPAWN.OBSTACLES.MUSHROOMS.MIN_RADIUS + Math.random() * (GAME_CONSTANTS.WORLD.SPAWN.OBSTACLES.MUSHROOMS.MAX_RADIUS - GAME_CONSTANTS.WORLD.SPAWN.OBSTACLES.MUSHROOMS.MIN_RADIUS);
        const spotOptions = GAME_CONSTANTS.ENTITIES.OBSTACLES.MUSHROOM.sizes.spotsCountOptions;
        const spotCount = spotOptions[Math.floor(Math.random() * spotOptions.length)];

        const mushroom = {
          x,
          y,
          radius,
          obstacleType: GAME_CONSTANTS.ENTITIES.OBSTACLES.MUSHROOM,
          colorIndex,
          spotCount
        };

        mushroom.draw = function(ctx, cameraX, cameraY) {
          const screenX = this.x - cameraX;
          const screenY = this.y - cameraY;
          this.obstacleType.drawFunction(ctx, screenX, screenY, this.radius, this);
        };

        mushrooms.push(mushroom);
      }

      return mushrooms;
    };

    /**
     * Create a grass patch cluster (multiple small grass patches)
     * @param {number} centerX - Cluster center X position
     * @param {number} centerY - Cluster center Y position
     * @returns {Array} Array of grass patch objects
     */
    const createGrassPatch = (centerX, centerY) => {
      const patches = [];
      const patchSize = GAME_CONSTANTS.WORLD.SPAWN.OBSTACLES.GRASS.PATCH_SIZE;
      const spread = GAME_CONSTANTS.WORLD.SPAWN.OBSTACLES.GRASS.PATCH_SPREAD;

      for (let i = 0; i < patchSize; i++) {
        const angle = Math.random() * Math.PI * 2;
        const dist = Math.random() * spread;
        const x = centerX + Math.cos(angle) * dist;
        const y = centerY + Math.sin(angle) * dist;
        const radius = GAME_CONSTANTS.WORLD.SPAWN.OBSTACLES.GRASS.MIN_RADIUS + Math.random() * (GAME_CONSTANTS.WORLD.SPAWN.OBSTACLES.GRASS.MAX_RADIUS - GAME_CONSTANTS.WORLD.SPAWN.OBSTACLES.GRASS.MIN_RADIUS);

        const patch = {
          x,
          y,
          radius,
          obstacleType: GAME_CONSTANTS.ENTITIES.OBSTACLES.GRASS
        };

        patch.draw = function(ctx, cameraX, cameraY) {
          const screenX = this.x - cameraX;
          const screenY = this.y - cameraY;
          this.obstacleType.drawFunction(ctx, screenX, screenY, this.radius, this);
        };

        patches.push(patch);
      }

      return patches;
    };

    /**
     * Generic spawn helper: retries until factory succeeds with valid position
     * @param {Object} game - Game state object (for collision checking)
     * @param {Function} radiusGetter - Function that returns entity radius for collision checking
     * @param {Function} factory - Function (x, y) => entity object
     * @returns {Object} Entity object (always succeeds)
     */
    const spawnWithCollisionCheck = (game, radiusGetter, factory) => {
      // Keep trying until we find a valid position (guaranteed to succeed eventually)
      while (true) {
        const x = GAME_CONSTANTS.WORLD.SPAWN.POWERUPS.SAFE_ZONE_MARGIN + Math.random() * (game.mapWidth - GAME_CONSTANTS.WORLD.SPAWN.POWERUPS.SAFE_ZONE_PADDING);
        const y = GAME_CONSTANTS.WORLD.SPAWN.POWERUPS.SAFE_ZONE_MARGIN + Math.random() * (game.mapHeight - GAME_CONSTANTS.WORLD.SPAWN.POWERUPS.SAFE_ZONE_PADDING);

        const radius = radiusGetter();
        // Use unified collision validator (checks tar pits, obstacles, fences)
        if (isValidPosition(x, y, radius, game, 0)) {
          return factory(x, y);
        }
      }
    };

    /**
     * Create a powerup object with guaranteed valid position
     * @param {Object} game - Game state object (for collision checking)
     * @returns {Object} Powerup object (always succeeds)
     */
    const createPowerup = (game) => {
      const powerupType = Math.random() > 0.5 ? GAME_CONSTANTS.ENTITIES.POWERUPS.HEALTH : GAME_CONSTANTS.ENTITIES.POWERUPS.SPEED;

      return spawnWithCollisionCheck(
        game,
        () => powerupType.radius,
        (x, y) => {
          const powerup = {
            x,
            y,
            powerupType,
            radius: powerupType.radius,
            active: true
          };

          powerup.draw = function(ctx, cameraX, cameraY) {
            drawPowerup(ctx, this, cameraX, cameraY);
          };

          return powerup;
        }
      );
    };

    /**
     * Create a tranquilizer depot object with guaranteed valid position
     * @param {Object} game - Game state object (for collision checking)
     * @returns {Object} Depot object (always succeeds)
     */
    const createTranqDepot = (game) => {
      return spawnWithCollisionCheck(

        (x, y) => {

    /**
     * Create a regular ammo depot object at fixed position
     * @param {number} x - X position
     * @param {number} y - Y position

    const createAmmoDepot = (x, y, amount) => {
