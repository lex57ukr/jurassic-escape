    /**
     * Draw bush with multiple overlapping clusters
     * @param {CanvasRenderingContext2D} ctx - Canvas context
     * @param {number} screenX - Screen X position
     * @param {number} screenY - Screen Y position
     * @param {number} radius - Bush radius
     * @param {Object} obstacle - Obstacle object (unused for bush, but required for consistent interface)
     */
    const drawBush = (ctx, screenX, screenY, radius, obstacle) => {
      const colors = GAME_CONSTANTS.ENTITIES.OBSTACLES.BUSH.colors;
      const clusterCount = GAME_CONSTANTS.ENTITIES.OBSTACLES.BUSH.clusters;
      const angleStep = (Math.PI * 2) / clusterCount;

      // Base dark layer (shadow)
      ctx.fillStyle = colors.dark;
      ctx.beginPath();
      ctx.arc(screenX, screenY, radius, 0, Math.PI * 2);
      ctx.fill();

      // Main bush clusters
      ctx.fillStyle = colors.base;
      for (let i = 0; i < clusterCount; i++) {
        const angle = i * angleStep;
        const offsetX = Math.cos(angle) * radius * 0.3;
        const offsetY = Math.sin(angle) * radius * 0.3;
        ctx.beginPath();
        ctx.arc(screenX + offsetX, screenY + offsetY, radius * 0.7, 0, Math.PI * 2);
        ctx.fill();
      }

      // Light clusters (mid-tone)
      ctx.fillStyle = colors.light;
      for (let i = 0; i < clusterCount; i++) {
        const angle = i * angleStep + angleStep / 2;
        const offsetX = Math.cos(angle) * radius * 0.45;
        const offsetY = Math.sin(angle) * radius * 0.45;
        ctx.beginPath();
        ctx.arc(screenX + offsetX, screenY + offsetY, radius * 0.5, 0, Math.PI * 2);
        ctx.fill();
      }

      // Highlight spots (brightest)
      ctx.fillStyle = colors.highlight;
      ctx.beginPath();
      ctx.arc(screenX + radius * 0.3, screenY - radius * 0.3, radius * 0.25, 0, Math.PI * 2);
      ctx.fill();
      ctx.beginPath();
      ctx.arc(screenX - radius * 0.2, screenY + radius * 0.2, radius * 0.2, 0, Math.PI * 2);
      ctx.fill();
    };

    /**
     * Draw boulder with rocky, irregular appearance
     * @param {CanvasRenderingContext2D} ctx - Canvas context
     * @param {number} screenX - Screen X position
     * @param {number} screenY - Screen Y position
     * @param {number} radius - Boulder radius
     * @param {Object} obstacle - Obstacle object (unused for boulder, but required for consistent interface)
     */
    const drawBoulder = (ctx, screenX, screenY, radius, obstacle) => {
      const colors = GAME_CONSTANTS.ENTITIES.OBSTACLES.BOULDER.colors;

      // Draw ground shadow (irregular ellipse under boulder)
      ctx.fillStyle = colors.groundShadow;
      ctx.beginPath();
      ctx.ellipse(screenX, screenY + radius * 0.8, radius * 1.0, radius * 0.35, 0, 0, Math.PI * 2);
      ctx.fill();

      // Create irregular boulder shape with fewer circles for better performance
      // Base dark layer (5 circles for asymmetric base)
      ctx.fillStyle = colors.dark;
      const basePoints = [
        { x: -0.1, y: 0, r: 0.85 },
        { x: 0.55, y: -0.3, r: 0.6 },
        { x: -0.65, y: 0.2, r: 0.55 },
        { x: 0.3, y: 0.6, r: 0.5 },
        { x: -0.4, y: -0.5, r: 0.45 },
      ];
      basePoints.forEach(pt => {
        ctx.beginPath();
        ctx.arc(screenX + pt.x * radius, screenY + pt.y * radius, radius * pt.r, 0, Math.PI * 2);
        ctx.fill();
      });

      // Main boulder body (4 circles for medium gray texture)
      ctx.fillStyle = colors.base;
      const mainPoints = [
        { x: -0.15, y: -0.05, r: 0.75 },
        { x: 0.45, y: -0.25, r: 0.55 },
        { x: -0.55, y: 0.25, r: 0.5 },
        { x: 0.25, y: 0.5, r: 0.45 },
      ];
      mainPoints.forEach(pt => {
        ctx.beginPath();
        ctx.arc(screenX + pt.x * radius, screenY + pt.y * radius, radius * pt.r, 0, Math.PI * 2);
        ctx.fill();
      });

      // Light gray patches (4 circles for highlights)
      ctx.fillStyle = colors.light;
      const lightPoints = [
        { x: -0.25, y: -0.15, r: 0.35 },
        { x: 0.15, y: 0.15, r: 0.3 },
        { x: -0.45, y: 0.35, r: 0.25 },
        { x: 0.35, y: -0.35, r: 0.25 },
      ];
      lightPoints.forEach(pt => {
        ctx.beginPath();
        ctx.arc(screenX + pt.x * radius, screenY + pt.y * radius, radius * pt.r, 0, Math.PI * 2);
        ctx.fill();
      });

      // Bright highlight spots (2 circles for sunlight reflection)
      ctx.fillStyle = colors.highlight;
      ctx.beginPath();
      ctx.arc(screenX - radius * 0.35, screenY - radius * 0.4, radius * 0.18, 0, Math.PI * 2);
      ctx.fill();
      ctx.beginPath();
      ctx.arc(screenX - radius * 0.55, screenY - radius * 0.1, radius * 0.12, 0, Math.PI * 2);
      ctx.fill();
    };

    /**
     * Draw rock cluster with multiple individual rocks using angular polygons
     *
     * @param {CanvasRenderingContext2D} ctx - Canvas context
     * @param {number} screenX - Screen X position (cluster center)
     * @param {number} screenY - Screen Y position (cluster center)
     * @param {number} radius - Cluster radius (unused, rocks have individual radii)
     * @param {Object} obstacle - Obstacle object with rocks array
     *
     * @remarks
     * Uses polygons with straight lines instead of circles for more angular,
     * natural-looking rocks. Performance benefit: ~20-30% faster than circles
     * due to simpler path construction without trig calculations.
     */
    const drawRockCluster = (ctx, screenX, screenY, radius, obstacle) => {
      const colors = GAME_CONSTANTS.ENTITIES.OBSTACLES.ROCK_CLUSTER.colors;

      // Draw each rock in the cluster with angular shapes
      obstacle.rocks.forEach(rock => {
        const rockX = screenX + rock.offsetX;
        const rockY = screenY + rock.offsetY;
        const rockRadius = rock.radius;

        // Generate consistent random angles for this rock (using position as seed)
        const seed = Math.abs(Math.sin(rock.offsetX * 12.9898 + rock.offsetY * 78.233) * 43758.5453);
        const angleOffset = (seed % 1) * Math.PI * 2;

        // Draw ground shadow (soft ellipse)
        ctx.fillStyle = colors.groundShadow;
        ctx.beginPath();
        ctx.ellipse(rockX, rockY + rockRadius * 0.7, rockRadius * 0.85, rockRadius * 0.25, 0, 0, Math.PI * 2);
        ctx.fill();

        // Main rock body - angular polygon (5-7 sides for irregular shape)
        // Use base color (medium gray) instead of dark for lighter appearance
        ctx.fillStyle = colors.base;
        ctx.beginPath();
        const sideCount = 5 + Math.floor((seed * 7) % 3); // 5-7 sides
        for (let i = 0; i < sideCount; i++) {
          const angle = angleOffset + (i / sideCount) * Math.PI * 2;
          // Vary the radius per vertex for irregular shape
          const radiusVariation = 0.8 + ((seed * 13 + i * 7) % 100) / 100 * 0.4; // 0.8-1.2
          const x = rockX + Math.cos(angle) * rockRadius * radiusVariation;
          const y = rockY + Math.sin(angle) * rockRadius * radiusVariation;
          if (i === 0) {
            ctx.moveTo(x, y);
          } else {
            ctx.lineTo(x, y);
          }
        }
        ctx.closePath();
        ctx.fill();

        // Dark shadow facet (angular shadow on one side) - irregular quadrilateral
        ctx.fillStyle = colors.dark;
        ctx.beginPath();
        const shadowAngle = angleOffset + Math.PI * 1.5; // Bottom-right side for shadow
        ctx.moveTo(rockX + Math.cos(shadowAngle) * rockRadius * 0.2, rockY + Math.sin(shadowAngle) * rockRadius * 0.2);
        ctx.lineTo(rockX + Math.cos(shadowAngle + 0.6) * rockRadius * 0.7, rockY + Math.sin(shadowAngle + 0.6) * rockRadius * 0.7);
        ctx.lineTo(rockX + Math.cos(shadowAngle + 1.2) * rockRadius * 0.6, rockY + Math.sin(shadowAngle + 1.2) * rockRadius * 0.6);
        ctx.lineTo(rockX + Math.cos(shadowAngle + 1.8) * rockRadius * 0.3, rockY + Math.sin(shadowAngle + 1.8) * rockRadius * 0.3);
        ctx.closePath();
        ctx.fill();

        // Light highlight facet - triangle (larger for more brightness)
        ctx.fillStyle = colors.light;
        ctx.beginPath();
        const highlightAngle = angleOffset + Math.PI * 0.3; // Top-left side for highlight
        ctx.moveTo(rockX + Math.cos(highlightAngle) * rockRadius * 0.1, rockY + Math.sin(highlightAngle) * rockRadius * 0.1);
        ctx.lineTo(rockX + Math.cos(highlightAngle + 0.9) * rockRadius * 0.55, rockY + Math.sin(highlightAngle + 0.9) * rockRadius * 0.55);
        ctx.lineTo(rockX + Math.cos(highlightAngle + 1.8) * rockRadius * 0.45, rockY + Math.sin(highlightAngle + 1.8) * rockRadius * 0.45);
        ctx.closePath();
        ctx.fill();

        // Bright highlight spot - small triangle
        ctx.fillStyle = colors.highlight;
        ctx.beginPath();
        const brightAngle = angleOffset + Math.PI * 0.15; // Near top for bright spot
        ctx.moveTo(rockX + Math.cos(brightAngle) * rockRadius * 0.2, rockY + Math.sin(brightAngle) * rockRadius * 0.2);
        ctx.lineTo(rockX + Math.cos(brightAngle + 1.2) * rockRadius * 0.35, rockY + Math.sin(brightAngle + 1.2) * rockRadius * 0.35);
        ctx.lineTo(rockX + Math.cos(brightAngle + 2.4) * rockRadius * 0.3, rockY + Math.sin(brightAngle + 2.4) * rockRadius * 0.3);
        ctx.closePath();
        ctx.fill();
      });
    };

    /**
     * Draw mushroom with colorful cap and spots
     * @param {CanvasRenderingContext2D} ctx - Canvas context
     * @param {number} screenX - Screen X position
     * @param {number} screenY - Screen Y position
     * @param {number} radius - Mushroom radius
     * @param {Object} obstacle - Obstacle object (used for colorIndex and spotCount)
     */
    const drawMushroom = (ctx, screenX, screenY, radius, obstacle) => {
      const colors = GAME_CONSTANTS.ENTITIES.OBSTACLES.MUSHROOM.colors;
      const sizes = GAME_CONSTANTS.ENTITIES.OBSTACLES.MUSHROOM.sizes;

      const stemWidth = radius * sizes.stemWidthRatio;
      const stemHeight = radius * sizes.stemHeightRatio;
      const capRadius = radius * sizes.capRadiusRatio;

      // Draw stem shadow (left side)
      ctx.fillStyle = colors.stemShadow;
      ctx.fillRect(screenX - stemWidth / 2, screenY - stemHeight / 2, stemWidth / 3, stemHeight);

      // Draw stem
      ctx.fillStyle = colors.stemBase;
      ctx.fillRect(screenX - stemWidth / 2, screenY - stemHeight / 2, stemWidth, stemHeight);

      // Draw mushroom cap (ellipse for perspective)
      const capY = screenY - stemHeight * sizes.stemHeightRatio;
      const capColors = colors.capColors;
      const colorIndex = obstacle.colorIndex || 0;
      ctx.fillStyle = capColors[colorIndex % capColors.length];

      ctx.beginPath();
      ctx.ellipse(screenX, capY, capRadius, capRadius * sizes.capHeightRatio, 0, 0, Math.PI * 2);
      ctx.fill();

      // Draw spots on cap
      ctx.fillStyle = colors.spotsColor;
      const spotCount = obstacle?.spotCount ?? sizes.spotsCount;
      for (let i = 0; i < spotCount; i++) {
        const angle = (i / spotCount) * Math.PI * 2;
        const spotDist = capRadius * sizes.spotDistanceRatio;
        const spotX = screenX + Math.cos(angle) * spotDist;
        const spotY = capY + Math.sin(angle) * spotDist * sizes.capHeightRatio;
        const spotRadius = radius * sizes.spotRadiusRatio;

        ctx.beginPath();
        ctx.arc(spotX, spotY, spotRadius, 0, Math.PI * 2);
        ctx.fill();
      }
    };

    /**
     * Draw grass patch with individual blades
     * @param {CanvasRenderingContext2D} ctx - Canvas context
     * @param {number} screenX - Screen X position
     * @param {number} screenY - Screen Y position
     * @param {number} radius - Grass patch radius
     */
    const drawGrass = (ctx, screenX, screenY, radius, obstacle) => {
      const colors = GAME_CONSTANTS.ENTITIES.OBSTACLES.GRASS.colors;
      const sizes = GAME_CONSTANTS.ENTITIES.OBSTACLES.GRASS.sizes;

      const bladeCount = sizes.bladeCount;
      const bladeWidth = sizes.bladeWidth;
      const minHeight = sizes.minHeight;
      const maxHeight = sizes.maxHeight;

      // Draw individual grass blades in fixed positions (using obstacle world coordinates as seed)
      for (let i = 0; i < bladeCount; i++) {
        // Use obstacle position as seed for consistent blade placement
        const angle = (i / bladeCount) * Math.PI * 2;
        const distSeed = ((obstacle.x + obstacle.y + i * 37) % 100) / 100; // Pseudo-random but deterministic
        const dist = distSeed * radius * 0.8;
        const bladeX = screenX + Math.cos(angle) * dist;
        const bladeY = screenY + Math.sin(angle) * dist;

        // Height based on obstacle position for consistency
        const heightSeed = ((obstacle.x + obstacle.y + i * 73) % 100) / 100;
        const bladeHeight = minHeight + heightSeed * (maxHeight - minHeight);

        // Alternate between base, light, and dark colors for variety
        if (i % 3 === 0) {
          ctx.fillStyle = colors.base;
        } else if (i % 3 === 1) {
          ctx.fillStyle = colors.light;
        } else {
          ctx.fillStyle = colors.dark;
        }

        // Draw blade as simple vertical line (thin triangle)
        ctx.beginPath();
        ctx.moveTo(bladeX - bladeWidth / 2, bladeY);
        ctx.lineTo(bladeX + bladeWidth / 2, bladeY);
        ctx.lineTo(bladeX, bladeY - bladeHeight);
        ctx.closePath();
        ctx.fill();
      }
    };

    /**
     * Draw powerup (unified config-driven approach)
     * @param {CanvasRenderingContext2D} ctx - Canvas context
     * @param {Object} powerup - Powerup object
     * @param {number} cameraX - Camera X offset
     * @param {number} cameraY - Camera Y offset
     */
    const drawPowerup = (ctx, powerup, cameraX, cameraY) => {
      if (!powerup.active) return;

      const screenX = powerup.x - cameraX;
      const screenY = powerup.y - cameraY;

      // Draw base circle
      ctx.fillStyle = powerup.powerupType.fillColor;
      ctx.strokeStyle = powerup.powerupType.strokeColor;
      ctx.lineWidth = powerup.powerupType.lineWidth;
      ctx.beginPath();
      ctx.arc(screenX, screenY, powerup.radius, 0, Math.PI * 2);
      ctx.fill();
      ctx.stroke();

      // Draw icon
      powerup.powerupType.drawIcon(ctx, screenX, screenY);
    };

    /**
     * Draw depot (unified function for tranq and ammo depots)
     * @param {CanvasRenderingContext2D} ctx - Canvas context
     * @param {Object} depot - Depot object
     * @param {number} cameraX - Camera X offset
     * @param {number} cameraY - Camera Y offset
     * @param {Object} style - Depot style config (TRANQ or AMMO)
     */
    const drawDepot = (ctx, depot, cameraX, cameraY, style) => {
      if (!depot.active) return;

      const screenX = depot.x - cameraX;
      const screenY = depot.y - cameraY;

      // Draw crate
      ctx.fillStyle = style.fillColor;
      ctx.strokeStyle = style.strokeColor;
      ctx.lineWidth = style.lineWidth;
      ctx.fillRect(screenX - depot.radius, screenY - depot.radius, depot.radius * 2, depot.radius * 2);
      ctx.strokeRect(screenX - depot.radius, screenY - depot.radius, depot.radius * 2, depot.radius * 2);

      // Draw icon
      style.drawIcon(ctx, screenX, screenY);
    };

    /**
     * Draw territory marker (skull emoji and circle outline)
     * @param {CanvasRenderingContext2D} ctx - Canvas context
     * @param {Object} territory - Territory object
     * @param {number} cameraX - Camera X offset
     * @param {number} cameraY - Camera Y offset
     */
    const drawTerritory = (ctx, territory, cameraX, cameraY) => {
      const screenX = territory.x - cameraX;
      const screenY = territory.y - cameraY;

      // Draw skull marker (skip for exit territories)
      if (!territory.isExitTerritory) {
        ctx.fillStyle = '#8B0000';
        ctx.font = '24px Arial';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText(GAME_CONSTANTS.AI.TERRITORY.MARKER_ICON, screenX, screenY);
      }

      // Draw territory circle outline (faint)
      ctx.strokeStyle = 'rgba(139, 0, 0, 0.2)';
      ctx.lineWidth = 2;
      ctx.setLineDash([5, 5]);
      ctx.beginPath();
      ctx.arc(screenX, screenY, territory.radius, 0, Math.PI * 2);
      ctx.stroke();
      ctx.setLineDash([]);
    };

    /**
     * Draw player character with safari gear and rotating gun
     * @param {CanvasRenderingContext2D} ctx - Canvas context
     * @param {Object} player - Player object
     * @param {number} cameraX - Camera X offset
     * @param {number} cameraY - Camera Y offset
     * @param {number} mouseX - Mouse X position (world coordinates)
     * @param {number} mouseY - Mouse Y position (world coordinates)
     * @param {number} speedBoostTimer - Speed boost timer value
     */
    const drawPlayer = (ctx, player, cameraX, cameraY, mouseX, mouseY, speedBoostTimer) => {
      const screenX = player.x - cameraX;
      const screenY = player.y - cameraY - player.jumpHeight;

      // Jump shadow
      if (player.isJumping) {
        ctx.fillStyle = 'rgba(0, 0, 0, 0.3)';
        ctx.beginPath();
        ctx.ellipse(screenX, player.y - cameraY, player.radius * 0.8, player.radius * 0.4, 0, 0, Math.PI * 2);
        ctx.fill();
      }

      // Speed boost glow effect
      if (speedBoostTimer > 0) {
        ctx.fillStyle = 'rgba(0, 229, 255, 0.3)';
        ctx.beginPath();
        ctx.arc(screenX, screenY, player.radius + 5, 0, Math.PI * 2);
        ctx.fill();
      }

      // Zap effect (electric shock animation)
      drawZapEffect(ctx, screenX, screenY, player.radius, player.zapTimer);

      const mouseAngle = Math.atan2(mouseY - player.y, mouseX - player.x);

      ctx.save();
      ctx.translate(screenX, screenY);

      // Apply invincibility flashing effect
      if (isInvincible(player) && Math.floor(player.invincibilityTimer / 5) % 2 === 0) {
        ctx.globalAlpha = 0.5;
      }

      // Body (khaki shirt)
      ctx.fillStyle = '#C3B091';
      ctx.beginPath();
      ctx.arc(0, 2, 12, 0, Math.PI * 2);
      ctx.fill();

      // Head
      ctx.fillStyle = '#F4A460';
      ctx.beginPath();
      ctx.arc(0, -6, 8, 0, Math.PI * 2);
      ctx.fill();

      // Safari hat
      ctx.fillStyle = '#8B7355';
      ctx.beginPath();
      ctx.ellipse(0, -11, 10, 3, 0, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = '#A0826D';
      ctx.beginPath();
      ctx.arc(0, -13, 6, 0, Math.PI * 2);
      ctx.fill();

      // Eyes
      ctx.fillStyle = '#000';
      ctx.beginPath();
      ctx.arc(-2, -7, 1, 0, Math.PI * 2);
      ctx.arc(2, -7, 1, 0, Math.PI * 2);
      ctx.fill();

      // Arms and gun
      ctx.rotate(mouseAngle);

      // Gun
      ctx.fillStyle = '#2F4F4F';
      ctx.fillRect(8, -2, 10, 4);
      ctx.fillStyle = '#696969';
      ctx.fillRect(18, -1, 4, 2);

      // Arms holding gun
      ctx.strokeStyle = '#F4A460';
      ctx.lineWidth = 3;
      ctx.beginPath();
      ctx.moveTo(0, 2);
      ctx.lineTo(8, -2);
      ctx.stroke();
      ctx.beginPath();
      ctx.moveTo(0, 2);
      ctx.lineTo(8, 2);
      ctx.stroke();

      // Hands on gun
      ctx.fillStyle = '#F4A460';
      ctx.beginPath();
      ctx.arc(8, -2, 2.5, 0, Math.PI * 2);
      ctx.arc(8, 2, 2.5, 0, Math.PI * 2);
      ctx.fill();

      // Reset alpha if it was modified
      if (isInvincible(player)) {
        ctx.globalAlpha = 1.0;
      }

      ctx.restore();
    };

    /**
     * Find valid spawn position for dinosaur near target location
     *
     * @param {number} x - Desired X position
     * @param {number} y - Desired Y position
     * @param {number} radius - Entity radius (dinosaur size)
     * @param {Array} obstacles - Array of blocking obstacles
     * @param {Object} game - Game state object
     * @param {number} maxAttempts - Maximum search attempts
     * @returns {Object} Position {x, y} - valid if found, original if not
     *
     * @remarks
     * Localized search pattern for dinosaur spawning:
     *
     * Search strategy:
     * - First checks if initial position is already valid (fast path)
     * - Searches within DINOSAUR_SPAWN_SEARCH_RANGE of desired position
     * - Uses randomCentered for scattered search pattern around spawn point
     * - Maintains dinosaurs near their intended grid positions
     *
     * Why fallback to invalid position is acceptable:
     * - Prevents infinite loops when map is densely packed with obstacles
     * - Dinosaurs have obstacle avoidance AI that navigates them out
     * - Better to spawn stuck dinosaur than crash/hang the game
     * - Visual overlap at spawn quickly resolves as AI kicks in
     * - Grid-based spawning means invalid positions are rare anyway
     *
     * Clamping to bounds:
     * - Prevents dinosaurs spawning outside map edges
     * - Ensures physics/collision systems always have valid positions
     * - Radius padding prevents half-off-screen spawns
     */
    const findValidSpawnPosition = (x, y, radius, obstacles, game, maxAttempts = GAME_CONSTANTS.WORLD.SPAWN.DINOSAURS.SPAWN_MAX_ATTEMPTS) => {
      // Fast path: initial position is valid
      if (!checkObstacleCollision(x, y, radius, obstacles)) {
        return { x, y };
      }

      // Localized search around desired spawn point
      for (let attempt = 0; attempt < maxAttempts; attempt++) {
        const randomX = x + randomCentered(GAME_CONSTANTS.WORLD.SPAWN.DINOSAURS.SPAWN_SEARCH_RANGE);
        const randomY = y + randomCentered(GAME_CONSTANTS.WORLD.SPAWN.DINOSAURS.SPAWN_SEARCH_RANGE);

        // Clamp to map bounds with radius padding
        const clampedX = clamp(randomX, radius, game.mapWidth - radius);
        const clampedY = clamp(randomY, radius, game.mapHeight - radius);

        // Check for collision-free position
        if (!checkObstacleCollision(clampedX, clampedY, radius, obstacles)) {
          return { x: clampedX, y: clampedY };
        }
      }

      // Fallback: return original (dinosaur AI will navigate out)
      return { x, y };
    };

    // ============================================================================
    // COLLISION RESPONSE FUNCTIONS
    // ============================================================================

    /**
     * Push an entity away from a point
     */
    const pushEntityAway = (entity, fromX, fromY, force) => {
      const { dx, dy } = normalize(entity.x - fromX, entity.y - fromY);
      entity.x += dx * force;
      entity.y += dy * force;
    };

    /**
     * Check if entity has active invincibility
     */
    const isInvincible = (entity) => {
      return entity.invincibilityTimer > 0;
    };

    /**
     * Grant temporary invincibility frames to entity
     */
    const grantInvincibility = (entity, frames) => {
      entity.invincibilityTimer = frames;
    };

    /**
     * Handle collision damage between two entities
     * Returns true if damage was applied
     */
    const handleCollisionDamage = (attacker, victim, damage, pushbackForce, invincibilityFrames, soundCallback) => {
      if (isInvincible(victim)) {
        return false;
      }

      victim.health -= damage;
      grantInvincibility(victim, invincibilityFrames);
      pushEntityAway(victim, attacker.x, attacker.y, pushbackForce);

      if (soundCallback) {
        soundCallback('player_hurt');
      }

      return true;
    };

    // ============================================================================
    // GAME LOOP HELPER FUNCTIONS
    // ============================================================================

    /**
     * Update player movement based on input
     *
     * @param {Object} game - Game reference object
     * @param {Object} canvas - Canvas element
     * @param {Object} stateAccumulator - Accumulates state changes to batch updates
     *
     * @remarks
     * Handles keyboard, touch joystick, jump physics, and obstacle collision.
     *
     * Jump-over-obstacle mechanic:
     * - Collision check uses player.jumpHeight parameter
     * - checkObstacleCollision skips check if jumpHeight >= JUMP_CLEAR_HEIGHT
     * - Creates Mario-style jump mechanic without complex collision shapes
     * - Why this approach: simple, predictable, easy for player to understand
     *
     * Touch joystick with variable speed:
     * - JOYSTICK_DEAD_ZONE prevents drift from finger wobble
     * - JOYSTICK_MAX_RANGE caps maximum input distance
     * - speedMultiplier scales with joystick distance (subtle control)
     * - Normalized direction ensures consistent diagonal movement
     */
    const updatePlayerMovement = (game, canvas, stateAccumulator) => {
      // Decrement visual effect timer
      if (game.player.zapTimer > 0) {
        game.player.zapTimer--;
      }

      // Jump physics with gravity
      if (game.player.isJumping) {
        game.player.jumpHeight += game.player.jumpVelocity;
        game.player.jumpVelocity -= GAME_CONSTANTS.CORE.PHYSICS.GRAVITY; // Apply gravity each frame

        // Landing detection
        if (game.player.jumpHeight <= 0) {
          game.player.jumpHeight = 0;
          game.player.jumpVelocity = 0;
          game.player.isJumping = false;
        }
      }

      // Calculate new position
      let newX = game.player.x;
      let newY = game.player.y;

      // Handle keyboard input
      if (game.keys['w']) newY -= game.player.speed;
      if (game.keys['s']) newY += game.player.speed;
      if (game.keys['a']) newX -= game.player.speed;
      if (game.keys['d']) newX += game.player.speed;
      if (game.keys['arrowup']) newY -= game.player.speed;
      if (game.keys['arrowdown']) newY += game.player.speed;
      if (game.keys['arrowleft']) newX -= game.player.speed;
      if (game.keys['arrowright']) newX += game.player.speed;

      // Handle touch joystick input
      if (game.touch.joystick.active) {
        const dx = game.touch.joystick.currentX - game.touch.joystick.startX;
        const dy = game.touch.joystick.currentY - game.touch.joystick.startY;
        const magnitude = Math.sqrt(dx * dx + dy * dy);

        if (magnitude > GAME_CONSTANTS.INPUT.TOUCH.JOYSTICK_DEAD_ZONE) {
          const normalizedDx = dx / magnitude;
          const normalizedDy = dy / magnitude;
          const speedMultiplier = Math.min(magnitude / GAME_CONSTANTS.INPUT.TOUCH.JOYSTICK_MAX_RANGE, 1);

          newX += normalizedDx * game.player.speed * speedMultiplier;
          newY += normalizedDy * game.player.speed * speedMultiplier;
        }
      }

      // Boundary check
      newX = clamp(newX, game.player.radius, game.mapWidth - game.player.radius);
      newY = clamp(newY, game.player.radius, game.mapHeight - game.player.radius);

      // Collision with obstacles (only when not jumping high enough)
      const collided = checkObstacleCollision(newX, newY, game.player.radius, game.obstacles, game.player.jumpHeight);

      if (!collided) {
        game.player.x = newX;
        game.player.y = newY;
      }

      // Update camera
      game.cameraX = clamp(game.player.x - canvas.width / 2, 0, game.mapWidth - canvas.width);
      game.cameraY = clamp(game.player.y - canvas.height / 2, 0, game.mapHeight - canvas.height);
    };

    /**
     * Update player speed modifiers (boost, tar pits, ponds, etc.)
     * @param {Object} game - Game reference object
     * @param {Object} stateAccumulator - Accumulates state changes
     */
    const updatePlayerSpeed = (game, stateAccumulator) => {
      // Check if player is in tar pit
      game.player.inTarPit = false;
      for (const tarPit of game.tarPits) {
        if (circleCollision(game.player.x, game.player.y, game.player.radius, tarPit.x, tarPit.y, tarPit.radius)) {
          game.player.inTarPit = true;
          break;
        }
      }

      // Check if player is in pond
      game.player.inPond = false;
      for (const pond of game.ponds) {
        if (circleCollision(game.player.x, game.player.y, game.player.radius, pond.x, pond.y, pond.radius)) {
          game.player.inPond = true;
          break;
        }
      }

      // Update speed boost timer
      let speedMultiplier = 1;
      if (game.speedBoostTimer > 0) {
        game.speedBoostTimer--;
        speedMultiplier *= GAME_CONSTANTS.ENTITIES.POWERUPS.SPEED.multiplier;
        if (game.speedBoostTimer === 0) {
          stateAccumulator.speedBoostActive = false;
        }
      }

      // Apply tar pit slow effect
      if (game.player.inTarPit) {
        speedMultiplier *= GAME_CONSTANTS.ENTITIES.HAZARDS.TAR_PIT.slowMultiplier;
      }

      // Apply pond slow effect
      if (game.player.inPond) {
        speedMultiplier *= GAME_CONSTANTS.ENTITIES.HAZARDS.POND.slowMultiplier;
      }

      game.player.speed = game.player.baseSpeed * speedMultiplier;
    };

    /**
     * Update hazard interactions (electric fences, etc.)
     * @param {Object} game - Game reference object
     * @param {string} difficulty - Current difficulty level
     * @param {Function} playSound - Sound playing function
     * @param {Object} stateAccumulator - Accumulates state changes
     * @returns {boolean} True if game over
     */
    const updateHazards = (game, difficulty, playSound, stateAccumulator) => {
      // Check electric fence collision with player (can jump over if high enough)
      if (game.player.jumpHeight < GAME_CONSTANTS.CORE.PLAYER.JUMP_CLEAR_HEIGHT) {
        for (const fence of game.electricFences) {
          const fenceType = fence.hazardType;
          if (circleRectCollision(game.player.x, game.player.y, game.player.radius, fence.x, fence.y, fenceType.width, fenceType.height, fence.rotation)) {
            // Damage player with cooldown
            if (fence.playerDamageCooldown <= 0 && game.player.invincibilityTimer <= 0) {
              const diffMod = DIFFICULTY_MODIFIERS[difficulty];
              const invincibilityFrames = Math.round(GAME_CONSTANTS.CORE.COMBAT.INVINCIBILITY_FRAMES * diffMod.invincibilityMultiplier);

              game.player.health -= fenceType.damage;
              stateAccumulator.playerHealth = game.player.health;
              game.player.invincibilityTimer = invincibilityFrames;
              game.player.zapTimer = fenceType.zap.duration;
              fence.playerDamageCooldown = fenceType.damageCooldown;
              playSound(SOUNDS.ELECTRIC_SHOCK);

              // Push player back from fence
              const dx = game.player.x - fence.x;
              const dy = game.player.y - fence.y;
              const pushDist = distance(0, 0, dx, dy);
              if (pushDist > 0) {
                game.player.x += (dx / pushDist) * fenceType.pushbackForce;
                game.player.y += (dy / pushDist) * fenceType.pushbackForce;
              }

              // Check if player died
              if (game.player.health <= 0) {
                transitionToState(GAME_CONSTANTS.CORE.GAME_STATES.LOST, playSound, stateAccumulator);
                return true; // Game over
              }
            }
            break;
          }
        }
      }

      // Update fence cooldowns
      game.electricFences.forEach(fence => {
        if (fence.playerDamageCooldown > 0) {
          fence.playerDamageCooldown--;
        }
      });

      return false; // Not game over
    };

    /**
     * Update powerups and collectibles
     * @param {Object} game - Game reference object
     * @param {string} difficulty - Current difficulty level
     * @param {Function} playSound - Sound playing function
     * @param {Object} stateAccumulator - Accumulates state changes
     */
    const updateCollectibles = (game, difficulty, playSound, stateAccumulator) => {
      // Check powerup collection
      game.powerups.forEach(powerup => {
        if (!powerup.active) return;

        if (circleCollision(game.player.x, game.player.y, game.player.radius, powerup.x, powerup.y, powerup.radius)) {
          powerup.active = false;

          if (powerup.powerupType === GAME_CONSTANTS.ENTITIES.POWERUPS.HEALTH) {
            if (game.player.health < game.player.maxHealth) {
              game.player.health++;
              stateAccumulator.playerHealth = game.player.health;
            }
            playSound(SOUNDS.PICKUP_HEALTH);
          } else if (powerup.powerupType === GAME_CONSTANTS.ENTITIES.POWERUPS.SPEED) {
            game.speedBoostTimer = powerup.powerupType.durationFrames;
            stateAccumulator.speedBoostActive = true;
            playSound(SOUNDS.PICKUP_SPEED);
          }
        }
      });

      // Check tranquilizer depot collection
      game.tranqDepots.forEach(depot => {
        if (!depot.active) return;

        if (circleCollision(game.player.x, game.player.y, game.player.radius, depot.x, depot.y, depot.radius)) {
          depot.active = false;
          game.player.tranqAmmo += depot.ammo;
          stateAccumulator.playerTranqAmmo = game.player.tranqAmmo;
          playSound(SOUNDS.PICKUP_TRANQ);
          game.floatingTexts.push(createFloatingText(depot.x, depot.y, `+${depot.ammo}`, '#00FF00'));
        }
      });

      // Check regular ammo depot collection
      game.ammoDepots.forEach(depot => {
        if (!depot.active) return;

        if (circleCollision(game.player.x, game.player.y, game.player.radius, depot.x, depot.y, depot.radius)) {
          depot.active = false;
          game.player.ammo += depot.amount;
          stateAccumulator.playerAmmo = game.player.ammo;
          playSound(SOUNDS.PICKUP_AMMO);
          game.floatingTexts.push(createFloatingText(depot.x, depot.y, `+${depot.amount}`, '#FFD700'));
        }
      });

      // Update ammo pickups (using instance method)
      game.ammoPickups = game.ammoPickups.filter(pickup =>
        pickup.update(game.player, difficulty, playSound, stateAccumulator, createFloatingText)
      );

      // Apply accumulated floating texts
      if (stateAccumulator.floatingTexts) {
        game.floatingTexts.push(...stateAccumulator.floatingTexts);
      }
    };

    /**
     * Update bullets and handle bullet-dinosaur collisions
     * @param {Object} game - Game reference object
     * @param {Function} playSound - Sound playing function
     * @param {Object} stateAccumulator - Accumulates state changes
     */
    const updateBullets = (game, playSound, stateAccumulator) => {
      game.bullets = game.bullets.filter(bullet => {
        // Use instance method for physics update
        if (!bullet.update(game.mapWidth, game.mapHeight)) {
          return false; // Remove if out of bounds
        }

        // Check collision with dinosaurs
        for (let i = 0; i < game.dinosaurs.length; i++) {
          const dino = game.dinosaurs[i];

          if (circleCollision(bullet.x, bullet.y, bullet.radius, dino.x, dino.y, dino.size)) {
            if (bullet.weaponType === GAME_CONSTANTS.ENTITIES.WEAPONS.TRANQUILIZER) {
              // Tranquilizer dart
              if (!dino.isSleeping) {
                dino.tranqHits++;
                playSound(SOUNDS.TRANQ_HIT);

                const shotsNeeded = dino.type.tranqShots;
                game.floatingTexts.push(createFloatingText(dino.x, dino.y - dino.size, `${dino.tranqHits}/${shotsNeeded}`, '#00FF00'));

                if (dino.tranqHits >= shotsNeeded) {
                  dino.isSleeping = true;
                  dino.sleepTimer = dino.type.sleepDuration;

                  const tranqPoints = Math.round(dino.points * bullet.weaponType.scoreMultiplier);
                  stateAccumulator.score = (stateAccumulator.score || 0) + tranqPoints;
                  game.floatingTexts.push(createFloatingText(dino.x, dino.y - dino.size - 20, `+${tranqPoints} SLEEP`, '#00E5FF'));
                }
              }
            } else {
              // Regular bullet
              dino.health--;
              playSound(SOUNDS.HIT);

              if (dino.health <= 0) {
                // Spawn single ammo pickup that restores all ammo at once (at dinosaur's feet)
                const groundY = dino.y + dino.size; // Spawn at dinosaur's bottom
                game.ammoPickups.push(createAmmoPickup(dino.x, groundY, groundY, dino.maxHealth));

                stateAccumulator.score = (stateAccumulator.score || 0) + dino.points;
                game.floatingTexts.push(createFloatingText(dino.x, dino.y - dino.size, `+${dino.points}`, '#FFD700'));

                // Territory cleanup on dinosaur death
                // Complex logic handles both normal territories and exit guard territories
                if (dino.territorial && dino.territoryIndex !== undefined) {
                  const territory = game.territories[dino.territoryIndex];
                  let shouldRemoveTerritory = false;

                  // Exit territory special case: multiple guards share one territory
                  if (territory && territory.isExitTerritory) {
                    territory.guardCount--;

                    // All guards defeated: unlock exit and remove territory
                    // Why guard counting:
                    // - Multiple dinosaurs guard single exit territory
                    // - Exit should only unlock when ALL guards dead
                    // - Territory persists until last guard falls
                    // - Creates "defend the gate" mechanic for final challenge
                    if (territory.guardCount === 0) {
                      if (game.exit) game.exit.locked = false;
                      shouldRemoveTerritory = true;
                    }
                  } else {
                    // Normal territory: 1:1 mapping with dinosaur, always removed
                    shouldRemoveTerritory = true;
                  }

                  // Territory removal with index management
                  if (shouldRemoveTerritory) {
                    game.territories.splice(dino.territoryIndex, 1);

                    // Critical: update territoryIndex for all remaining dinosaurs
                    // Why this is necessary:
                    // - territoryIndex stores array position, not ID
                    // - Splicing shifts all subsequent indices down by 1
                    // - Without update, dinosaurs would reference wrong territories
                    // - Only affects dinosaurs with index > removed index
                    game.dinosaurs.forEach(d => {
                      if (d.territorial && d.territoryIndex !== undefined && d.territoryIndex > dino.territoryIndex) {
                        d.territoryIndex--;
                      }
                    });
                  }
                }

                game.dinosaurs.splice(i, 1);
                playSound(SOUNDS.DEATH);
              }
            }
            return false; // Remove bullet
          }
        }

        return true; // Keep bullet
      });
    };

    /**
     * Update spit projectiles
     * @param {Object} game - Game reference object
     * @param {string} difficulty - Current difficulty level
     * @param {Function} playSound - Sound playing function
     * @param {Object} stateAccumulator - Accumulates state changes
     * @returns {boolean} True if game over
     */
    const updateSpitProjectiles = (game, difficulty, playSound, stateAccumulator) => {
      game.spit = game.spit.filter(spit => {
        // Use instance method for physics update
        if (!spit.update(game.mapWidth, game.mapHeight)) {
          return false; // Remove if out of bounds
        }

        // Check collision with player
        if (circleCollision(spit.x, spit.y, spit.radius, game.player.x, game.player.y, game.player.radius)) {
          if (!isInvincible(game.player)) {
            const diffMod = DIFFICULTY_MODIFIERS[difficulty];
            const invincibilityFrames = Math.round(GAME_CONSTANTS.CORE.COMBAT.INVINCIBILITY_FRAMES * diffMod.invincibilityMultiplier);

            game.player.health -= spit.damage;
            grantInvincibility(game.player, invincibilityFrames);
            stateAccumulator.playerHealth = game.player.health;
            playSound(SOUNDS.PLAYER_HURT);

            if (game.player.health <= 0) {
              transitionToState(GAME_CONSTANTS.CORE.GAME_STATES.LOST, playSound, stateAccumulator);
              return false; // Game over
            }
          }
          return false;
        }

        return true;
      });

      return game.player.health > 0; // Return false if game over
    };

    /**
     * Mixin: Creates a navigating entity with hazard avoidance capabilities
     *
     * @param {number} x - Initial X position
     * @param {number} y - Initial Y position
     * @param {number} radius - Entity collision radius
     * @param {Object} avoidanceConfig - Configuration object with detectionRange and steeringAngle
     * @returns {Object} Entity with navigation and avoidance methods
     *
     * @remarks
     * Mixin pattern for shared navigation behavior across entity types.
     *
     * Properties provided by mixin:
     * - x, y, radius, vx, vy, avoidanceConfig
     * - Methods: getAvoidancePosition, getHazardsToCheck, calculateAvoidanceAngle,
     *   checkEscapeFromHazard, isHazardAhead, checkHazardsAhead, applyAvoidance
     *
     * Required properties (must be added by factory after spreading mixin):
     * - state: Current AI state object (must have avoidsHazards, speedMultiplier?, directionDuration?)
     * - motionAngle: Current movement direction in radians
     * - speed: Current movement speed
     * - fleeDurationTimer: (optional) Timer for FLEE state persistence
     *
     * Why mixin instead of classes:
     * - Preserves existing factory function architecture
     * - No inheritance complexity
     * - Easy to compose with other entity properties
     * - Incremental adoption (can mix into existing factories one at a time)
     *
     * Usage in factory functions:
     * ```javascript
     * const createDinosaur = (...) => {
     *   const dino = {
     *     ...createNavigatingEntity(x, y, size, HAZARD_AVOIDANCE),
     *     // Required properties for applyAvoidance to work
     *     state: GAME_CONSTANTS.AI.STATES.PATROL,
     *     motionAngle: Math.random() * Math.PI * 2,
     *     speed, health, type, aggressive, ...
     *   };
     *
     *   // Override methods to customize behavior
     *   dino.getHazardsToCheck = function(game) {
     *     return [...game.tarPits, ...game.ponds]; // Dinos only avoid these
     *   };
     *
     *   return dino;
     * };
     * ```
     *
     * Customization points (override in factory):
     * - getAvoidancePosition() - where to check for hazards
     * - getHazardsToCheck(game) - what hazards to avoid
     * - calculateAvoidanceAngle(hazard) - how to steer around hazards
     * - checkEscapeFromHazard(game) - how to escape when stuck inside
     */
    const createNavigatingEntity = (x, y, radius, avoidanceConfig) => {
      return {
        x,
        y,
        radius,
        vx: 0,
        vy: 0,
        avoidanceConfig,

        /**
         * Get position to check for hazards (ahead of entity)
         * Override for different checking strategies
         */
        getAvoidancePosition() {
          const angle = Math.atan2(this.vy, this.vx);
          return {
            x: this.x + Math.cos(angle) * this.avoidanceConfig.detectionRange,
            y: this.y + Math.sin(angle) * this.avoidanceConfig.detectionRange
          };
        },

        /**
         * Get list of hazards this entity should avoid
         * Override to customize what each entity type avoids
         * @param {Object} game - Game state object
         * @returns {Array} Array of hazard objects
         */
        getHazardsToCheck(game) {
          // Default: avoid all hazards
          return [
            ...game.obstacles,
            ...game.tarPits,
            ...game.ponds,
            ...game.electricFences
          ];
        },

        /**
         * Calculate avoidance angle using cross product (smart steering)
         * Override for different steering strategies
         * @param {Object} hazard - Hazard object with x, y properties
         * @returns {number} Angle to steer in radians
         */
        calculateAvoidanceAngle(hazard) {
          const toHazardX = hazard.x - this.x;
          const toHazardY = hazard.y - this.y;

          // Cross product determines which side hazard is on
          const cross = this.vx * toHazardY - this.vy * toHazardX;
          const steerDirection = cross > 0 ? 1 : -1;

          const angle = Math.atan2(this.vy, this.vx);
          return angle + (this.avoidanceConfig.steeringAngle * steerDirection);
        },

        /**
         * Check if entity is inside a hazard and needs to escape
         * @param {Object} game - Game state object
         * @returns {number|null} Escape angle or null if not stuck
         */
        checkEscapeFromHazard(game) {
          for (const hazard of this.getHazardsToCheck(game)) {
            // Check if hazard is circular (has radius)
            if (hazard.radius !== undefined) {
              if (circleCollision(this.x, this.y, this.radius, hazard.x, hazard.y, hazard.radius)) {
                // Steer directly away from hazard center
                return Math.atan2(this.y - hazard.y, this.x - hazard.x);
              }
            }
          }
          return null;
        },

        /**
         * Test if hazard is in path at check position
         * @param {Object} checkPos - Position to check {x, y}
         * @param {Object} hazard - Hazard object
         * @returns {boolean} True if hazard detected at check position
         */
        isHazardAhead(checkPos, hazard) {
          if (hazard.rotation !== undefined) {
            // Electric fence (rectangle)
            return circleRectCollision(
              checkPos.x, checkPos.y, this.radius,
              hazard.x, hazard.y, hazard.hazardType.width, hazard.hazardType.height, hazard.rotation
            );
          } else {
            // Circular hazard
            return circleCollision(checkPos.x, checkPos.y, this.radius, hazard.x, hazard.y, hazard.radius);
          }
        },

        /**
         * Check for hazards ahead and return avoidance angle
         * @param {Object} game - Game state object
         * @returns {number|null} Avoidance angle or null if no hazards detected
         *
         * @remarks
         * Two-phase detection system:
         * 1. Escape: If currently inside hazard, steer directly away from center
         * 2. Avoidance: If hazard ahead, use smart steering to navigate around it
         */
        checkHazardsAhead(game) {
          // Phase 1: Check if stuck inside a hazard (escape mode)
          const escapeAngle = this.checkEscapeFromHazard(game);
          if (escapeAngle !== null) return escapeAngle;

          // Phase 2: Check hazards ahead (avoidance mode)
          const checkPos = this.getAvoidancePosition();
          const hazards = this.getHazardsToCheck(game);

          for (const hazard of hazards) {
            if (this.isHazardAhead(checkPos, hazard)) {
              return this.calculateAvoidanceAngle(hazard);
            }
          }

          return null; // No hazards detected
        },

        /**
         * Apply avoidance by updating motionAngle and velocity
         * State-aware method that adjusts speed and timers based on current AI state
         * @param {Object} game - Game state object
         *
         * @remarks
         * State-aware behavior using this.state:
         * - Checks state.avoidsHazards to determine if avoidance should occur
         * - Uses state.speedMultiplier for state-appropriate movement speed
         * - Resets fleeDurationTimer using state.directionDuration if present
         *
         * Configuration-driven approach allows states to opt-in/out of avoidance:
         * - PATROL: avoidsHazards=true (natural wandering)
         * - FLEE: avoidsHazards=true (prevent getting trapped)
         * - CHASE: avoidsHazards=false (dramatic gameplay)
         * - TERRITORY_RETURN: avoidsHazards=false (quick return to territory)
         */
        applyAvoidance(game) {
          // Early exit if state doesn't support hazard avoidance
          if (!this.state || !this.state.avoidsHazards) {
            return;
          }

          const avoidanceAngle = this.checkHazardsAhead(game);
          if (avoidanceAngle !== null) {
            this.motionAngle = avoidanceAngle;

            // Calculate speed based on state
            let speed = this.speed;
            if (this.state.speedMultiplier !== undefined) {
              speed = this.speed * this.state.speedMultiplier;
            }

            this.vx = Math.cos(this.motionAngle) * speed;
            this.vy = Math.sin(this.motionAngle) * speed;

            // State-specific timer handling
            if (this.state.directionDuration !== undefined && this.fleeDurationTimer !== undefined) {
              // FLEE state: reset timer to maintain persistent direction
              this.fleeDurationTimer = this.state.directionDuration;
            }
          }
        }
      };
    };

    /**
     * Update dinosaur AI behavior and movement
     *
     * @param {Object} dino - Dinosaur object
     * @param {Object} player - Player object
     * @param {Object} game - Game state object
     * @param {string} difficulty - Current difficulty setting
     *
     * @remarks
     * Three-branch AI system based on dinosaur personality:
     *
     * 1. Territorial AI (Triceratops, Dilophosaurus):
     *    - Defends fixed territory, returns to center when player leaves
     *    - State machine: PATROL → CHASE → TERRITORY_RETURN
     *    - Uses different return thresholds based on current state (prevents oscillation)
     *    - TERRITORY_MARGIN allows some buffer before aggro triggers
     *
     * 2. Aggressive AI (T-Rex, Velociraptor):
     *    - Chases player when in aggro range, patrols otherwise
     *    - Simpler state machine: PATROL ↔ CHASE
     *    - No territory constraints, can chase across entire map
     *
     * 3. Herbivore AI (Parasaurolophus, Stegosaurus):
     *    - Flees from player when too close
     *    - Increased speed during FLEE state (panic behavior)
     *    - Otherwise patrols randomly
     *
     * Why different return thresholds for territorial dinosaurs:
     * - TERRITORY_RETURN_THRESHOLD_RETURNING: 1.5x (larger when already returning)
     * - TERRITORY_RETURN_THRESHOLD_ACTIVE: 2.0x (smaller when active/chasing)
     * - Prevents rapid state flipping at territory edge (hysteresis pattern)
     * - Creates smoother, more believable AI behavior
     *
     * Patrol mechanics:
     * - Random angle adjustment each frame creates wandering behavior
     * - PATROL_SPEED_MULTIPLIER (0.3) makes patrol slower than chase/flee
     * - Gives player time to strategize and plan approaches
     */
    const updateDinosaurAI = (dino, player, game, difficulty) => {
      const dist = distance(dino.x, dino.y, player.x, player.y);
      const diffMod = DIFFICULTY_MODIFIERS[difficulty];

      // Apply difficulty scaling to base speed
      dino.speed = dino.baseSpeed * diffMod.enemySpeedMultiplier;

      if (dino.territorial) {
        // Territorial AI: defend territory, return to center
        const distFromTerritory = distance(dino.x, dino.y, dino.territoryX, dino.territoryY);
        const playerDistFromTerritory = distance(player.x, player.y, dino.territoryX, dino.territoryY);

        const territoryMargin = GAME_CONSTANTS.AI.TERRITORY.MARGIN;
        // Hysteresis: different thresholds based on current state prevents oscillation
        const returnThreshold = dino.state === GAME_CONSTANTS.AI.STATES.TERRITORY_RETURN
          ? GAME_CONSTANTS.AI.TERRITORY.RETURN_THRESHOLD_RETURNING
          : GAME_CONSTANTS.AI.TERRITORY.RETURN_THRESHOLD_ACTIVE;

        if (playerDistFromTerritory < dino.territoryRadius + territoryMargin && dist < GAME_CONSTANTS.AI.TERRITORY.AGGRO_RANGE) {
          // Chase: player invaded territory
          dino.state = GAME_CONSTANTS.AI.STATES.CHASE;
          const { dx, dy } = normalize(player.x - dino.x, player.y - dino.y);
          dino.vx = dx * dino.speed;
          dino.vy = dy * dino.speed;

          // Ranged attack capability (if dinosaur has spitAttack)
          if (dino.type.spitAttack && dist < dino.type.spitAttack.range && dino.spitCooldown <= 0) {
            game.spit.push(createSpitProjectile(dino.x, dino.y, player.x, player.y, dino.type));
            dino.spitCooldown = dino.type.spitAttack.cooldown;
          }
        } else if (distFromTerritory > dino.territoryRadius * returnThreshold) {
          // Return: strayed too far from territory center
          dino.state = GAME_CONSTANTS.AI.STATES.TERRITORY_RETURN;
          const { dx, dy } = normalize(dino.territoryX - dino.x, dino.territoryY - dino.y);
          dino.vx = dx * dino.speed;
          dino.vy = dy * dino.speed;
        } else {
          // Patrol: calm state, wander near territory
          dino.state = GAME_CONSTANTS.AI.STATES.PATROL;
          dino.motionAngle += randomCentered(GAME_CONSTANTS.AI.STATES.PATROL.angleChangeRate);
          dino.vx = Math.cos(dino.motionAngle) * dino.speed * GAME_CONSTANTS.AI.STATES.PATROL.speedMultiplier;
          dino.vy = Math.sin(dino.motionAngle) * dino.speed * GAME_CONSTANTS.AI.STATES.PATROL.speedMultiplier;
        }

        // Tick down spit attack cooldown
        if (dino.spitCooldown > 0) {
          dino.spitCooldown--;
        }
      } else if (dino.aggressive) {
        // Aggressive AI: chase player in range, patrol otherwise
        if (dist < dino.aggroRange) {
          dino.state = GAME_CONSTANTS.AI.STATES.CHASE;
          const { dx, dy } = normalize(player.x - dino.x, player.y - dino.y);
          dino.vx = dx * dino.speed;
          dino.vy = dy * dino.speed;
        } else {
          dino.state = GAME_CONSTANTS.AI.STATES.PATROL;
          dino.motionAngle += randomCentered(GAME_CONSTANTS.AI.STATES.PATROL.angleChangeRate);
          dino.vx = Math.cos(dino.motionAngle) * dino.speed * GAME_CONSTANTS.AI.STATES.PATROL.speedMultiplier;
          dino.vy = Math.sin(dino.motionAngle) * dino.speed * GAME_CONSTANTS.AI.STATES.PATROL.speedMultiplier;
        }
      } else {
        // Herbivore AI: flee from player when close with persistent direction
        if (dist < dino.fleeRange) {
          // Entering or continuing flee state
          const wasAlreadyFleeing = dino.state === GAME_CONSTANTS.AI.STATES.FLEE;
          dino.state = GAME_CONSTANTS.AI.STATES.FLEE;
          dino.speed = dino.baseSpeed * GAME_CONSTANTS.AI.STATES.FLEE.speedMultiplier * diffMod.enemySpeedMultiplier;

          // Set or update flee direction with persistence to prevent oscillation
          if (!wasAlreadyFleeing || dino.fleeDurationTimer <= 0) {
            // New flee or timer expired - recalculate flee direction away from player
            // Always flee directly away from current player position (no "return to original path")
            const { dx, dy } = normalize(dino.x - player.x, dino.y - player.y);
            dino.motionAngle = Math.atan2(dy, dx);
            dino.fleeDurationTimer = GAME_CONSTANTS.AI.STATES.FLEE.directionDuration;
          }

          // Maintain persistent flee direction
          dino.vx = Math.cos(dino.motionAngle) * dino.speed;
          dino.vy = Math.sin(dino.motionAngle) * dino.speed;

          dino.fleeDurationTimer--;
        } else {
          // Return to patrol when player is far enough
          dino.state = GAME_CONSTANTS.AI.STATES.PATROL;
          dino.fleeDurationTimer = 0; // Reset timer
          // Add slight random variation to motion angle for natural patrol behavior
          dino.motionAngle += randomCentered(GAME_CONSTANTS.AI.STATES.PATROL.angleChangeRate);
          dino.vx = Math.cos(dino.motionAngle) * dino.speed * GAME_CONSTANTS.AI.STATES.PATROL.speedMultiplier;
          dino.vy = Math.sin(dino.motionAngle) * dino.speed * GAME_CONSTANTS.AI.STATES.PATROL.speedMultiplier;
        }
      }

      // Hazard avoidance - method checks state.avoidsHazards internally
      dino.applyAvoidance(game);
    };

    /**
     * Update all dinosaurs (AI, movement, collisions, sleep state)
     * @param {Object} game - Game reference object
     * @param {string} difficulty - Current difficulty level
     * @param {Function} playSound - Sound playing function
     * @param {Object} stateAccumulator - Accumulates state changes
     * @returns {boolean} True if game over
     */
    const updateDinosaurs = (game, difficulty, playSound, stateAccumulator) => {
      const diffMod = DIFFICULTY_MODIFIERS[difficulty];

      for (const dino of game.dinosaurs) {
        // Update timers
        if (dino.zapTimer > 0) dino.zapTimer--;

        // Update fence avoidance memory
        dino.avoidFences = dino.avoidFences.filter(af => {
          af.timer--;
          return af.timer > 0;
        });

        // Update sleep state
        if (dino.isSleeping) {
          dino.sleepTimer--;
          if (dino.sleepTimer <= 0) {
            dino.isSleeping = false;
            dino.sleepTimer = 0;
            dino.tranqHits = 0;
          }
          dino.vx = 0;
          dino.vy = 0;
          continue; // Sleeping dinosaurs don't move
        }

        // Update AI behavior
        updateDinosaurAI(dino, game.player, game, difficulty);

        // Check if in tar pit
        let dinoInTarPit = false;
        for (const tarPit of game.tarPits) {
          if (circleCollision(dino.x, dino.y, dino.size, tarPit.x, tarPit.y, tarPit.radius)) {
            dinoInTarPit = true;
            break;
          }
        }

        // Check if in pond
        let dinoInPond = false;
        for (const pond of game.ponds) {
          if (circleCollision(dino.x, dino.y, dino.size, pond.x, pond.y, pond.radius)) {
            dinoInPond = true;
            break;
          }
        }

        // Apply tar pit and pond slow effects
        let effectiveVx = dino.vx;
        let effectiveVy = dino.vy;
        if (dinoInTarPit) {
          effectiveVx *= GAME_CONSTANTS.ENTITIES.HAZARDS.TAR_PIT.slowMultiplier;
          effectiveVy *= GAME_CONSTANTS.ENTITIES.HAZARDS.TAR_PIT.slowMultiplier;
        }
        if (dinoInPond) {
          effectiveVx *= GAME_CONSTANTS.ENTITIES.HAZARDS.POND.slowMultiplier;
          effectiveVy *= GAME_CONSTANTS.ENTITIES.HAZARDS.POND.slowMultiplier;
        }

        // Calculate new position
        let newDinoX = dino.x + effectiveVx;
        let newDinoY = dino.y + effectiveVy;

        // Obstacle avoidance - perpendicular steering algorithm
        // Tests left and right perpendicular directions to find clear path
        let dinoCollided = false;
        for (const obs of game.obstacles) {
          if (circleCollision(newDinoX, newDinoY, dino.size, obs.x, obs.y, obs.radius)) {
            dinoCollided = true;

            // Calculate perpendicular steering directions
            // Why ±90°: perpendicular to current velocity creates natural "steering around" motion
            // Alternative approaches (reversing, random angles) look unnatural or get stuck
            const angle = Math.atan2(dino.vy, dino.vx);
            const avoidAngleLeft = angle + Math.PI / 2;   // 90° counter-clockwise
            const avoidAngleRight = angle - Math.PI / 2;  // 90° clockwise

            // Test positions at perpendicular angles (2x size for safety margin)
            const avoidDistX = Math.cos(avoidAngleLeft) * dino.size * 2;
            const avoidDistY = Math.sin(avoidAngleLeft) * dino.size * 2;
            const testLeftX = dino.x + avoidDistX;
            const testLeftY = dino.y + avoidDistY;

            const avoidDistXRight = Math.cos(avoidAngleRight) * dino.size * 2;
            const avoidDistYRight = Math.sin(avoidAngleRight) * dino.size * 2;
            const testRightX = dino.x + avoidDistXRight;
            const testRightY = dino.y + avoidDistYRight;

            // Check which directions are clear
            const leftClear = !checkObstacleCollision(testLeftX, testLeftY, dino.size, game.obstacles);
            const rightClear = !checkObstacleCollision(testRightX, testRightY, dino.size, game.obstacles);

            // Priority: favor single clear path, randomize when both clear
            if (leftClear && !rightClear) {
              // Only left is clear - go left
              newDinoX = testLeftX;
              newDinoY = testLeftY;
              dinoCollided = false;
            } else if (rightClear && !leftClear) {
              // Only right is clear - go right
              newDinoX = testRightX;
              newDinoY = testRightY;
              dinoCollided = false;
            } else if (leftClear && rightClear) {
              // Both clear - random choice prevents predictable patterns
              const choice = Math.random() > 0.5;
              newDinoX = choice ? testLeftX : testRightX;
              newDinoY = choice ? testLeftY : testRightY;
              dinoCollided = false;
            }
            // If neither clear: dinoCollided stays true, dinosaur stops
            break;
          }
        }

        // Electric fence collision with learning/memory system
        // Dinosaurs "learn" to avoid fences after getting zapped
        for (const fence of game.electricFences) {
          const fenceType = fence.hazardType;

          // Check if dinosaur remembers this specific fence from previous collision
          const rememberedFence = dino.avoidFences.find(af => af.fence === fence);

          if (rememberedFence) {
            // Proactive avoidance: steer away before collision
            // Why this improves pathfinding:
            // - Dinosaurs learn from mistakes (feels intelligent)
            // - Reduces getting stuck bouncing against fences
            // - Creates natural "cautious" behavior near hazards
            const fenceDist = distance(newDinoX, newDinoY, fence.x, fence.y);
            if (fenceDist < fenceType.width + fenceType.memory.avoidanceBuffer) {
              const { dx, dy } = normalize(newDinoX - fence.x, newDinoY - fence.y);
              newDinoX += dx * fenceType.memory.avoidanceBuffer;
              newDinoY += dy * fenceType.memory.avoidanceBuffer;
            }
          }

          // Collision detection and response
          if (circleRectCollision(newDinoX, newDinoY, dino.size, fence.x, fence.y, fenceType.width, fenceType.height, fence.rotation)) {
            // Pushback force - bounce dinosaur away from fence
            const dx = newDinoX - fence.x;
            const dy = newDinoY - fence.y;
            const pushDist = distance(0, 0, dx, dy);
            if (pushDist > 0) {
              dino.x = dino.x + (dx / pushDist) * fenceType.pushbackForce;
              dino.y = dino.y + (dy / pushDist) * fenceType.pushbackForce;
            }

            // Stun dinosaur (reuses sleep state machinery)
            dino.isSleeping = true;
            dino.sleepTimer = Math.round(dino.type.sleepDuration * fenceType.stunDurationMultiplier);
            dino.zapTimer = fenceType.zap.duration; // Visual effect

            // Memory system: remember this fence to avoid it in future
            // Memory has duration timer that decays (dinosaurs "forget" over time)
            dino.avoidFences.push({
              fence: fence,  // Reference to specific fence instance
              timer: fenceType.memory.duration
            });

            // Spatial audio: only play sound if zap happens near player
            if (distance(dino.x, dino.y, game.player.x, game.player.y) < fenceType.zap.soundMaxDistance) {
              playSound(SOUNDS.ELECTRIC_SHOCK);
            }

            dinoCollided = true;
            break;
          }
        }

        // Update position and facing direction
        if (!dinoCollided) {
          dino.x = newDinoX;
          dino.y = newDinoY;
        }

        // Update facing direction
        if (Math.abs(effectiveVx) > GAME_CONSTANTS.AI.FACING_DIRECTION_THRESHOLD) {
          dino.facingLeft = effectiveVx < 0;
        }

        // Update animation properties
        const velocity = Math.sqrt(dino.vx * dino.vx + dino.vy * dino.vy);
        if (velocity > GAME_CONSTANTS.VISUALS.ANIMATION.MIN_VELOCITY_THRESHOLD) {
          // Moving - animate legs
          dino.animationFrame += velocity * GAME_CONSTANTS.VISUALS.ANIMATION.SPEED_MULTIPLIER;
          dino.legCycle = Math.sin(dino.animationFrame);
        } else {
          // Stationary - reset animation to neutral pose
          dino.animationFrame = 0;
          dino.legCycle = 0;
        }

        // Clamp to bounds
        const preClampX = dino.x;
        const preClampY = dino.y;
        dino.x = clamp(dino.x, dino.size, game.mapWidth - dino.size);
        dino.y = clamp(dino.y, dino.size, game.mapHeight - dino.size);

        // Boundary bounce for PATROL and FLEE states
        // When dinosaurs hit map edges, bounce them away to prevent getting stuck
        // Chase/Return states recalculate direction each frame, so they don't need this
        if (dino.state === GAME_CONSTANTS.AI.STATES.PATROL || dino.state === GAME_CONSTANTS.AI.STATES.FLEE) {
          const hitLeftOrRight = preClampX !== dino.x;
          const hitTopOrBottom = preClampY !== dino.y;

          if (hitLeftOrRight || hitTopOrBottom) {
            // Reflect velocity away from boundary
            if (hitLeftOrRight) dino.vx = -dino.vx;
            if (hitTopOrBottom) dino.vy = -dino.vy;

            // Update motion angle based on reflected velocity
            dino.motionAngle = Math.atan2(dino.vy, dino.vx);

            // FLEE state: reset timer for persistent flee direction
            if (dino.state === GAME_CONSTANTS.AI.STATES.FLEE) {
              dino.fleeDurationTimer = GAME_CONSTANTS.AI.STATES.FLEE.directionDuration;
            }
          }
        }

        // Check collision with player (only aggressive dinosaurs and not sleeping)
        if (dino.aggressive && !dino.isSleeping) {
          if (circleCollision(dino.x, dino.y, dino.size, game.player.x, game.player.y, game.player.radius)) {
            if (!isInvincible(game.player)) {
              const invincibilityFrames = Math.round(GAME_CONSTANTS.CORE.COMBAT.INVINCIBILITY_FRAMES * diffMod.invincibilityMultiplier);
              game.player.health -= GAME_CONSTANTS.CORE.COMBAT.DINOSAUR_DAMAGE;
              grantInvincibility(game.player, invincibilityFrames);
              pushEntityAway(game.player, dino.x, dino.y, GAME_CONSTANTS.CORE.COMBAT.PUSHBACK_FORCE);
              stateAccumulator.playerHealth = game.player.health;
              playSound(SOUNDS.PLAYER_HURT);

              if (game.player.health <= 0) {
                transitionToState(GAME_CONSTANTS.CORE.GAME_STATES.LOST, playSound, stateAccumulator);
                return true; // Game over
              }
            }
          }
        }
      }

      // Update player invincibility
      if (game.player.invincibilityTimer > 0) {
        game.player.invincibilityTimer--;
      }

      // Update floating texts (using instance method)
      game.floatingTexts = game.floatingTexts.filter(text => text.update());

      return false; // Not game over

        const soundId = sound?.id || sound;

          // Clone the audio element for simultaneous playback
          const audio = soundData.cloneNode();

          // Clean up after playing

        soundsRef.current = sounds;
