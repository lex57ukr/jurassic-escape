              // Eye (gentle herbivore)
              ctx.fillStyle = '#FFF';
              ctx.beginPath();
              ctx.arc(32 * scale, -2 * scale, 3 * scale, 0, Math.PI * 2);
              ctx.fill();
              ctx.fillStyle = '#000';
              ctx.beginPath();
              ctx.arc(33 * scale, -2 * scale, 1.5 * scale, 0, Math.PI * 2);
              ctx.fill();

              // Nostril
              ctx.fillStyle = '#4A148C';
              ctx.beginPath();
              ctx.arc(36 * scale, 1 * scale, 1.5 * scale, 0, Math.PI * 2);
              ctx.fill();

              // Beak-like mouth
              ctx.strokeStyle = '#4A148C';
              ctx.lineWidth = 2;
              ctx.beginPath();
              ctx.arc(34 * scale, 3 * scale, 3 * scale, 0, Math.PI);
              ctx.stroke();

            } else if (dino.type === 'para') {
              // Parasaurolophus - duck-billed herbivore with distinctive head crest
              const scale = dino.size / 25;

              // Tail
              ctx.fillStyle = '#D2691E';
              ctx.beginPath();
              ctx.moveTo(-12 * scale, 0);
              ctx.quadraticCurveTo(-25 * scale, 2 * scale, -35 * scale, 0);
              ctx.lineTo(-33 * scale, 2 * scale);
              ctx.quadraticCurveTo(-23 * scale, 4 * scale, -12 * scale, 2 * scale);
              ctx.fill();

              // Hind legs
              ctx.fillStyle = '#CD853F';
              ctx.fillRect(-10 * scale, 8 * scale, 5 * scale, 10 * scale);
              ctx.fillRect(-2 * scale, 8 * scale, 5 * scale, 10 * scale);

              // Front legs
              ctx.fillRect(8 * scale, 10 * scale, 4 * scale, 8 * scale);
              ctx.fillRect(14 * scale, 10 * scale, 4 * scale, 8 * scale);

              // Body
              ctx.fillStyle = '#DEB887';
              ctx.beginPath();
              ctx.ellipse(0, 0, 20 * scale, 12 * scale, 0, 0, Math.PI * 2);
              ctx.fill();

              // Belly
              ctx.fillStyle = '#F4A460';
              ctx.beginPath();
              ctx.ellipse(0, 5 * scale, 15 * scale, 8 * scale, 0, 0, Math.PI * 2);
              ctx.fill();

              // Neck
              ctx.fillStyle = '#DEB887';
              ctx.beginPath();
              ctx.ellipse(15 * scale, -5 * scale, 7 * scale, 6 * scale, -Math.PI * 0.2, 0, Math.PI * 2);
              ctx.fill();

              // Head with duck bill
              ctx.fillStyle = '#CD853F';
              ctx.beginPath();
              ctx.ellipse(22 * scale, -8 * scale, 8 * scale, 6 * scale, 0, 0, Math.PI * 2);
              ctx.fill();

              // Duck bill
              ctx.fillStyle = '#8B6914';
              ctx.beginPath();
              ctx.ellipse(28 * scale, -8 * scale, 5 * scale, 4 * scale, 0, 0, Math.PI * 2);
              ctx.fill();

              // Distinctive head crest (swept back)
              ctx.fillStyle = '#B8860B';
              ctx.beginPath();
              ctx.moveTo(20 * scale, -12 * scale);
              ctx.quadraticCurveTo(15 * scale, -18 * scale, 10 * scale, -15 * scale);
              ctx.lineTo(12 * scale, -13 * scale);
              ctx.quadraticCurveTo(16 * scale, -15 * scale, 20 * scale, -10 * scale);
              ctx.closePath();
              ctx.fill();

              // Eye
              ctx.fillStyle = '#000';
              ctx.beginPath();
              ctx.arc(23 * scale, -10 * scale, 2 * scale, 0, Math.PI * 2);
              ctx.fill();

            } else if (dino.type === 'trike') {
              // Triceratops - three-horned herbivore with frill
              const scale = dino.size / 28;

              // Tail
              ctx.fillStyle = '#A0826D';
              ctx.beginPath();
              ctx.moveTo(-15 * scale, 2 * scale);
              ctx.quadraticCurveTo(-28 * scale, 0, -35 * scale, -2 * scale);
              ctx.lineTo(-33 * scale, 0);
              ctx.quadraticCurveTo(-26 * scale, 2 * scale, -15 * scale, 4 * scale);
              ctx.fill();

              // Hind legs (sturdy)
              ctx.fillStyle = '#8B7355';
              ctx.fillRect(-12 * scale, 10 * scale, 7 * scale, 12 * scale);
              ctx.fillRect(-2 * scale, 10 * scale, 7 * scale, 12 * scale);

              // Front legs (shorter, sturdier)
              ctx.fillRect(10 * scale, 12 * scale, 6 * scale, 10 * scale);
              ctx.fillRect(18 * scale, 12 * scale, 6 * scale, 10 * scale);

              // Body (massive)
              ctx.fillStyle = '#D2B48C';
              ctx.beginPath();
              ctx.ellipse(0, 0, 22 * scale, 14 * scale, 0, 0, Math.PI * 2);
              ctx.fill();

              // Belly
              ctx.fillStyle = '#F5DEB3';
              ctx.beginPath();
              ctx.ellipse(0, 6 * scale, 18 * scale, 10 * scale, 0, 0, Math.PI * 2);
              ctx.fill();

              // Neck/shoulders
              ctx.fillStyle = '#D2B48C';
              ctx.beginPath();
              ctx.ellipse(18 * scale, -2 * scale, 10 * scale, 8 * scale, 0, 0, Math.PI * 2);
              ctx.fill();

              // Frill (distinctive bony collar)
              ctx.fillStyle = '#CD853F';
              ctx.beginPath();
              ctx.ellipse(22 * scale, -8 * scale, 12 * scale, 10 * scale, 0, Math.PI, Math.PI * 2);
              ctx.fill();

              // Frill outline
              ctx.strokeStyle = '#8B6914';
              ctx.lineWidth = 2;
              ctx.beginPath();
              ctx.ellipse(22 * scale, -8 * scale, 12 * scale, 10 * scale, 0, Math.PI, Math.PI * 2);
              ctx.stroke();

              // Head
              ctx.fillStyle = '#A0826D';
              ctx.beginPath();
              ctx.ellipse(28 * scale, -2 * scale, 10 * scale, 7 * scale, 0, 0, Math.PI * 2);
              ctx.fill();

              // Beak
              ctx.fillStyle = '#8B6914';
              ctx.beginPath();
              ctx.ellipse(35 * scale, -1 * scale, 4 * scale, 3 * scale, 0, 0, Math.PI * 2);
              ctx.fill();

              // Nose horn (short)
              ctx.fillStyle = '#696969';
              ctx.beginPath();
              ctx.moveTo(33 * scale, -3 * scale);
              ctx.lineTo(35 * scale, -8 * scale);
              ctx.lineTo(37 * scale, -3 * scale);
              ctx.closePath();
              ctx.fill();

              // Two brow horns (longer)
              ctx.beginPath();
              ctx.moveTo(26 * scale, -6 * scale);
              ctx.lineTo(25 * scale, -14 * scale);
              ctx.lineTo(28 * scale, -6 * scale);
              ctx.closePath();
              ctx.fill();

              ctx.beginPath();
              ctx.moveTo(30 * scale, -6 * scale);
              ctx.lineTo(29 * scale, -14 * scale);
              ctx.lineTo(32 * scale, -6 * scale);
              ctx.closePath();
              ctx.fill();

              // Eye
              ctx.fillStyle = '#000';
              ctx.beginPath();
              ctx.arc(30 * scale, -4 * scale, 2 * scale, 0, Math.PI * 2);
              ctx.fill();

            } else if (dino.type === 'dilo') {
              // Dilophosaurus - spitting territorial predator with neck frill
              const scale = dino.size / 24;

              // Tail
              ctx.fillStyle = '#7FFF00';
              ctx.beginPath();
              ctx.moveTo(-10 * scale, 0);
              ctx.quadraticCurveTo(-22 * scale, -2 * scale, -30 * scale, -5 * scale);
              ctx.lineTo(-28 * scale, -3 * scale);
              ctx.quadraticCurveTo(-20 * scale, 0, -10 * scale, 2 * scale);
              ctx.fill();

              // Hind legs
              ctx.fillStyle = '#9ACD32';
              ctx.fillRect(-8 * scale, 6 * scale, 4 * scale, 10 * scale);
              ctx.fillRect(-2 * scale, 6 * scale, 4 * scale, 10 * scale);

              // Front legs (shorter)
              ctx.fillRect(6 * scale, 8 * scale, 3 * scale, 8 * scale);
              ctx.fillRect(11 * scale, 8 * scale, 3 * scale, 8 * scale);

              // Body (lean predator)
              ctx.fillStyle = '#ADFF2F';
              ctx.beginPath();
              ctx.ellipse(0, 0, 18 * scale, 10 * scale, 0, 0, Math.PI * 2);
              ctx.fill();

              // Black spots/stripes
              ctx.fillStyle = '#000';
              ctx.beginPath();
              ctx.arc(-5 * scale, -3 * scale, 2 * scale, 0, Math.PI * 2);
              ctx.arc(2 * scale, -4 * scale, 2 * scale, 0, Math.PI * 2);
              ctx.arc(-8 * scale, 2 * scale, 2 * scale, 0, Math.PI * 2);
              ctx.fill();

              // Neck
              ctx.fillStyle = '#ADFF2F';
              ctx.beginPath();
              ctx.ellipse(12 * scale, -6 * scale, 6 * scale, 5 * scale, -Math.PI * 0.3, 0, Math.PI * 2);
              ctx.fill();

              // Head
              ctx.fillStyle = '#9ACD32';
              ctx.beginPath();
              ctx.ellipse(20 * scale, -10 * scale, 7 * scale, 5 * scale, 0, 0, Math.PI * 2);
              ctx.fill();

              // Distinctive neck frill (colorful, expanded when aggressive)
              const frillExpanded = dino.state === 'chase';
              const frillSize = frillExpanded ? 10 : 7;
              ctx.fillStyle = frillExpanded ? '#FF6347' : '#FFA07A';
              ctx.beginPath();
              ctx.arc(14 * scale, -8 * scale, frillSize * scale, Math.PI * 0.7, Math.PI * 1.3);
              ctx.fill();

              // Frill outline
              ctx.strokeStyle = '#FF4500';
              ctx.lineWidth = 1;
              ctx.beginPath();
              ctx.arc(14 * scale, -8 * scale, frillSize * scale, Math.PI * 0.7, Math.PI * 1.3);
              ctx.stroke();

              // Snout
              ctx.fillStyle = '#7FFF00';
              ctx.beginPath();
              ctx.ellipse(26 * scale, -10 * scale, 4 * scale, 3 * scale, 0, 0, Math.PI * 2);
              ctx.fill();

              // Eye (predatory)
              ctx.fillStyle = '#FFF';
              ctx.beginPath();
              ctx.arc(21 * scale, -11 * scale, 2 * scale, 0, Math.PI * 2);
              ctx.fill();
              ctx.fillStyle = '#FF0000';
              ctx.beginPath();
              ctx.arc(21.5 * scale, -11 * scale, 1 * scale, 0, Math.PI * 2);
              ctx.fill();

              // Teeth
              ctx.fillStyle = '#FFF';
              for (let i = 0; i < 4; i++) {
                ctx.fillRect((24 + i * 1.5) * scale, -9 * scale, 0.8 * scale, 2 * scale);
              }
            }

            ctx.restore();

            // Health bar
            const barWidth = dino.size * 2.5;
            const barHeight = 5;
            ctx.fillStyle = '#000';
            ctx.fillRect(screenX - barWidth / 2 - 1, screenY - dino.size * 1.5 - 1, barWidth + 2, barHeight + 2);
            ctx.fillStyle = '#f00';
            ctx.fillRect(screenX - barWidth / 2, screenY - dino.size * 1.5, barWidth, barHeight);
            ctx.fillStyle = '#0f0';
            ctx.fillRect(screenX - barWidth / 2, screenY - dino.size * 1.5, barWidth * (dino.health / dino.maxHealth), barHeight);

            // Sleeping Z-Z-Z
            if (dino.isSleeping) {
              ctx.fillStyle = '#FFF';
              ctx.strokeStyle = '#000';
              ctx.lineWidth = 1;
              ctx.font = 'bold 16px Arial';
              ctx.textAlign = 'center';

              const zOffset = Math.sin(Date.now() / 200) * 3;
              ctx.strokeText('Z', screenX + dino.size, screenY - dino.size - 10 + zOffset);
              ctx.fillText('Z', screenX + dino.size, screenY - dino.size - 10 + zOffset);

              ctx.font = 'bold 20px Arial';
              ctx.strokeText('Z', screenX + dino.size + 8, screenY - dino.size - 18 + zOffset);
              ctx.fillText('Z', screenX + dino.size + 8, screenY - dino.size - 18 + zOffset);

              ctx.font = 'bold 24px Arial';
              ctx.strokeText('Z', screenX + dino.size + 18, screenY - dino.size - 28 + zOffset);
              ctx.fillText('Z', screenX + dino.size + 18, screenY - dino.size - 28 + zOffset);
            }

            // Zap effect (electric shock animation)
            drawZapEffect(ctx, screenX, screenY, dino.size, dino.zapTimer);
          });

          // Draw player
          const playerScreenX = game.player.x - game.cameraX;
          const playerScreenY = game.player.y - game.cameraY - game.player.jumpHeight;

          // Jump shadow
          if (game.player.isJumping) {
            ctx.fillStyle = 'rgba(0, 0, 0, 0.3)';
            ctx.beginPath();
            ctx.ellipse(playerScreenX, game.player.y - game.cameraY, game.player.radius * 0.8, game.player.radius * 0.4, 0, 0, Math.PI * 2);
            ctx.fill();
          }

          // Speed boost glow effect
          if (game.speedBoostTimer > 0) {
            ctx.fillStyle = 'rgba(0, 229, 255, 0.3)';
            ctx.beginPath();
            ctx.arc(playerScreenX, playerScreenY, game.player.radius + 5, 0, Math.PI * 2);
            ctx.fill();
          }

          // Zap effect (electric shock animation)
          drawZapEffect(ctx, playerScreenX, playerScreenY, game.player.radius, game.player.zapTimer);

          const mouseAngle = Math.atan2(game.mouseY - game.player.y, game.mouseX - game.player.x);

          ctx.save();
          ctx.translate(playerScreenX, playerScreenY);

          // Apply invincibility flashing effect
          if (isInvincible(game.player) && Math.floor(game.player.invincibilityTimer / 5) % 2 === 0) {
            ctx.globalAlpha = 0.5;
          }

          // Body (khaki shirt)
          ctx.fillStyle = '#C3B091';
          ctx.beginPath();
          ctx.arc(0, 2, 12, 0, Math.PI * 2);
          ctx.fill();

          // Head
          ctx.fillStyle = '#F4A460';
          ctx.beginPath();
          ctx.arc(0, -6, 8, 0, Math.PI * 2);
          ctx.fill();

          // Safari hat
          ctx.fillStyle = '#8B7355';
          ctx.beginPath();
          ctx.ellipse(0, -11, 10, 3, 0, 0, Math.PI * 2);
          ctx.fill();
          ctx.fillStyle = '#A0826D';
          ctx.beginPath();
          ctx.arc(0, -13, 6, 0, Math.PI * 2);
          ctx.fill();

          // Eyes
          ctx.fillStyle = '#000';
          ctx.beginPath();
          ctx.arc(-2, -7, 1, 0, Math.PI * 2);
          ctx.arc(2, -7, 1, 0, Math.PI * 2);
          ctx.fill();

          // Arms and gun
          ctx.rotate(mouseAngle);

          // Gun
          ctx.fillStyle = '#2F4F4F';
          ctx.fillRect(8, -2, 10, 4);
          ctx.fillStyle = '#696969';
          ctx.fillRect(18, -1, 4, 2);

          // Arms holding gun
          ctx.strokeStyle = '#F4A460';
          ctx.lineWidth = 3;
          ctx.beginPath();
          ctx.moveTo(0, 2);
          ctx.lineTo(8, -2);
          ctx.stroke();
          ctx.beginPath();
          ctx.moveTo(0, 2);
          ctx.lineTo(8, 2);
          ctx.stroke();

          // Hands on gun
          ctx.fillStyle = '#F4A460';
          ctx.beginPath();
          ctx.arc(8, -2, 2.5, 0, Math.PI * 2);
          ctx.arc(8, 2, 2.5, 0, Math.PI * 2);
          ctx.fill();

          // Reset alpha if it was modified
          if (isInvincible(game.player)) {
            ctx.globalAlpha = 1.0;
          }

          ctx.restore();

          // Draw bullets
          game.bullets.forEach(bullet => {
            ctx.fillStyle = bullet.type === 'tranquilizer' ? '#00FF00' : '#ff0';
            ctx.beginPath();
            ctx.arc(bullet.x - game.cameraX, bullet.y - game.cameraY, bullet.radius, 0, Math.PI * 2);
            ctx.fill();
          });

          // Draw spit projectiles
          game.spit.forEach(spit => {
            ctx.fillStyle = '#9ACD32';
            ctx.strokeStyle = '#556B2F';
            ctx.lineWidth = 1;
            ctx.beginPath();
            ctx.arc(spit.x - game.cameraX, spit.y - game.cameraY, spit.radius, 0, Math.PI * 2);
            ctx.fill();
            ctx.stroke();
          });

          // Draw ammo pickups
          ctx.fillStyle = '#FFD700';
          game.ammoPickups.forEach(pickup => {
            ctx.beginPath();
            ctx.arc(pickup.x - game.cameraX, pickup.y - game.cameraY, pickup.radius, 0, Math.PI * 2);
            ctx.fill();
          });

          // Draw floating texts
          game.floatingTexts.forEach(text => {
            const alpha = text.age < GAME_CONSTANTS.FLOATING_TEXT.FADE_START_FRAME ? 1.0 : 1.0 - ((text.age - GAME_CONSTANTS.FLOATING_TEXT.FADE_START_FRAME) / (GAME_CONSTANTS.FLOATING_TEXT.LIFETIME_FRAMES - GAME_CONSTANTS.FLOATING_TEXT.FADE_START_FRAME));
            ctx.save();
            ctx.globalAlpha = alpha;
            ctx.fillStyle = text.color;
            ctx.strokeStyle = '#000';
            ctx.lineWidth = 3;
            ctx.font = 'bold 20px Arial';
            ctx.textAlign = 'center';
            const screenX = text.x - game.cameraX;
            const screenY = text.y - game.cameraY;
            ctx.strokeText(text.text, screenX, screenY);
            ctx.fillText(text.text, screenX, screenY);
            ctx.restore();
          });

          animationId = requestAnimationFrame(gameLoop);
        };

        gameLoop();

        return () => {
          cancelAnimationFrame(animationId);
          canvas.removeEventListener('mousemove', handleMouseMove);
          canvas.removeEventListener('click', handleClick);
          window.removeEventListener('keydown', handleKeyDown);
          window.removeEventListener('keyup', handleKeyUp);
        };
      }, [gameState, currentLevel, playSound, showPauseMenu]);

      const startGame = () => {
        setCurrentLevel(1);
        setScore(0);
        initGame(1);
        setGameState('playing');
        playSound('game_start');
      };

      const nextLevel = () => {
        const next = currentLevel + 1;
        setCurrentLevel(next);
        initGame(next);
        setGameState('playing');
      };

      const game = gameRef.current;

      return (
        <div className="flex flex-col items-center justify-center min-h-screen bg-gray-900 p-4">
          {gameState === 'menu' && (
            <div className="text-center">
              <h1 className="text-5xl font-bold text-green-400 mb-4">JURASSIC ESCAPE</h1>
              <p className="text-gray-300 mb-2">Navigate through the dangerous park and reach the exit!</p>
              <p className="text-gray-400 mb-2">
                {isTouchDevice ? (
                  <span>Use joystick to move • JUMP to clear obstacles • FIRE to shoot • Q to switch weapon</span>
                ) : (
                  <span>WASD or Arrow Keys to move • Spacebar to jump • Q to switch weapon • Mouse to aim • Click to shoot</span>
                )}
              </p>
              <div className="text-gray-300 mb-6 space-y-2">
                <p className="flex items-center justify-center gap-2">
                  <span className="inline-block w-4 h-4 bg-red-500 rounded-full"></span>
                  Health Pack - Restores 1 heart
                </p>
                <p className="flex items-center justify-center gap-2">
                  <span className="inline-block w-4 h-4 bg-cyan-400 rounded-full"></span>
                  Speed Boost - Temporary speed increase
                </p>
                <p className="flex items-center justify-center gap-2">
                  <span className="inline-block w-4 h-4 bg-green-600 rounded"></span>
                  Tranquilizer Depot - Refills 💉 ammo
                </p>
              </div>
              <div className="flex flex-col gap-3">
                <button
                  onClick={startGame}
                  className="px-8 py-3 bg-green-600 hover:bg-green-700 text-white font-bold rounded-lg text-xl"
                >
                  START GAME
                </button>
                <button
                  onClick={() => setShowSettingsMenu(true)}
                  className="px-8 py-3 bg-gray-700 hover:bg-gray-600 text-white font-bold rounded-lg text-lg flex items-center justify-center gap-2"
                >
                  <span>⚙️</span>
                  <span>SETTINGS</span>
                </button>
              </div>
            </div>
          )}

          {gameState === 'playing' && (
            <div className="flex flex-col items-center">
              <div className="flex gap-4 md:gap-8 mb-4 text-white items-center flex-wrap justify-center">
                <div className="text-xl font-bold">Level {currentLevel}</div>
                <div className="flex items-center gap-2">
                  {Array.from({ length: 5 }).map((_, i) => (
                    <span key={i}>{i < playerHealth ? '❤️' : '🖤'}</span>
                  ))}
                </div>
                <div className={`flex items-center gap-2 px-3 py-1 rounded ${currentWeapon === 'regular' ? 'bg-yellow-600' : 'bg-gray-700'}`}>
                  <span>💥</span>
                  <span className="text-xl font-bold">{playerAmmo}</span>
                </div>
                <div className={`flex items-center gap-2 px-3 py-1 rounded ${currentWeapon === 'tranquilizer' ? 'bg-green-600' : 'bg-gray-700'}`}>
                  <span>💉</span>
                  <span className="text-xl font-bold">{playerTranqAmmo}</span>
                </div>
                {speedBoostActive && (
                  <div className="flex items-center gap-2 bg-cyan-500 px-3 py-1 rounded-full">
                    <span>⚡</span>
                    <span className="text-sm font-bold">SPEED BOOST</span>
                  </div>
                )}
                <div className="text-xl font-bold">Score: {score}</div>
                {isTouchDevice && (
                  <button
                    onClick={() => {
                      setShowPauseMenu(true);
                      playSound('pause');
                    }}
                    className="px-4 py-2 bg-yellow-600 hover:bg-yellow-700 text-white font-bold rounded-lg"
                  >
                    ⏸ PAUSE
                  </button>
                )}
                <button
                  onClick={() => {
                    setShowPauseMenu(true);
                    setShowSettingsMenu(true);
                  }}
                  className="px-3 py-2 bg-gray-700 hover:bg-gray-600 text-white font-bold rounded-lg text-xl"
                  title="Settings"
                >
                  ⚙️
                </button>
              </div>
              <div className="relative">
                <canvas
                  ref={canvasRef}
                  width={VIEWPORT_SCALES[viewportScale].width}
                  height={VIEWPORT_SCALES[viewportScale].height}
                  style={{ width: `${canvasSize.width}px`, height: `${canvasSize.height}px` }}
                  className="border-4 border-green-600 bg-green-900 cursor-crosshair"
                />

                {/* Touch Controls Overlay */}
                {isTouchDevice && (
                <div className="absolute inset-0 pointer-events-none">
                  {/* Virtual Joystick Area (left side) */}
                  <div
                    className="absolute left-4 bottom-4 w-32 h-32 pointer-events-auto"
                    onTouchStart={(e) => {
                      e.preventDefault();
                      const touch = e.touches[0];
                      const rect = e.currentTarget.getBoundingClientRect();
                      const x = touch.clientX - rect.left;
                      const y = touch.clientY - rect.top;
                      gameRef.current.touch.joystick = {
                        active: true,
                        startX: x,
                        startY: y,
                        currentX: x,
                        currentY: y
                      };
                    }}
                    onTouchMove={(e) => {
                      e.preventDefault();
                      if (!gameRef.current.touch.joystick.active) return;
                      const touch = e.touches[0];
                      const rect = e.currentTarget.getBoundingClientRect();
                      gameRef.current.touch.joystick.currentX = touch.clientX - rect.left;
                      gameRef.current.touch.joystick.currentY = touch.clientY - rect.top;
                    }}
                    onTouchEnd={(e) => {
                      e.preventDefault();
                      gameRef.current.touch.joystick.active = false;
                    }}
                  >
                    <div className="w-full h-full rounded-full bg-gray-800 bg-opacity-50 border-2 border-gray-600 flex items-center justify-center">
                      <div className="text-2xl">🕹️</div>
                    </div>
                    {gameRef.current.touch.joystick.active && (
                      <div
                        className="absolute w-12 h-12 rounded-full bg-green-500 bg-opacity-70 transform -translate-x-1/2 -translate-y-1/2"
                        style={{
                          left: `${gameRef.current.touch.joystick.currentX}px`,
                          top: `${gameRef.current.touch.joystick.currentY}px`
                        }}
                      />
                    )}
                  </div>

                  {/* Weapon Switch Button */}
                  <div
                    className="absolute right-4 top-4 w-16 h-16 pointer-events-auto"
                    onTouchStart={(e) => {
                      e.preventDefault();
                      gameRef.current.touch.switchWeapon = true;
                    }}
                  >
                    <div className={`w-full h-full rounded-full ${gameRef.current.player.currentWeapon === 'regular' ? 'bg-yellow-600' : 'bg-green-600'} bg-opacity-70 border-2 ${gameRef.current.player.currentWeapon === 'regular' ? 'border-yellow-500' : 'border-green-500'} flex items-center justify-center text-white text-2xl font-bold shadow-lg`}>
                      {gameRef.current.player.currentWeapon === 'regular' ? '💥' : '💉'}
                    </div>
                  </div>

                  {/* Jump Button */}
                  <div
                    className="absolute right-28 bottom-4 w-20 h-20 pointer-events-auto"
                    onTouchStart={(e) => {
                      e.preventDefault();
                      if (!gameRef.current.player.isJumping) {
                        gameRef.current.player.isJumping = true;
                        gameRef.current.player.jumpVelocity = 8;
                        playSound('jump');
                      }
                    }}
                  >
                    <div className="w-full h-full rounded-full bg-yellow-600 bg-opacity-70 border-2 border-yellow-500 flex items-center justify-center text-white font-bold shadow-lg">
                      JUMP
                    </div>
                  </div>

                  {/* Shoot Button */}
                  <div
                    className="absolute right-4 bottom-4 w-20 h-20 pointer-events-auto"
                    onTouchStart={(e) => {
                      e.preventDefault();
                      gameRef.current.touch.shoot = true;
                    }}
                    onTouchEnd={(e) => {
                      e.preventDefault();
                      gameRef.current.touch.shoot = false;
                    }}
                  >
                    <div className="w-full h-full rounded-full bg-red-600 bg-opacity-70 border-2 border-red-500 flex items-center justify-center text-white font-bold shadow-lg">
                      FIRE
                    </div>
                  </div>
                </div>
                )}
              </div>
              <p className="text-gray-400 mt-2 text-center">
                {isTouchDevice ? (
                  <span>Joystick to move • Tap 💥/💉 to switch weapon • FIRE to auto-aim • JUMP to escape!</span>
                ) : (
                  <span>WASD/Arrows to move • Q to switch weapon • Mouse to aim • Click to shoot • Spacebar to jump!</span>
                )}
              </p>

              {showPauseMenu && (
                <div className="absolute inset-0 bg-black bg-opacity-75 flex items-center justify-center">
                  <div className="bg-gray-800 p-8 rounded-lg text-center shadow-xl">
                    <h2 className="text-3xl font-bold text-green-400 mb-6">PAUSED</h2>
                    <div className="flex flex-col gap-4">
                      <button
                        onClick={() => {
                          setShowPauseMenu(false);
                          playSound('unpause');
                        }}
                        className="px-6 py-3 bg-green-600 hover:bg-green-700 text-white font-bold rounded-lg"
                      >
                        Continue
                      </button>
                      <button
                        onClick={() => {
                          setShowPauseMenu(false);
                          playSound('unpause');
                          initGame(currentLevel);
                          setGameState('playing');
                        }}
                        className="px-6 py-3 bg-yellow-600 hover:bg-yellow-700 text-white font-bold rounded-lg"
                      >
                        Restart Level
                      </button>
                      <button
                        onClick={() => {
                          setShowPauseMenu(false);
                          playSound('victory');
                          setGameState('menu');
                        }}
                        className="px-6 py-3 bg-red-600 hover:bg-red-700 text-white font-bold rounded-lg"
                      >
                        Exit to Menu
                      </button>
                      <button
                        onClick={() => {
                          setShowPauseMenu(false);
                          setShowSettingsMenu(true);
                        }}
                        className="px-6 py-3 bg-gray-700 hover:bg-gray-600 text-white font-bold rounded-lg flex items-center justify-center gap-2"
                      >
                        <span>⚙️</span>
                        <span>Settings</span>
                      </button>
                    </div>
                  </div>
                </div>
              )}
            </div>
          )}

          {gameState === 'levelComplete' && (
            <div className="text-center">
              <h1 className="text-5xl font-bold text-green-400 mb-4">LEVEL {currentLevel} COMPLETE!</h1>
              <p className="text-2xl text-white mb-4">Score: {score}</p>
              <button
                onClick={nextLevel}
                className="px-8 py-3 bg-green-600 hover:bg-green-700 text-white font-bold rounded-lg text-xl"
              >
                NEXT LEVEL
              </button>
            </div>
          )}

          {gameState === 'won' && (
            <div className="text-center">
              <h1 className="text-5xl font-bold text-green-400 mb-4">YOU ESCAPED!</h1>
              <p className="text-3xl text-yellow-400 mb-2">ALL LEVELS COMPLETE!</p>
              <p className="text-2xl text-white mb-4">Final Score: {score}</p>
              <button
                onClick={startGame}
                className="px-8 py-3 bg-green-600 hover:bg-green-700 text-white font-bold rounded-lg text-xl"
              >
                PLAY AGAIN
              </button>
            </div>
          )}

          {gameState === 'lost' && (
            <div className="text-center">
              <h1 className="text-5xl font-bold text-red-500 mb-4">GAME OVER</h1>
              <p className="text-xl text-white mb-2">Level {currentLevel}</p>
              <p className="text-2xl text-white mb-4">Final Score: {score}</p>
              <button
                onClick={startGame}
                className="px-8 py-3 bg-green-600 hover:bg-green-700 text-white font-bold rounded-lg text-xl"
              >
                TRY AGAIN
              </button>
            </div>
          )}

          {/* Settings Menu Overlay */}
          {showSettingsMenu && (
            <div className="absolute inset-0 bg-black bg-opacity-75 flex items-center justify-center z-50">
              <div className="bg-gray-800 p-8 rounded-lg text-center shadow-xl max-w-md w-full mx-4">
                <h2 className="text-3xl font-bold text-green-400 mb-6">SETTINGS</h2>
                <div className="flex flex-col gap-4">
                  <div className="bg-gray-700 p-4 rounded-lg">
                    <div className="flex items-center justify-between">
                      <div className="flex items-center gap-3">
                        <span className="text-2xl">{soundEnabled ? '🔊' : '🔇'}</span>
                        <span className="text-white font-semibold text-lg">Sound</span>
                      </div>
                      <button
                        onClick={() => {
                          const newValue = !soundEnabled;
                          setSoundEnabled(newValue);
                          localStorage.setItem('jurassicEscapeSoundEnabled', JSON.stringify(newValue));
                          if (newValue) playSound('game_start');
                        }}
                        className={`px-6 py-2 font-bold rounded-lg transition-colors ${
                          soundEnabled
                            ? 'bg-green-600 hover:bg-green-700 text-white'
                            : 'bg-gray-600 hover:bg-gray-500 text-gray-300'
                        }`}
                      >
                        {soundEnabled ? 'ON' : 'OFF'}
                      </button>
                    </div>
                  </div>
                  <div className="bg-gray-700 p-4 rounded-lg">
                    <div className="flex flex-col gap-3">
                      <div className="flex items-center gap-3">
                        <span className="text-2xl">🔊</span>
                        <span className="text-white font-semibold text-lg">Volume</span>
                      </div>
                      <div className="flex items-center gap-3">
                        <input
                          type="range"
                          min="0"
                          max="100"
                          value={Math.round(volume * 100)}
                          onChange={(e) => {
                            const newVolume = parseInt(e.target.value) / 100;
                            setVolume(newVolume);
                            localStorage.setItem('jurassicEscapeVolume', newVolume.toString());
                          }}
                          className="flex-1 h-2 bg-gray-600 rounded-lg appearance-none cursor-pointer"
                          style={{
                            background: `linear-gradient(to right, #16a34a 0%, #16a34a ${volume * 100}%, #4b5563 ${volume * 100}%, #4b5563 100%)`
                          }}
                        />
                        <span className="text-white font-semibold text-lg min-w-[3rem] text-right">
                          {Math.round(volume * 100)}%
                        </span>
                      </div>
                    </div>
                  </div>
                  <div className="bg-gray-700 p-4 rounded-lg">
                    <div className="flex flex-col gap-3">
                      <div className="flex items-center gap-3">
                        <span className="text-2xl">📐</span>
                        <span className="text-white font-semibold text-lg">Viewport Size</span>
                      </div>
                      <div className="flex gap-2">
                        {Object.entries(VIEWPORT_SCALES).map(([key, config]) => (
                          <button
                            key={key}
                            onClick={() => {
                              setViewportScale(key);
                              localStorage.setItem('jurassicEscapeViewportScale', key);
                            }}
                            className={`flex-1 px-4 py-2 font-bold rounded-lg transition-colors ${
                              viewportScale === key
                                ? 'bg-green-600 hover:bg-green-700 text-white'
                                : 'bg-gray-600 hover:bg-gray-500 text-gray-300'
                            }`}
                          >
                            {config.label}
                          </button>
                        ))}
                      </div>
                    </div>
                  </div>
                  <div className="bg-gray-700 p-4 rounded-lg">
                    <div className="flex flex-col gap-3">
                      <div className="flex items-center gap-3">
                        <span className="text-2xl">⚔️</span>
                        <span className="text-white font-semibold text-lg">Difficulty</span>
                      </div>
                      <div className="flex gap-2">
                        {Object.entries(DIFFICULTY_MODIFIERS).map(([key, config]) => (
                          <button
                            key={key}
                            onClick={() => {
                              setDifficulty(key);
                              localStorage.setItem('jurassicEscapeDifficulty', key);
                            }}
                            className={`flex-1 px-4 py-2 font-bold rounded-lg transition-colors ${
                              difficulty === key
                                ? 'bg-green-600 hover:bg-green-700 text-white'
                                : 'bg-gray-600 hover:bg-gray-500 text-gray-300'
                            }`}
                          >
                            {config.label}
                          </button>
                        ))}
                      </div>
                      <div className="text-sm text-gray-300 text-center mt-1">
                        {difficulty === 'easy' && '7 ❤️  15 💥  22 💉  Slower enemies  90f invincibility'}
                        {difficulty === 'normal' && '5 ❤️  10 💥  15 💉  Normal enemies  60f invincibility'}
                        {difficulty === 'hard' && '3 ❤️  5 💥  10 💉  Faster enemies  45f invincibility'}
                      </div>
                    </div>
                  </div>
                  <button
                    onClick={() => setShowSettingsMenu(false)}
                    className="px-6 py-3 bg-blue-600 hover:bg-blue-700 text-white font-bold rounded-lg"
                  >
                    Close
                  </button>
                </div>
              </div>
            </div>
          )}
        </div>
      );
    };

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<JurassicEscape />);
  </script>
</body>

</html>
