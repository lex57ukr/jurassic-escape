    /**
     * Calculate distance between two points
     */
    const distance = (x1, y1, x2, y2) => {
      const dx = x2 - x1;
      const dy = y2 - y1;
      return Math.sqrt(dx * dx + dy * dy);
    };

    /**
     * Normalize a vector (dx, dy) and return unit vector with magnitude
     */
    const normalize = (dx, dy) => {
      const mag = Math.sqrt(dx * dx + dy * dy);
      return mag > 0 ? { dx: dx / mag, dy: dy / mag, magnitude: mag } : { dx: 0, dy: 0, magnitude: 0 };
    };

    /**
     * Clamp a value between min and max
     */
    const clamp = (value, min, max) => Math.max(min, Math.min(max, value));

    /**
     * Convert world coordinates to screen coordinates
     */
    const toScreenCoords = (worldX, worldY, cameraX, cameraY) => ({
      x: worldX - cameraX,
      y: worldY - cameraY
    });

    /**
     * Check if two circles collide
     */
    const circleCollision = (x1, y1, r1, x2, y2, r2) => {
      return distance(x1, y1, x2, y2) < r1 + r2;
    };

    /**
     * Check if circle collides with rotated rectangle (for electric fences)
     */
    const circleRectCollision = (circleX, circleY, radius, rectX, rectY, rectWidth, rectHeight, rotation) => {
      // Translate circle to rect's local space
      const dx = circleX - rectX;
      const dy = circleY - rectY;

      // Rotate circle position back by -rotation
      const cos = Math.cos(-rotation);
      const sin = Math.sin(-rotation);
      const localX = dx * cos - dy * sin;
      const localY = dx * sin + dy * cos;

      // Find closest point on rect to circle
      const halfWidth = rectWidth / 2;
      const halfHeight = rectHeight / 2;
      const closestX = Math.max(-halfWidth, Math.min(halfWidth, localX));
      const closestY = Math.max(-halfHeight, Math.min(halfHeight, localY));

      // Check distance from circle to closest point
      const distX = localX - closestX;
      const distY = localY - closestY;
      const distSquared = distX * distX + distY * distY;

      return distSquared < radius * radius;
    };

    /**
     * Check if entity collides with any obstacle
     */
    const checkObstacleCollision = (x, y, radius, obstacles, jumpHeight = 0) => {
      // Jump over obstacles if high enough
      if (jumpHeight >= GAME_CONSTANTS.PLAYER.JUMP_CLEAR_HEIGHT) return false;

      for (const obs of obstacles) {
        if (circleCollision(x, y, radius, obs.x, obs.y, obs.radius)) {
          return true;
        }
      }
      return false;
    };

    /**
     * Clamp entity position to map boundaries
     */
    const clampToBounds = (entity, size, mapWidth, mapHeight) => {
      entity.x = clamp(entity.x, size, mapWidth - size);
      entity.y = clamp(entity.y, size, mapHeight - size);
    };

    /**
     * Create a bullet object
     */
    const createBullet = (fromX, fromY, toX, toY, speed = GAME_CONSTANTS.BULLET.SPEED) => {
      const { dx, dy } = normalize(toX - fromX, toY - fromY);
      return {
        x: fromX,
        y: fromY,
        vx: dx * speed,
        vy: dy * speed,
        radius: GAME_CONSTANTS.BULLET.RADIUS,
        type: 'regular'
      };
    };

    /**
     * Create a tranquilizer dart object
     */
    const createTranquilizer = (fromX, fromY, toX, toY) => {
      const { dx, dy } = normalize(toX - fromX, toY - fromY);
      return {
        x: fromX,
        y: fromY,
        vx: dx * GAME_CONSTANTS.TRANQUILIZER.SPEED,
        vy: dy * GAME_CONSTANTS.TRANQUILIZER.SPEED,
        radius: GAME_CONSTANTS.TRANQUILIZER.RADIUS,
        type: 'tranquilizer'
      };
    };

    /**
     * Create a floating text object
     */
    const createFloatingText = (x, y, text, color = '#FFD700') => {
      return {
        x,
        y,
        startY: y,
        text,
        color,
        lifetime: GAME_CONSTANTS.FLOATING_TEXT.LIFETIME_FRAMES,
        age: 0
      };
    };

    /**
     * Find nearest dinosaur to a position
     */
    const findNearestDinosaur = (x, y, dinosaurs) => {
      let nearest = null;
      let nearestDist = Infinity;

      dinosaurs.forEach(dino => {
        const dist = distance(x, y, dino.x, dino.y);
        if (dist < nearestDist) {
          nearestDist = dist;
          nearest = dino;
        }
      });

      return nearest;
    };

    /**
     * Get sleep duration for a dinosaur type
     */
    const getSleepDuration = (dinoType) => {
      switch (dinoType) {
        case 'raptor': return GAME_CONSTANTS.TRANQUILIZER.SLEEP_DURATION_RAPTOR;
        case 'stego': return GAME_CONSTANTS.TRANQUILIZER.SLEEP_DURATION_STEGO;
        case 'trex': return GAME_CONSTANTS.TRANQUILIZER.SLEEP_DURATION_TREX;
        case 'para': return GAME_CONSTANTS.TRANQUILIZER.SLEEP_DURATION_PARA;
        case 'trike': return GAME_CONSTANTS.TRANQUILIZER.SLEEP_DURATION_TRIKE;
        case 'dilo': return GAME_CONSTANTS.TRANQUILIZER.SLEEP_DURATION_DILO;
        default: return GAME_CONSTANTS.TRANQUILIZER.SLEEP_DURATION_RAPTOR;
      }
    };

    /**
     * Draw electric zap effect on an entity
     * @param {CanvasRenderingContext2D} ctx - Canvas context
     * @param {number} screenX - Screen X position
     * @param {number} screenY - Screen Y position
     * @param {number} size - Entity size/radius
     * @param {number} zapTimer - Current zap timer value
     */
    const drawZapEffect = (ctx, screenX, screenY, size, zapTimer) => {
      if (zapTimer <= 0) return;

      const zapAlpha = zapTimer / GAME_CONSTANTS.HAZARDS.ZAP_EFFECT_DURATION;

      // Electric aura
      ctx.fillStyle = `rgba(255, 255, 0, ${zapAlpha * GAME_CONSTANTS.HAZARDS.ZAP_AURA_ALPHA})`;
      ctx.beginPath();
      ctx.arc(screenX, screenY, size + GAME_CONSTANTS.HAZARDS.ZAP_AURA_RADIUS, 0, Math.PI * 2);
      ctx.fill();

      // Lightning bolts around the entity
      ctx.strokeStyle = `rgba(255, 255, 100, ${zapAlpha})`;
      ctx.lineWidth = GAME_CONSTANTS.HAZARDS.ZAP_BOLT_WIDTH;
      for (let i = 0; i < GAME_CONSTANTS.HAZARDS.ZAP_BOLT_COUNT; i++) {
        const angle = (Date.now() / GAME_CONSTANTS.HAZARDS.ZAP_BOLT_ROTATION_SPEED + i * Math.PI / 2) % (Math.PI * 2);
        const startX = screenX + Math.cos(angle) * size;
        const startY = screenY + Math.sin(angle) * size;
        const endX = screenX + Math.cos(angle) * (size + GAME_CONSTANTS.HAZARDS.ZAP_BOLT_LENGTH);
        const endY = screenY + Math.sin(angle) * (size + GAME_CONSTANTS.HAZARDS.ZAP_BOLT_LENGTH);

        ctx.beginPath();
        ctx.moveTo(startX, startY);
        ctx.lineTo(endX, endY);
        ctx.stroke();
      }
    };

    /**
     * Find a valid spawn position that doesn't collide with obstacles
     * @param {number} x - Initial x position
     * @param {number} y - Initial y position
     * @param {number} radius - Collision radius
     * @param {Array} obstacles - Array of obstacle objects
     * @param {Object} game - Game reference for map dimensions
     * @param {number} maxAttempts - Maximum number of spawn attempts
     * @returns {Object} Valid position {x, y}
     */
    const findValidSpawnPosition = (x, y, radius, obstacles, game, maxAttempts = GAME_CONSTANTS.SPAWN.DINOSAUR_SPAWN_MAX_ATTEMPTS) => {
      // Check if initial position is valid
      if (!checkObstacleCollision(x, y, radius, obstacles)) {
        return { x, y };
      }

      // Try random positions near the initial spawn point
      for (let attempt = 0; attempt < maxAttempts; attempt++) {
        const randomX = x + (Math.random() - 0.5) * GAME_CONSTANTS.SPAWN.DINOSAUR_SPAWN_SEARCH_RANGE;
        const randomY = y + (Math.random() - 0.5) * GAME_CONSTANTS.SPAWN.DINOSAUR_SPAWN_SEARCH_RANGE;

        // Clamp to map bounds
        const clampedX = clamp(randomX, radius, game.mapWidth - radius);
        const clampedY = clamp(randomY, radius, game.mapHeight - radius);

        // Check if this position is valid
        if (!checkObstacleCollision(clampedX, clampedY, radius, obstacles)) {
          return { x: clampedX, y: clampedY };
        }
      }

      // Fallback: return original position (dinosaur will have to navigate out)
      return { x, y };
    };

        playerHealthMultiplier: 1.0,      // 5 hearts
        playerAmmoMultiplier: 1.0,        // 10 ammo
        playerTranqAmmoMultiplier: 1.0,   // 15 tranq

        enemySpeedMultiplier: 1.3,        // 30% faster
        invincibilityMultiplier: 0.75,    // 45 frames (60 * 0.75)

    };

    /**
     * Apply difficulty modifiers to base game constants
     */
    const getAdjustedConstants = (difficulty) => {
      const modifier = DIFFICULTY_MODIFIERS[difficulty];
      return {
        ...GAME_CONSTANTS,
        PLAYER: {
          ...GAME_CONSTANTS.PLAYER,
          MAX_HEALTH: Math.round(GAME_CONSTANTS.PLAYER.MAX_HEALTH * modifier.playerHealthMultiplier),
          START_AMMO: Math.round(GAME_CONSTANTS.PLAYER.START_AMMO * modifier.playerAmmoMultiplier),
        },
        COMBAT: {
          ...GAME_CONSTANTS.COMBAT,
          INVINCIBILITY_FRAMES: Math.round(GAME_CONSTANTS.COMBAT.INVINCIBILITY_FRAMES * modifier.invincibilityMultiplier),
        },
        _difficultyModifier: modifier, // Store for enemy speed adjustments
      };
    };

    // ============================================================================
    // VIEWPORT SCALE CONFIGURATION
    // ============================================================================

    const VIEWPORT_SCALES = {
      small: { width: 800, height: 600, label: 'Small' },
      medium: { width: 1000, height: 750, label: 'Medium' },
      large: { width: 1200, height: 900, label: 'Large' }
    };

    // ============================================================================
    // COLLISION RESPONSE FUNCTIONS
    // ============================================================================

    /**
     * Push an entity away from a point
     */
    const pushEntityAway = (entity, fromX, fromY, force) => {
      const { dx, dy } = normalize(entity.x - fromX, entity.y - fromY);
      entity.x += dx * force;
      entity.y += dy * force;
    };

    /**
     * Check if entity has active invincibility
     */
    const isInvincible = (entity) => {
      return entity.invincibilityTimer > 0;
    };

    /**
     * Grant temporary invincibility frames to entity
     */
    const grantInvincibility = (entity, frames) => {
      entity.invincibilityTimer = frames;
    };

    /**
     * Update entity's invincibility timer
     */
    const updateInvincibility = (entity) => {
      if (entity.invincibilityTimer > 0) {
        entity.invincibilityTimer--;
      }
    };

    /**
     * Handle collision damage between two entities
     * Returns true if damage was applied
     */
    const handleCollisionDamage = (attacker, victim, damage, pushbackForce, invincibilityFrames, soundCallback) => {
      if (isInvincible(victim)) {
        return false;
      }

      victim.health -= damage;
      grantInvincibility(victim, invincibilityFrames);
      pushEntityAway(victim, attacker.x, attacker.y, pushbackForce);

      if (soundCallback) {
        soundCallback('player_hurt');
      }

      return true;
    };

    const JurassicEscape = () => {
      const canvasRef = useRef(null);
      const [gameState, setGameState] = useState('menu');
      const [score, setScore] = useState(0);
      const [playerHealth, setPlayerHealth] = useState(5);
      const [playerAmmo, setPlayerAmmo] = useState(10);
      const [playerTranqAmmo, setPlayerTranqAmmo] = useState(15);
      const [currentWeapon, setCurrentWeapon] = useState('regular');
      const [currentLevel, setCurrentLevel] = useState(1);
      const [speedBoostActive, setSpeedBoostActive] = useState(false);
      const [showPauseMenu, setShowPauseMenu] = useState(false);
      const [canvasSize, setCanvasSize] = useState(VIEWPORT_SCALES.medium);
      const [isTouchDevice, setIsTouchDevice] = useState(false);
      const [soundEnabled, setSoundEnabled] = useState(() => {
        const saved = localStorage.getItem('jurassicEscapeSoundEnabled');
        return saved !== null ? JSON.parse(saved) : true;
      });
      const [viewportScale, setViewportScale] = useState(() => {
        const saved = localStorage.getItem('jurassicEscapeViewportScale');
        return saved || 'medium';
      });
      const [volume, setVolume] = useState(() => {
        const saved = localStorage.getItem('jurassicEscapeVolume');
        return saved !== null ? parseFloat(saved) : 0.3;
      });
      const [difficulty, setDifficulty] = useState(() => {
        const saved = localStorage.getItem('jurassicEscapeDifficulty');
        return saved || 'normal';
      });
      const [showSettingsMenu, setShowSettingsMenu] = useState(false);

      // Sound system with pooling for simultaneous playback
      const soundsRef = useRef({});

      const playSound = useCallback((soundName) => {
        if (!soundEnabled) return;

        const soundData = soundsRef.current[soundName];
        if (!soundData) return;

        // Clone the audio element for simultaneous playback
        const audio = soundData.cloneNode();
        audio.volume = volume;
        audio.play().catch(e => console.log('Audio play failed:', e));

        // Clean up after playing
        audio.addEventListener('ended', () => {
          audio.remove();
        });
      }, [soundEnabled, volume]);

      useEffect(() => {
        // Preload all sounds as base templates
        const sounds = {
          shoot: new Audio('./assets/shoot.wav'),
          hit: new Audio('./assets/hit.wav'),
          death: new Audio('./assets/death.wav'),
          pickup_ammo: new Audio('./assets/pickup_ammo.wav'),
          pickup_health: new Audio('./assets/pickup_health.wav'),
          pickup_speed: new Audio('./assets/pickup_speed.wav'),
          player_hurt: new Audio('./assets/player_hurt.wav'),
          level_complete: new Audio('./assets/level_complete.wav'),
          game_over: new Audio('./assets/game_over.wav'),

            height = maxHeight;
            width = maxHeight * aspectRatio;
          }

          const targetY = e.clientY - rect.top + game.cameraY;

          if (game.player.currentWeapon === 'regular') {
            if (game.player.ammo > 0) {

              game.player.ammo--;
              setPlayerAmmo(game.player.ammo);

          } else if (game.player.currentWeapon === 'tranquilizer') {
            if (game.player.tranqAmmo > 0) {

              game.player.tranqAmmo--;
              setPlayerTranqAmmo(game.player.tranqAmmo);
              playSound('tranq_shoot');
            }
          }
        };

        canvas.addEventListener('mousemove', handleMouseMove);
        canvas.addEventListener('click', handleClick);
        window.addEventListener('keydown', handleKeyDown);
        window.addEventListener('keyup', handleKeyUp);

        const gameLoop = () => {
          // Pause if pause menu is showing
          if (showPauseMenu) {
            animationId = requestAnimationFrame(gameLoop);

          }

          game.player.inTarPit = false;
          for (const tarPit of game.tarPits) {
            if (circleCollision(game.player.x, game.player.y, game.player.radius, tarPit.x, tarPit.y, tarPit.radius)) {
              game.player.inTarPit = true;
              break;
            }
          }

          // Check electric fence collision with player (can jump over if high enough)
          if (game.player.jumpHeight < GAME_CONSTANTS.PLAYER.JUMP_CLEAR_HEIGHT) {
            for (const fence of game.electricFences) {
              if (circleRectCollision(game.player.x, game.player.y, game.player.radius, fence.x, fence.y, fence.width, fence.height, fence.rotation)) {
                // Damage player with cooldown
                if (fence.playerDamageCooldown <= 0 && game.player.invincibilityTimer <= 0) {
                  const diffMod = DIFFICULTY_MODIFIERS[difficulty];
                  const invincibilityFrames = Math.round(GAME_CONSTANTS.COMBAT.INVINCIBILITY_FRAMES * diffMod.invincibilityMultiplier);

                  game.player.health -= GAME_CONSTANTS.HAZARDS.FENCE_DAMAGE;
                  setPlayerHealth(game.player.health);
                  game.player.invincibilityTimer = invincibilityFrames;
                  game.player.zapTimer = GAME_CONSTANTS.HAZARDS.ZAP_EFFECT_DURATION;
                  fence.playerDamageCooldown = GAME_CONSTANTS.HAZARDS.FENCE_DAMAGE_COOLDOWN;
                  playSound('electric_shock');

                  // Push player back from fence
                  const dx = game.player.x - fence.x;
                  const dy = game.player.y - fence.y;
                  const pushDist = distance(0, 0, dx, dy);
                  if (pushDist > 0) {
                    game.player.x += (dx / pushDist) * GAME_CONSTANTS.HAZARDS.FENCE_PUSHBACK_FORCE;
                    game.player.y += (dy / pushDist) * GAME_CONSTANTS.HAZARDS.FENCE_PUSHBACK_FORCE;
                  }

                  if (game.player.health <= 0) {
                    setGameState('lost');
                    playSound('game_over');
                  }
                }
                break;
              }
            }
          }

          // Update fence cooldowns
          game.electricFences.forEach(fence => {
            if (fence.playerDamageCooldown > 0) {

            }

          // Update speed boost timer and calculate effective speed
          let speedMultiplier = 1;

          if (game.speedBoostTimer > 0) {

          // Apply tar pit slow effect

          game.player.speed = game.player.baseSpeed * speedMultiplier;

          // Update player zap timer
          if (game.player.zapTimer > 0) {
            game.player.zapTimer--;
          }

          // Update jump physics
          if (game.player.isJumping) {
            game.player.jumpHeight += game.player.jumpVelocity;
            game.player.jumpVelocity -= GAME_CONSTANTS.PHYSICS.GRAVITY;

            // Land
            if (game.player.jumpHeight <= 0) {
              game.player.jumpHeight = 0;
              game.player.jumpVelocity = 0;
              game.player.isJumping = false;
            }
          }

          // Update player
          let newX = game.player.x;
          let newY = game.player.y;

          // Handle keyboard input
          if (game.keys['w']) newY -= game.player.speed;
          if (game.keys['s']) newY += game.player.speed;
          if (game.keys['a']) newX -= game.player.speed;
          if (game.keys['d']) newX += game.player.speed;
          if (game.keys['arrowup']) newY -= game.player.speed;
          if (game.keys['arrowdown']) newY += game.player.speed;
          if (game.keys['arrowleft']) newX -= game.player.speed;
          if (game.keys['arrowright']) newX += game.player.speed;

          // Handle touch joystick input
          if (game.touch.joystick.active) {
            const dx = game.touch.joystick.currentX - game.touch.joystick.startX;
            const dy = game.touch.joystick.currentY - game.touch.joystick.startY;
            const magnitude = Math.sqrt(dx * dx + dy * dy);

            if (magnitude > GAME_CONSTANTS.TOUCH.JOYSTICK_DEAD_ZONE) {
              const normalizedDx = dx / magnitude;
              const normalizedDy = dy / magnitude;
              const speedMultiplier = Math.min(magnitude / GAME_CONSTANTS.TOUCH.JOYSTICK_MAX_RANGE, 1);

              newX += normalizedDx * game.player.speed * speedMultiplier;
              newY += normalizedDy * game.player.speed * speedMultiplier;
            }
          }

          // Boundary check
          newX = clamp(newX, game.player.radius, game.mapWidth - game.player.radius);
          newY = clamp(newY, game.player.radius, game.mapHeight - game.player.radius);

          // Collision with obstacles (only when not jumping high enough)
          const collided = checkObstacleCollision(newX, newY, game.player.radius, game.obstacles, game.player.jumpHeight);

          if (!collided) {
            game.player.x = newX;
            game.player.y = newY;
          }

          // Handle touch weapon switching
          if (game.touch.switchWeapon) {
            game.player.currentWeapon = game.player.currentWeapon === 'regular' ? 'tranquilizer' : 'regular';
            setCurrentWeapon(game.player.currentWeapon);
            game.touch.switchWeapon = false;
          }

          // Handle touch shooting (auto-aim at nearest dinosaur)
          if (game.touch.shoot) {

            const targetX = nearestDino ? nearestDino.x : game.player.x + GAME_CONSTANTS.TOUCH.AUTO_AIM_FALLBACK_DISTANCE;
            const targetY = nearestDino ? nearestDino.y : game.player.y;

            if (game.player.currentWeapon === 'regular' && game.player.ammo > 0) {

            } else if (game.player.currentWeapon === 'tranquilizer' && game.player.tranqAmmo > 0) {

              setPlayerTranqAmmo(game.player.tranqAmmo);

          // Update camera

          // Check powerup collection
          game.powerups.forEach(powerup => {

              } else if (powerup.type === 'speed') {

                setSpeedBoostActive(true);
                playSound('pickup_speed');
              }
            }
          });

          // Check tranquilizer depot collection
          game.tranqDepots.forEach(depot => {
            if (!depot.active) return;

            if (circleCollision(game.player.x, game.player.y, game.player.radius, depot.x, depot.y, depot.radius)) {

              game.player.tranqAmmo += depot.ammo;
              setPlayerTranqAmmo(game.player.tranqAmmo);
              playSound('pickup_tranq');
              game.floatingTexts.push(createFloatingText(depot.x, depot.y, `+${depot.ammo}`, '#00FF00'));
            }
          });

          // Update bullets
          game.bullets = game.bullets.filter(bullet => {
            bullet.x += bullet.vx;
            bullet.y += bullet.vy;

            if (bullet.x < 0 || bullet.x > game.mapWidth || bullet.y < 0 || bullet.y > game.mapHeight) {
              return false;
            }

            for (let i = 0; i < game.dinosaurs.length; i++) {
              const dino = game.dinosaurs[i];

              if (circleCollision(bullet.x, bullet.y, bullet.radius, dino.x, dino.y, dino.size)) {
                if (bullet.type === 'tranquilizer') {
                  // Tranquilizer dart - track hits and put to sleep when threshold reached
                  if (!dino.isSleeping) {
                    dino.tranqHits++;
                    playSound('tranq_hit');

                    // Determine shots needed based on dinosaur type
                    let shotsNeeded;
                    if (dino.type === 'raptor') {
                      shotsNeeded = GAME_CONSTANTS.TRANQUILIZER.SHOTS_NEEDED_RAPTOR;
                    } else if (dino.type === 'stego') {
                      shotsNeeded = GAME_CONSTANTS.TRANQUILIZER.SHOTS_NEEDED_STEGO;
                    } else if (dino.type === 'trex') {
                      shotsNeeded = GAME_CONSTANTS.TRANQUILIZER.SHOTS_NEEDED_TREX;
                    } else if (dino.type === 'para') {
                      shotsNeeded = GAME_CONSTANTS.TRANQUILIZER.SHOTS_NEEDED_PARA;
                    } else if (dino.type === 'trike') {
                      shotsNeeded = GAME_CONSTANTS.TRANQUILIZER.SHOTS_NEEDED_TRIKE;
                    } else if (dino.type === 'dilo') {
                      shotsNeeded = GAME_CONSTANTS.TRANQUILIZER.SHOTS_NEEDED_DILO;
                    }

                    // Show hit indicator
                    game.floatingTexts.push(createFloatingText(dino.x, dino.y - dino.size, `${dino.tranqHits}/${shotsNeeded}`, '#00FF00'));

                    // Put to sleep if enough hits
                    if (dino.tranqHits >= shotsNeeded) {
                      dino.isSleeping = true;
                      dino.sleepTimer = getSleepDuration(dino.type);

                      const tranqPoints = Math.round(dino.points * GAME_CONSTANTS.TRANQUILIZER.SCORE_MULTIPLIER);
                      setScore(s => s + tranqPoints);
                      game.floatingTexts.push(createFloatingText(dino.x, dino.y - dino.size - 20, `+${tranqPoints} SLEEP`, '#00E5FF'));
                    }
                  }
                } else {
                  // Regular bullet damages dinosaur
                  dino.health--;
                  playSound('hit');
                  if (dino.health <= 0) {
                    for (let j = 0; j < dino.maxHealth; j++) {
                      game.ammoPickups.push({
                        x: dino.x,
                        y: dino.y,
                        startY: dino.y,
                        vx: (Math.random() - 0.5) * GAME_CONSTANTS.AMMO_PICKUP.HORIZONTAL_VELOCITY_RANGE,
                        vy: GAME_CONSTANTS.AMMO_PICKUP.INITIAL_UPWARD_VELOCITY_MIN + Math.random() * GAME_CONSTANTS.AMMO_PICKUP.INITIAL_UPWARD_VELOCITY_RANGE,
                        radius: GAME_CONSTANTS.AMMO_PICKUP.RADIUS
                      });
                    }
                    setScore(s => s + dino.points);
                    game.floatingTexts.push(createFloatingText(dino.x, dino.y - dino.size, `+${dino.points}`, '#FFD700'));

                    // Remove territory if this was a territorial dinosaur
                    if (dino.territorial && dino.territoryIndex !== undefined) {
                      game.territories.splice(dino.territoryIndex, 1);
                      // Update territory indices for remaining dinosaurs
                      game.dinosaurs.forEach(d => {
                        if (d.territorial && d.territoryIndex !== undefined && d.territoryIndex > dino.territoryIndex) {
                          d.territoryIndex--;
                        }
                      });
                    }

                    playSound('death');
                  }
                }
                return false;
              }
            }

            return true;
          });

          // Update spit projectiles
          game.spit = game.spit.filter(spit => {
            spit.x += spit.vx;
            spit.y += spit.vy;

            // Remove if out of bounds
            if (spit.x < 0 || spit.x > game.mapWidth || spit.y < 0 || spit.y > game.mapHeight) {
              return false;
            }

            // Check collision with player
            if (circleCollision(spit.x, spit.y, spit.radius, game.player.x, game.player.y, game.player.radius)) {
              if (!isInvincible(game.player)) {
                const diffMod = DIFFICULTY_MODIFIERS[difficulty];
                const invincibilityFrames = Math.round(GAME_CONSTANTS.COMBAT.INVINCIBILITY_FRAMES * diffMod.invincibilityMultiplier);

                game.player.health -= GAME_CONSTANTS.AI.SPIT_DAMAGE;
                grantInvincibility(game.player, invincibilityFrames);
                setPlayerHealth(game.player.health);
                playSound('player_hurt');

                if (game.player.health <= 0) {
                  setGameState('lost');
                  playSound('game_over');
                }
              }
              return false;
            }

            return true;
          });

          // Update ammo pickups
          game.ammoPickups = game.ammoPickups.filter(pickup => {
            pickup.x += pickup.vx;
            pickup.y += pickup.vy;
            pickup.vy += GAME_CONSTANTS.PHYSICS.AMMO_GRAVITY;

            if (pickup.y >= pickup.startY && pickup.vy > 0) {
              pickup.y = pickup.startY;
              pickup.vy *= GAME_CONSTANTS.PHYSICS.AMMO_BOUNCE_DAMPING;
              pickup.vx *= GAME_CONSTANTS.PHYSICS.AMMO_FRICTION;
            }

            if (circleCollision(pickup.x, pickup.y, pickup.radius + GAME_CONSTANTS.AMMO_PICKUP.COLLECTION_BONUS_RADIUS, game.player.x, game.player.y, game.player.radius)) {
              game.player.ammo++;
              setPlayerAmmo(game.player.ammo);
              playSound('pickup_ammo');
              return false;
            }

            // Remove ammo when motion stops (velocity too low)
            return Math.abs(pickup.vy) > GAME_CONSTANTS.AMMO_PICKUP.MIN_BOUNCE_VELOCITY || Math.abs(pickup.vx) > GAME_CONSTANTS.AMMO_PICKUP.MIN_BOUNCE_VELOCITY;
          });

          // Update player invincibility
          updateInvincibility(game.player);

          // Update floating texts
          game.floatingTexts = game.floatingTexts.filter(text => {
            text.age++;
            text.y -= GAME_CONSTANTS.FLOATING_TEXT.RISE_SPEED;
            return text.age < text.lifetime;
          });

          // Update dinosaurs
          game.dinosaurs.forEach(dino => {
            // Update zap timer
            if (dino.zapTimer > 0) {
              dino.zapTimer--;
            }

            // Update fence avoidance memory timers
            dino.avoidFences = dino.avoidFences.filter(af => {
              af.timer--;
              return af.timer > 0; // Remove when timer expires
            });

            // Update sleep status
            if (dino.isSleeping) {
              dino.sleepTimer--;
              if (dino.sleepTimer <= 0) {
                dino.isSleeping = false;
                dino.sleepTimer = 0;
                dino.tranqHits = 0; // Reset tranq hits when waking up
              }
              // Sleeping dinosaurs don't move
              dino.vx = 0;
              dino.vy = 0;
              return;
            }

            const dist = distance(dino.x, dino.y, game.player.x, game.player.y);

            if (dino.territorial) {
              // Territorial dinosaurs: aggressive only within territory
              const distFromTerritory = distance(dino.x, dino.y, dino.territoryX, dino.territoryY);
              const playerDistFromTerritory = distance(game.player.x, game.player.y, dino.territoryX, dino.territoryY);

              // Use hysteresis to prevent rapid state switching at boundaries
              const territoryMargin = GAME_CONSTANTS.AI.TERRITORY_MARGIN;
              const returnThreshold = dino.state === 'return' ? GAME_CONSTANTS.AI.TERRITORY_RETURN_THRESHOLD_RETURNING : GAME_CONSTANTS.AI.TERRITORY_RETURN_THRESHOLD_ACTIVE;

              if (playerDistFromTerritory < dino.territoryRadius + territoryMargin && dist < GAME_CONSTANTS.AI.TERRITORY_AGGRO_RANGE) {
                // Chase player if they're in/near territory
                if (dino.state !== 'chase') {
                  dino.state = 'chase';
                }
                const { dx, dy } = normalize(game.player.x - dino.x, game.player.y - dino.y);
                dino.speed = dino.baseSpeed;
                dino.vx = dx * dino.speed;
                dino.vy = dy * dino.speed;

                // Spit attack when in range and off cooldown
                if (dist < GAME_CONSTANTS.AI.SPIT_ATTACK_RANGE && dino.spitCooldown <= 0) {
                  const spitAngle = Math.atan2(game.player.y - dino.y, game.player.x - dino.x);
                  game.spit.push({
                    x: dino.x,
                    y: dino.y,
                    vx: Math.cos(spitAngle) * GAME_CONSTANTS.AI.SPIT_PROJECTILE_SPEED,
                    vy: Math.sin(spitAngle) * GAME_CONSTANTS.AI.SPIT_PROJECTILE_SPEED,
                    radius: GAME_CONSTANTS.AI.SPIT_PROJECTILE_RADIUS
                  });
                  dino.spitCooldown = GAME_CONSTANTS.AI.SPIT_ATTACK_COOLDOWN;
                }
              } else if (distFromTerritory > dino.territoryRadius * returnThreshold) {
                // Return to territory if too far
                if (dino.state !== 'return') {
                  dino.state = 'return';
                }
                const { dx, dy } = normalize(dino.territoryX - dino.x, dino.territoryY - dino.y);
                dino.speed = dino.baseSpeed;
                dino.vx = dx * dino.speed;
                dino.vy = dy * dino.speed;
              } else {
                // Patrol within territory
                dino.state = 'patrol';
                dino.speed = dino.baseSpeed;
                dino.patrolAngle += (Math.random() - 0.5) * GAME_CONSTANTS.AI.PATROL_ANGLE_CHANGE_RATE;
                dino.vx = Math.cos(dino.patrolAngle) * dino.speed * GAME_CONSTANTS.AI.PATROL_SPEED_MULTIPLIER;
                dino.vy = Math.sin(dino.patrolAngle) * dino.speed * GAME_CONSTANTS.AI.PATROL_SPEED_MULTIPLIER;
              }

              // Update spit cooldown
              if (dino.spitCooldown > 0) {
                dino.spitCooldown--;
              }
            } else if (dino.aggressive) {
              // Aggressive dinosaurs chase player
              if (dist < dino.aggroRange) {
                dino.state = 'chase';
                const { dx, dy } = normalize(game.player.x - dino.x, game.player.y - dino.y);
                dino.speed = dino.baseSpeed;
                dino.vx = dx * dino.speed;
                dino.vy = dy * dino.speed;
              } else {
                dino.state = 'patrol';
                dino.speed = dino.baseSpeed;
                dino.patrolAngle += (Math.random() - 0.5) * GAME_CONSTANTS.AI.PATROL_ANGLE_CHANGE_RATE;
                dino.vx = Math.cos(dino.patrolAngle) * dino.speed * GAME_CONSTANTS.AI.PATROL_SPEED_MULTIPLIER;
                dino.vy = Math.sin(dino.patrolAngle) * dino.speed * GAME_CONSTANTS.AI.PATROL_SPEED_MULTIPLIER;
              }
            } else {
              // Herbivores flee from player
              if (dist < dino.fleeRange) {
                dino.state = 'flee';
                const { dx, dy } = normalize(dino.x - game.player.x, dino.y - game.player.y); // Flee away from player
                dino.speed = dino.baseSpeed * GAME_CONSTANTS.AI.HERBIVORE_FLEE_SPEED_MULTIPLIER;
                dino.vx = dx * dino.speed;
                dino.vy = dy * dino.speed;
              } else {
                dino.state = 'patrol';
                dino.speed = dino.baseSpeed;
                dino.patrolAngle += (Math.random() - 0.5) * GAME_CONSTANTS.AI.PATROL_ANGLE_CHANGE_RATE;
                dino.vx = Math.cos(dino.patrolAngle) * dino.speed * GAME_CONSTANTS.AI.PATROL_SPEED_MULTIPLIER;
                dino.vy = Math.sin(dino.patrolAngle) * dino.speed * GAME_CONSTANTS.AI.PATROL_SPEED_MULTIPLIER;
              }
            }

            // Check if dinosaur is in tar pit and apply slow effect
            let dinoInTarPit = false;
            for (const tarPit of game.tarPits) {
              if (circleCollision(dino.x, dino.y, dino.size, tarPit.x, tarPit.y, tarPit.radius)) {
                dinoInTarPit = true;
                break;
              }
            }

            // Apply tar pit slow effect to velocity
            let effectiveVx = dino.vx;
            let effectiveVy = dino.vy;
            if (dinoInTarPit) {
              effectiveVx *= GAME_CONSTANTS.HAZARDS.TAR_PIT_SLOW_MULTIPLIER;
              effectiveVy *= GAME_CONSTANTS.HAZARDS.TAR_PIT_SLOW_MULTIPLIER;
            }

            // Calculate new position
            let newDinoX = dino.x + effectiveVx;
            let newDinoY = dino.y + effectiveVy;

            // Check collision with obstacles
            let dinoCollided = false;
            for (const obs of game.obstacles) {
              if (circleCollision(newDinoX, newDinoY, dino.size, obs.x, obs.y, obs.radius)) {
                dinoCollided = true;

                // Obstacle avoidance: try steering around the obstacle
                const angle = Math.atan2(dino.vy, dino.vx);
                const avoidAngleLeft = angle + Math.PI / 2;
                const avoidAngleRight = angle - Math.PI / 2;

                // Try turning left
                const tryLeftX = dino.x + Math.cos(avoidAngleLeft) * dino.speed;
                const tryLeftY = dino.y + Math.sin(avoidAngleLeft) * dino.speed;
                const leftDist = distance(tryLeftX, tryLeftY, obs.x, obs.y);

                // Try turning right
                const tryRightX = dino.x + Math.cos(avoidAngleRight) * dino.speed;
                const tryRightY = dino.y + Math.sin(avoidAngleRight) * dino.speed;
                const rightDist = distance(tryRightX, tryRightY, obs.x, obs.y);

                // Choose the direction that moves farther from obstacle
                if (leftDist > rightDist && leftDist > dino.size + obs.radius) {
                  newDinoX = tryLeftX;
                  newDinoY = tryLeftY;
                  dinoCollided = false;
                } else if (rightDist > dino.size + obs.radius) {
                  newDinoX = tryRightX;
                  newDinoY = tryRightY;
                  dinoCollided = false;
                } else {
                  // If both directions blocked, reverse and pick new angle
                  dino.patrolAngle = Math.random() * Math.PI * 2;
                  newDinoX = dino.x;
                  newDinoY = dino.y;
                }
                break;
              }
            }

            // Check collision with remembered fences (learned avoidance with safety buffer)
            if (!dinoCollided) {
              for (const avoidFence of dino.avoidFences) {
                const fence = avoidFence.fence;
                const safeRadius = dino.size + GAME_CONSTANTS.HAZARDS.FENCE_AVOIDANCE_BUFFER;

                if (circleRectCollision(newDinoX, newDinoY, safeRadius, fence.x, fence.y, fence.width, fence.height, fence.rotation)) {
                  dinoCollided = true;

                  // Fence avoidance: try steering around the fence
                  const angle = Math.atan2(dino.vy, dino.vx);
                  const avoidAngleLeft = angle + Math.PI / 2;
                  const avoidAngleRight = angle - Math.PI / 2;

                  // Try turning left (check with safety buffer)
                  const tryLeftX = dino.x + Math.cos(avoidAngleLeft) * dino.speed;
                  const tryLeftY = dino.y + Math.sin(avoidAngleLeft) * dino.speed;
                  const leftClear = !circleRectCollision(tryLeftX, tryLeftY, safeRadius, fence.x, fence.y, fence.width, fence.height, fence.rotation);

                  // Try turning right (check with safety buffer)
                  const tryRightX = dino.x + Math.cos(avoidAngleRight) * dino.speed;
                  const tryRightY = dino.y + Math.sin(avoidAngleRight) * dino.speed;
                  const rightClear = !circleRectCollision(tryRightX, tryRightY, safeRadius, fence.x, fence.y, fence.width, fence.height, fence.rotation);

                  // Choose the direction that avoids the fence
                  if (leftClear && !rightClear) {
                    newDinoX = tryLeftX;
                    newDinoY = tryLeftY;
                    dinoCollided = false;
                  } else if (rightClear) {
                    newDinoX = tryRightX;
                    newDinoY = tryRightY;
                    dinoCollided = false;
                  } else if (leftClear) {
                    newDinoX = tryLeftX;
                    newDinoY = tryLeftY;
                    dinoCollided = false;
                  } else {
                    // If both directions blocked, reverse and pick new angle
                    dino.patrolAngle = Math.random() * Math.PI * 2;
                    newDinoX = dino.x;
                    newDinoY = dino.y;
                  }
                  break;
                }
              }
            }

            // Apply movement if no collision
            if (!dinoCollided) {
              dino.x = newDinoX;
              dino.y = newDinoY;
            }

            // Check electric fence collision with dinosaurs
            for (const fence of game.electricFences) {
              if (circleRectCollision(dino.x, dino.y, dino.size, fence.x, fence.y, fence.width, fence.height, fence.rotation)) {
                // Bounce dinosaur back
                const dx = dino.x - fence.x;
                const dy = dino.y - fence.y;
                const pushDist = distance(0, 0, dx, dy);
                if (pushDist > 0) {
                  dino.x += (dx / pushDist) * GAME_CONSTANTS.HAZARDS.FENCE_PUSHBACK_FORCE;
                  dino.y += (dy / pushDist) * GAME_CONSTANTS.HAZARDS.FENCE_PUSHBACK_FORCE;
                }

                // Stun dinosaur (use sleep mechanism with half duration)
                if (!dino.isSleeping) {
                  const baseSleepDuration = getSleepDuration(dino.type);
                  dino.isSleeping = true;
                  dino.sleepTimer = Math.round(baseSleepDuration * GAME_CONSTANTS.HAZARDS.FENCE_STUN_DURATION_MULTIPLIER);
                  dino.zapTimer = GAME_CONSTANTS.HAZARDS.ZAP_EFFECT_DURATION;

                  // Learn to avoid this fence
                  if (!dino.avoidFences.some(af => af.fence === fence)) {
                    dino.avoidFences.push({
                      fence: fence,
                      timer: GAME_CONSTANTS.HAZARDS.FENCE_MEMORY_DURATION
                    });
                  }

                  // Play sound only if player is close enough to hear it
                  const distToPlayer = distance(dino.x, dino.y, game.player.x, game.player.y);
                  if (distToPlayer < GAME_CONSTANTS.HAZARDS.ZAP_SOUND_MAX_DISTANCE) {

                  }

                  // Don't reset tranq hits or affect scoring - this is stun, not tranq
                }
                break;

            }

            // Update facing direction only when velocity has significant horizontal component
            if (Math.abs(dino.vx) > GAME_CONSTANTS.AI.FACING_DIRECTION_THRESHOLD) {

            const prevX = dino.x;
            const prevY = dino.y;
            clampToBounds(dino, dino.size, game.mapWidth, game.mapHeight);
            if (dino.x !== prevX || dino.y !== prevY) {
              dino.patrolAngle = Math.random() * Math.PI * 2;
            }

            // Only aggressive dinosaurs that aren't sleeping can damage player
            if (dino.aggressive && !dino.isSleeping && circleCollision(game.player.x, game.player.y, game.player.radius, dino.x, dino.y, dino.size)) {
              const diffMod = DIFFICULTY_MODIFIERS[difficulty];
              const invincibilityFrames = Math.round(GAME_CONSTANTS.COMBAT.INVINCIBILITY_FRAMES * diffMod.invincibilityMultiplier);

              const damageTaken = handleCollisionDamage(
                dino,           // attacker
                game.player,    // victim
                GAME_CONSTANTS.COMBAT.DINOSAUR_DAMAGE,
                GAME_CONSTANTS.COMBAT.PUSHBACK_FORCE,
                invincibilityFrames,
                playSound       // sound callback
              );

              if (damageTaken) {
                setPlayerHealth(game.player.health);

                // Clamp player to bounds after pushback
                clampToBounds(game.player, game.player.radius, game.mapWidth, game.mapHeight);

                if (game.player.health <= 0) {
                  setGameState('lost');
                  playSound('game_over');
                }
              }
            }
          });

          // Check win condition
          const exitCenterX = game.exit.x + game.exit.width / 2;
          const exitCenterY = game.exit.y + game.exit.height / 2;
          if (distance(game.player.x, game.player.y, exitCenterX, exitCenterY) < game.player.radius + GAME_CONSTANTS.MAP.EXIT_COLLISION_RADIUS) {
            if (currentLevel < 3) {
              setGameState('levelComplete');
              playSound('level_complete');
            } else {
              setGameState('won');
              playSound('victory');
            }
          }

          // Render
          ctx.fillStyle = '#3a5f3a';
          ctx.fillRect(0, 0, canvas.width, canvas.height);

          ctx.fillStyle = '#2d4a2d';
          for (let i = 0; i < GAME_CONSTANTS.RENDER.GRASS_PATCHES; i++) {
            const gx = (i * 73) % game.mapWidth - game.cameraX;
            const gy = (i * 97) % game.mapHeight - game.cameraY;
            ctx.fillRect(gx, gy, GAME_CONSTANTS.RENDER.GRASS_PATCH_SIZE, GAME_CONSTANTS.RENDER.GRASS_PATCH_SIZE);
          }

          // Draw exit
          const exitScreenX = game.exit.x - game.cameraX;
          const exitScreenY = game.exit.y - game.cameraY;
          ctx.fillStyle = '#FFD700';
          ctx.fillRect(exitScreenX, exitScreenY, game.exit.width, game.exit.height);
          ctx.strokeStyle = '#FFA500';
          ctx.lineWidth = 3;
          ctx.strokeRect(exitScreenX, exitScreenY, game.exit.width, game.exit.height);
          ctx.fillStyle = '#000';
          ctx.font = '14px Arial';
          ctx.textAlign = 'center';
          ctx.fillText('EXIT', exitScreenX + game.exit.width / 2, exitScreenY + game.exit.height / 2 + 5);

          // Draw tar pits
          game.tarPits.forEach(tarPit => {
            const screenX = tarPit.x - game.cameraX;
            const screenY = tarPit.y - game.cameraY;

            // Dark tar pit
            ctx.fillStyle = '#1a0a00';
            ctx.beginPath();
            ctx.arc(screenX, screenY, tarPit.radius, 0, Math.PI * 2);
            ctx.fill();

            // Lighter brown rim
            ctx.strokeStyle = '#3d2817';
            ctx.lineWidth = GAME_CONSTANTS.HAZARDS.TAR_PIT_RIM_WIDTH;
            ctx.stroke();

            // Update and draw multiple bubbles
            tarPit.bubbles.forEach(bubble => {
              bubble.timer++;
              if (bubble.timer >= GAME_CONSTANTS.HAZARDS.TAR_PIT_BUBBLE_FREQUENCY) {
                bubble.timer = 0;
                // Randomize position for next cycle
                bubble.offsetX = (Math.random() - 0.5) * GAME_CONSTANTS.HAZARDS.TAR_PIT_BUBBLE_SPREAD;
                bubble.offsetY = (Math.random() - 0.5) * GAME_CONSTANTS.HAZARDS.TAR_PIT_BUBBLE_SPREAD;
              }

              // Draw bubble during active phase
              if (bubble.timer < GAME_CONSTANTS.HAZARDS.TAR_PIT_BUBBLE_DURATION) {
                const bubbleProgress = bubble.timer / GAME_CONSTANTS.HAZARDS.TAR_PIT_BUBBLE_DURATION;
                const bubbleRadius = GAME_CONSTANTS.HAZARDS.TAR_PIT_BUBBLE_BASE_RADIUS + bubbleProgress * GAME_CONSTANTS.HAZARDS.TAR_PIT_BUBBLE_GROWTH;
                const bubbleAlpha = 1 - bubbleProgress;

                ctx.fillStyle = `rgba(61, 40, 23, ${bubbleAlpha})`;
                ctx.beginPath();
                ctx.arc(screenX + bubble.offsetX, screenY + bubble.offsetY, bubbleRadius, 0, Math.PI * 2);
                ctx.fill();
              }
            });
          });

          // Draw electric fences
          game.electricFences.forEach(fence => {
            const screenX = fence.x - game.cameraX;
            const screenY = fence.y - game.cameraY;

            ctx.save();
            ctx.translate(screenX, screenY);
            ctx.rotate(fence.rotation);

            // Fence base (dark gray/black)
            ctx.fillStyle = '#2a2a2a';
            ctx.fillRect(-fence.width / 2, -fence.height / 2, fence.width, fence.height);

            // Electric wires (yellow)
            ctx.strokeStyle = '#FFD700';
            ctx.lineWidth = GAME_CONSTANTS.HAZARDS.FENCE_WIRE_WIDTH;
            ctx.beginPath();
            ctx.moveTo(-fence.width / 2, -fence.height / 4);
            ctx.lineTo(fence.width / 2, -fence.height / 4);
            ctx.moveTo(-fence.width / 2, fence.height / 4);
            ctx.lineTo(fence.width / 2, fence.height / 4);
            ctx.stroke();

            // Update spark animation
            fence.sparkTimer++;
            if (fence.sparkTimer >= GAME_CONSTANTS.HAZARDS.FENCE_SPARK_FREQUENCY) {
              fence.sparkTimer = 0;
            }

            // Draw sparks at intervals
            if (fence.sparkTimer < GAME_CONSTANTS.HAZARDS.FENCE_SPARK_DURATION) {
              const sparkProgress = fence.sparkTimer / GAME_CONSTANTS.HAZARDS.FENCE_SPARK_DURATION;
              const sparkAlpha = 1 - sparkProgress;

              ctx.fillStyle = `rgba(255, 255, 100, ${sparkAlpha})`;
              ctx.beginPath();
              ctx.arc(Math.random() * fence.width - fence.width / 2, 0, GAME_CONSTANTS.HAZARDS.FENCE_SPARK_RADIUS, 0, Math.PI * 2);
              ctx.fill();
            }

            ctx.restore();
          });

          // Draw obstacles
          game.obstacles.forEach(obs => {
            const screenX = obs.x - game.cameraX;
            const screenY = obs.y - game.cameraY;

            if (obs.type === 'tree') {
              ctx.fillStyle = '#654321';
              ctx.fillRect(screenX - 5, screenY - 5, 10, 15);
              ctx.fillStyle = '#228B22';
              ctx.beginPath();
              ctx.arc(screenX, screenY - 10, obs.radius, 0, Math.PI * 2);
              ctx.fill();
            } else {
              ctx.fillStyle = '#2F4F2F';
              ctx.beginPath();
              ctx.arc(screenX, screenY, obs.radius, 0, Math.PI * 2);
              ctx.fill();
            }
          });

          // Draw powerups
          game.powerups.forEach(powerup => {
            if (!powerup.active) return;

            const screenX = powerup.x - game.cameraX;
            const screenY = powerup.y - game.cameraY;

            if (powerup.type === 'health') {
              ctx.fillStyle = '#ff1744';
              ctx.strokeStyle = '#fff';
              ctx.lineWidth = 2;
              ctx.beginPath();
              ctx.arc(screenX, screenY, powerup.radius, 0, Math.PI * 2);
              ctx.fill();
              ctx.stroke();

              // Draw cross
              ctx.strokeStyle = '#fff';
              ctx.lineWidth = 3;
              ctx.beginPath();
              ctx.moveTo(screenX - 5, screenY);
              ctx.lineTo(screenX + 5, screenY);
              ctx.moveTo(screenX, screenY - 5);
              ctx.lineTo(screenX, screenY + 5);
              ctx.stroke();
            } else if (powerup.type === 'speed') {
              ctx.fillStyle = '#00e5ff';
              ctx.strokeStyle = '#fff';
              ctx.lineWidth = 2;
              ctx.beginPath();
              ctx.arc(screenX, screenY, powerup.radius, 0, Math.PI * 2);
              ctx.fill();
              ctx.stroke();

              // Draw lightning bolt
              ctx.fillStyle = '#fff';
              ctx.beginPath();
              ctx.moveTo(screenX + 2, screenY - 6);
              ctx.lineTo(screenX - 2, screenY);
              ctx.lineTo(screenX + 1, screenY);
              ctx.lineTo(screenX - 2, screenY + 6);
              ctx.lineTo(screenX + 2, screenY);
              ctx.lineTo(screenX - 1, screenY);
              ctx.closePath();
              ctx.fill();
            }
          });

          // Draw tranquilizer depots
          game.tranqDepots.forEach(depot => {
            if (!depot.active) return;

            const screenX = depot.x - game.cameraX;
            const screenY = depot.y - game.cameraY;

            // Draw green crate
            ctx.fillStyle = '#228B22';
            ctx.strokeStyle = '#006400';

            ctx.fillRect(screenX - depot.radius, screenY - depot.radius, depot.radius * 2, depot.radius * 2);

            // Draw syringe icon
            ctx.fillStyle = '#00FF00';
            ctx.beginPath();
            ctx.arc(screenX, screenY - 3, 3, 0, Math.PI * 2);
            ctx.fill();
            ctx.fillStyle = '#FFF';
            ctx.fillRect(screenX - 1, screenY, 2, 6);
            ctx.fillRect(screenX - 3, screenY + 6, 6, 2);
          });

          // Draw territories (skull markers at center)
          game.territories.forEach(territory => {
            const screenX = territory.x - game.cameraX;
            const screenY = territory.y - game.cameraY;

            // Draw skull marker
            ctx.fillStyle = '#8B0000';
            ctx.font = '24px Arial';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillText('💀', screenX, screenY);

            // Draw territory circle outline (faint)
            ctx.strokeStyle = 'rgba(139, 0, 0, 0.2)';
            ctx.lineWidth = 2;
            ctx.setLineDash([5, 5]);
            ctx.beginPath();
            ctx.arc(screenX, screenY, territory.radius, 0, Math.PI * 2);
            ctx.stroke();
            ctx.setLineDash([]);

          // Draw dinosaurs
          game.dinosaurs.forEach(dino => {
            const screenX = dino.x - game.cameraX;
            const screenY = dino.y - game.cameraY;

            ctx.save();
            ctx.translate(screenX, screenY);

            if (dino.facingLeft) {

            if (dino.type === 'raptor') {

              ctx.quadraticCurveTo(-28 * scale, -3 * scale, -15 * scale, 4 * scale);

              // Back leg (powerful haunches)
              ctx.fillStyle = '#B8860B';

              ctx.ellipse(-8 * scale, 8 * scale, 6 * scale, 10 * scale, Math.PI * 0.2, 0, Math.PI * 2);
              ctx.fill();

              // Lower leg
              ctx.fillStyle = '#CD7F32';
              ctx.fillRect(-10 * scale, 15 * scale, 3 * scale, 8 * scale);

              // Clawed foot
              ctx.fillStyle = '#8B4513';
              ctx.beginPath();
              ctx.moveTo(-12 * scale, 23 * scale);
              ctx.lineTo(-10 * scale, 20 * scale);
              ctx.lineTo(-8 * scale, 23 * scale);
              ctx.lineTo(-10 * scale, 24 * scale);
              ctx.fill();

              // Body (lean and muscular)
              ctx.fillStyle = '#DAA520';
              ctx.beginPath();
              ctx.ellipse(0, 0, 18 * scale, 10 * scale, -Math.PI * 0.1, 0, Math.PI * 2);

              ctx.fillStyle = '#DAA520';
              ctx.beginPath();

              // Head (elongated snout)
              ctx.fillStyle = '#CD7F32';
              ctx.beginPath();
              ctx.ellipse(20 * scale, -8 * scale, 10 * scale, 6 * scale, 0, 0, Math.PI * 2);
              ctx.fill();

              // Snout detail
              ctx.fillStyle = '#8B4513';
              ctx.beginPath();
              ctx.ellipse(26 * scale, -8 * scale, 4 * scale, 3 * scale, 0, 0, Math.PI * 2);
              ctx.fill();

              // Eye (predatory)
              ctx.fillStyle = '#FFD700';
              ctx.beginPath();
              ctx.ellipse(18 * scale, -10 * scale, 3 * scale, 4 * scale, 0, 0, Math.PI * 2);
              ctx.fill();
              ctx.fillStyle = '#000';
              ctx.beginPath();
              ctx.ellipse(19 * scale, -10 * scale, 1.5 * scale, 2 * scale, 0, 0, Math.PI * 2);
              ctx.fill();

              // Teeth
              ctx.strokeStyle = '#FFF';
              ctx.lineWidth = 1.5 * scale;
              for (let i = 0; i < 5; i++) {
                ctx.beginPath();
                ctx.moveTo(20 * scale + i * 2 * scale, -6 * scale);
                ctx.lineTo(20 * scale + i * 2 * scale, -4 * scale);
                ctx.stroke();
              }

              // Small arms
              ctx.fillStyle = '#CD7F32';
              ctx.beginPath();
              ctx.ellipse(8 * scale, 4 * scale, 3 * scale, 5 * scale, Math.PI * 0.5, 0, Math.PI * 2);
              ctx.fill();

              // Stripes on back
              ctx.strokeStyle = '#8B4513';
              ctx.lineWidth = 2 * scale;
              for (let i = 0; i < 4; i++) {
                ctx.beginPath();
                ctx.moveTo(-5 * scale + i * 6 * scale, -8 * scale);
                ctx.lineTo(-8 * scale + i * 6 * scale, -2 * scale);
                ctx.stroke();
              }

            } else if (dino.type === 'trex') {
              // T-Rex - massive head, tiny arms, powerful build
              const scale = dino.size / 35;

              // Tail (thick and powerful)
              ctx.fillStyle = '#2E7D32';
              ctx.beginPath();
              ctx.moveTo(-20 * scale, 0);
              ctx.quadraticCurveTo(-40 * scale, 5 * scale, -50 * scale, 0);
              ctx.lineTo(-48 * scale, 3 * scale);
              ctx.quadraticCurveTo(-38 * scale, 8 * scale, -20 * scale, 5 * scale);
              ctx.fill();

              // Massive leg
              ctx.fillStyle = '#1B5E20';
              ctx.beginPath();
              ctx.ellipse(-10 * scale, 12 * scale, 10 * scale, 15 * scale, 0, 0, Math.PI * 2);
              ctx.fill();

              // Lower leg
              ctx.fillStyle = '#2E7D32';
              ctx.fillRect(-13 * scale, 22 * scale, 6 * scale, 12 * scale);

              // Large foot
              ctx.fillStyle = '#1B5E20';
              ctx.beginPath();
              ctx.ellipse(-10 * scale, 34 * scale, 8 * scale, 4 * scale, 0, 0, Math.PI * 2);
              ctx.fill();

              // Three-toed claws
              ctx.fillStyle = '#000';
              for (let i = -1; i <= 1; i++) {
                ctx.beginPath();
                ctx.moveTo(-10 * scale + i * 4 * scale, 34 * scale);
                ctx.lineTo(-10 * scale + i * 5 * scale, 38 * scale);
                ctx.lineTo(-10 * scale + i * 3 * scale, 36 * scale);
                ctx.fill();
              }

              // Body (massive and robust)
              ctx.fillStyle = '#388E3C';
              ctx.beginPath();
              ctx.ellipse(0, 0, 25 * scale, 18 * scale, -Math.PI * 0.15, 0, Math.PI * 2);
              ctx.fill();

              // Chest (lighter belly)
              ctx.fillStyle = '#81C784';
              ctx.beginPath();
              ctx.ellipse(5 * scale, 5 * scale, 15 * scale, 12 * scale, -Math.PI * 0.15, 0, Math.PI * 2);
              ctx.fill();

              // Neck (thick)
              ctx.fillStyle = '#388E3C';
              ctx.beginPath();
              ctx.ellipse(18 * scale, -8 * scale, 10 * scale, 8 * scale, Math.PI * 0.4, 0, Math.PI * 2);
              ctx.fill();

              // MASSIVE head
              ctx.fillStyle = '#2E7D32';
              ctx.beginPath();
              ctx.ellipse(32 * scale, -12 * scale, 18 * scale, 12 * scale, 0, 0, Math.PI * 2);
              ctx.fill();

              // Lower jaw
              ctx.fillStyle = '#1B5E20';
              ctx.beginPath();
              ctx.ellipse(35 * scale, -5 * scale, 15 * scale, 6 * scale, 0, 0, Math.PI * 2);
              ctx.fill();

              // Eye (small and menacing)
              ctx.fillStyle = '#FFF';
              ctx.beginPath();
              ctx.arc(28 * scale, -16 * scale, 4 * scale, 0, Math.PI * 2);
              ctx.fill();
              ctx.fillStyle = '#8B0000';
              ctx.beginPath();
              ctx.arc(29 * scale, -16 * scale, 2 * scale, 0, Math.PI * 2);
              ctx.fill();

              // Nostril
              ctx.fillStyle = '#000';
              ctx.beginPath();
              ctx.ellipse(42 * scale, -10 * scale, 2 * scale, 1.5 * scale, 0, 0, Math.PI * 2);
              ctx.fill();

              // Large teeth
              ctx.fillStyle = '#FFF';
              for (let i = 0; i < 8; i++) {
                ctx.beginPath();
                ctx.moveTo(25 * scale + i * 3.5 * scale, -8 * scale);
                ctx.lineTo(26 * scale + i * 3.5 * scale, -15 * scale);
                ctx.lineTo(27 * scale + i * 3.5 * scale, -8 * scale);
                ctx.fill();

                // Bottom teeth
                ctx.beginPath();
                ctx.moveTo(25 * scale + i * 3.5 * scale, -2 * scale);
                ctx.lineTo(26 * scale + i * 3.5 * scale, 2 * scale);
                ctx.lineTo(27 * scale + i * 3.5 * scale, -2 * scale);
                ctx.fill();
              }

              // Comically tiny arms
              ctx.fillStyle = '#388E3C';
              ctx.beginPath();
              ctx.ellipse(12 * scale, 6 * scale, 3 * scale, 6 * scale, Math.PI * 0.3, 0, Math.PI * 2);
              ctx.fill();

              // Tiny claws
              ctx.strokeStyle = '#1B5E20';
              ctx.lineWidth = 1 * scale;
              ctx.beginPath();
              ctx.moveTo(13 * scale, 11 * scale);
              ctx.lineTo(14 * scale, 13 * scale);
              ctx.stroke();

            } else if (dino.type === 'stego') {
              // Stegosaurus - distinctive plates and spiked tail
              const scale = dino.size / 30;

              // Tail with spikes
              ctx.fillStyle = '#7B1FA2';
              ctx.beginPath();
              ctx.moveTo(-18 * scale, 2 * scale);
              ctx.quadraticCurveTo(-35 * scale, -2 * scale, -45 * scale, -5 * scale);
              ctx.lineTo(-43 * scale, -2 * scale);
              ctx.quadraticCurveTo(-33 * scale, 1 * scale, -18 * scale, 5 * scale);
              ctx.fill();

              // Tail spikes (thagomizer)
              ctx.fillStyle = '#F06292';
              for (let i = 0; i < 4; i++) {
                ctx.beginPath();
                ctx.moveTo(-35 * scale - i * 5 * scale, -3 * scale);
                ctx.lineTo(-38 * scale - i * 5 * scale, -12 * scale);
                ctx.lineTo(-32 * scale - i * 5 * scale, -5 * scale);
                ctx.closePath();
                ctx.fill();
                ctx.strokeStyle = '#C2185B';
                ctx.lineWidth = 1;
                ctx.stroke();
              }

              // Back legs (sturdy)
              ctx.fillStyle = '#6A1B9A';
              ctx.fillRect(-12 * scale, 10 * scale, 8 * scale, 12 * scale);
              ctx.fillRect(-2 * scale, 10 * scale, 8 * scale, 12 * scale);

              // Feet
              ctx.fillStyle = '#4A148C';
              ctx.fillRect(-13 * scale, 22 * scale, 10 * scale, 3 * scale);
              ctx.fillRect(-3 * scale, 22 * scale, 10 * scale, 3 * scale);

              // Front legs (shorter)
              ctx.fillRect(10 * scale, 12 * scale, 6 * scale, 10 * scale);
              ctx.fillRect(18 * scale, 12 * scale, 6 * scale, 10 * scale);

              // Body (large and rounded)
              ctx.fillStyle = '#9C27B0';
              ctx.beginPath();
              ctx.ellipse(0, 0, 28 * scale, 14 * scale, 0, 0, Math.PI * 2);
              ctx.fill();

              // Belly (lighter)
              ctx.fillStyle = '#BA68C8';
              ctx.beginPath();
              ctx.ellipse(0, 6 * scale, 22 * scale, 10 * scale, 0, 0, Math.PI * 2);
              ctx.fill();

              // Distinctive back plates (alternating heights)
              for (let i = 0; i < 7; i++) {
                const isHigh = i % 2 === 0;
                const height = isHigh ? 22 : 16;
                const xPos = -15 * scale + i * 6 * scale;

                ctx.fillStyle = '#E91E63';
                ctx.beginPath();
                ctx.moveTo(xPos - 3 * scale, -8 * scale);
                ctx.lineTo(xPos, -height * scale);
                ctx.lineTo(xPos + 3 * scale, -8 * scale);
                ctx.closePath();
                ctx.fill();

                // Plate outline and details
                ctx.strokeStyle = '#C2185B';
                ctx.lineWidth = 1.5;
                ctx.stroke();

                // Inner detail
                ctx.strokeStyle = '#F48FB1';
                ctx.lineWidth = 0.8;
                ctx.beginPath();
                ctx.moveTo(xPos - 1.5 * scale, -8 * scale);
                ctx.lineTo(xPos, -(height - 2) * scale);
                ctx.lineTo(xPos + 1.5 * scale, -8 * scale);

              }

              // Neck
              ctx.fillStyle = '#9C27B0';
              ctx.beginPath();
              ctx.ellipse(20 * scale, -2 * scale, 8 * scale, 6 * scale, -Math.PI * 0.3, 0, Math.PI * 2);
              ctx.fill();

              // Head (small and low)
              ctx.fillStyle = '#7B1FA2';
              ctx.beginPath();
              ctx.ellipse(30 * scale, 0, 8 * scale, 6 * scale, 0, 0, Math.PI * 2);
